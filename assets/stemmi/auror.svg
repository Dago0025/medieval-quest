<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <!-- Stemma degli Auror: d'argento, al drago a tre teste di nero, con le ali spiegate. Disegno originale per MTW Remake. -->
  <defs>
    <linearGradient id="campo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d8d4cb"/>
    </linearGradient>
    <clipPath id="scudo"><path d="M12,12 H188 V112 C188,168 142,206 100,228 C58,206 12,168 12,112 Z"/></clipPath>
    <!-- testa rivolta a destra; origine all'attacco del collo -->
    <g id="testa">
      <path d="M-2,5 C2,-3 9,-9 17,-9 C21,-9 25,-8 29,-6 L36,-5 L31,-2 L37,1 L30,2 L24,4 C18,8 8,10 -2,9 Z"/>
      <path d="M5,-7 L-3,-17 L11,-9 Z"/>
      <path d="M12,-8 L9,-15 L16,-9 Z"/>
      <circle cx="19" cy="-4" r="1.8" fill="#ffffff" stroke="none"/>
    </g>
  </defs>
  <path d="M12,12 H188 V112 C188,168 142,206 100,228 C58,206 12,168 12,112 Z" fill="url(#campo)"/>
  <g clip-path="url(#scudo)" fill="#141414" stroke="#141414" stroke-linejoin="round" stroke-linecap="round">
    <!-- ali spiegate con le nervature -->
    <path stroke-width="1" d="M90,130 C74,114 56,102 30,86 C34,100 32,108 26,114 C36,115 40,120 39,128 C32,130 28,134 27,140 C37,139 44,143 46,150 C58,144 74,144 88,148 Z"/>
    <path stroke-width="1" d="M110,130 C126,114 144,102 170,86 C166,100 168,108 174,114 C164,115 160,120 161,128 C168,130 172,134 173,140 C163,139 156,143 154,150 C142,144 126,144 112,148 Z"/>
    <g fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.75">
      <path d="M86,132 C70,118 52,106 33,90"/><path d="M85,136 C68,128 50,122 29,116"/><path d="M85,140 C68,138 50,138 30,138"/>
      <path d="M114,132 C130,118 148,106 167,90"/><path d="M115,136 C132,128 150,122 171,116"/><path d="M115,140 C132,138 150,138 170,138"/>
    </g>
    <!-- colli sinuosi, staccati dalle ali da un filo bianco -->
    <g fill="none" stroke="#ffffff" stroke-width="14">
      <path d="M100,120 C96,100 104,80 98,60"/>
      <path d="M93,122 C84,104 74,92 66,80 C62,72 58,66 53,62"/>
      <path d="M107,122 C116,104 126,92 134,80 C138,72 142,66 147,62"/>
    </g>
    <path fill="none" stroke-width="9" d="M100,120 C96,100 104,80 98,60"/>
    <path fill="none" stroke-width="8" d="M93,122 C84,104 74,92 66,80 C62,72 58,66 53,62"/>
    <path fill="none" stroke-width="8" d="M107,122 C116,104 126,92 134,80 C138,72 142,66 147,62"/>
    <!-- teste: centrale in alto a sinistra, laterali verso l'esterno -->
    <use href="#testa" transform="translate(98,60) scale(-1,1) rotate(-60)" fill="#ffffff" stroke="#ffffff" stroke-width="4"/>
    <use href="#testa" transform="translate(53,62) scale(-1,1) rotate(-20)" fill="#ffffff" stroke="#ffffff" stroke-width="4"/>
    <use href="#testa" transform="translate(147,62) rotate(-20)" fill="#ffffff" stroke="#ffffff" stroke-width="4"/>
    <use href="#testa" transform="translate(98,60) scale(-1,1) rotate(-60)"/>
    <use href="#testa" transform="translate(53,62) scale(-1,1) rotate(-20)"/>
    <use href="#testa" transform="translate(147,62) rotate(-20)"/>
    <!-- corpo con il petto -->
    <path stroke-width="1" d="M86,118 C78,132 79,154 88,168 C95,178 107,178 113,168 C122,154 122,132 114,118 C106,111 94,111 86,118 Z"/>
    <path fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.6" d="M94,130 H106 M93,140 H107 M93,150 H107 M95,160 H105"/>
    <!-- zampe anteriori con gli artigli -->
    <path fill="none" stroke-width="6" d="M88,134 C80,138 74,142 68,150"/>
    <path fill="none" stroke-width="6" d="M112,134 C120,138 126,142 132,150"/>
    <path stroke-width="1" d="M70,148 L60,152 L66,155 L62,159 L70,157 L72,152 Z"/>
    <path stroke-width="1" d="M130,148 L140,152 L134,155 L138,159 L130,157 L128,152 Z"/>
    <!-- zampe posteriori -->
    <path fill="none" stroke-width="8" d="M90,164 C82,176 78,184 72,192"/>
    <path fill="none" stroke-width="8" d="M110,164 C118,176 122,184 128,192"/>
    <path stroke-width="1" d="M64,192 L80,190 L78,197 L72,195 L68,199 Z"/>
    <path stroke-width="1" d="M136,192 L120,190 L122,197 L128,195 L132,199 Z"/>
    <!-- coda arrotolata con punta a freccia -->
    <path fill="none" stroke-width="6" d="M100,176 C102,192 96,204 86,206 C74,208 70,198 76,192 C81,187 89,191 86,198"/>
    <path stroke-width="1" d="M86,198 L80,204 L82,195 L91,195 Z"/>
  </g>
  <path d="M12,12 H188 V112 C188,168 142,206 100,228 C58,206 12,168 12,112 Z" fill="none" stroke="#262626" stroke-width="5"/>
</svg>
