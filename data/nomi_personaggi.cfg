; Nomi dei personaggi per fazione, al posto delle liste del file dei nomi dell'installazione (campmap/names/*_HEROES.TXT).
; Letto da CharacterNames dopo il file dell'installazione: aggiunge le liste e le associa alla fazione (come SET_FORENAMES,
; SET_SURNAMES, SET_PRINCESS e SET_REBELS del file originale).
;
; Chiavi di ogni sezione (id della fazione):
;   nomi            nomi di battesimo; i primi `reali` sono i nomi che i re danno ai figli (l'indice 0 e' il primo capo)
;   reali           quanti nomi in testa sono "reali"
;   cognomi         cognomi o casati
;   principesse     nomi delle principesse
;   regioni_ribelli regioni i cui ribelli prendono questi nomi
;   solo_auror      true = vale solo in modalita' Auror (triplo clic sul logo)
;   togli_eroi      true = toglie gli eroi famosi della fazione dal file dell'installazione
;
; Fonti dei nomi storici (16/11/2026): elenchi dei sovrani e dei casati su Wikipedia (Song, Sayfawa del Kanem, Sapa Inca,
; tlatoani, Fujiwara/Minamoto/Taira), censimenti nahuatl del XVI secolo, cronache francesi sui Natchez (Grande Sole,
; Serpente Tatuato) e la spedizione di de Soto per i capi del Sud-est.

; Auror (richiesta di Federico del 16/11/2026: un set di nomi dedicato, non piu' i nomi scandinavi dei Danesi). Nomi di
; gusto ellenico e atlantideo: Darkos in testa (il re immortale), poi i dieci re di Atlantide del Crizia di Platone
; (Atlante, Eumelo/Gadiro, Amfere, Evemone, Mneseo, Autoctono, Elasippo, Mestore, Azae, Diaprepe) ed Evenore; casati
; draconici e atlantidei; principesse dal mito (Clito, Leucippe) e nomi del mare.
[FN_DANISH]
