; Culture grafiche proprie di alcune fazioni (richiesta di Federico del 22/11/2026: «mancano le pedine»). PieceArt usa la
; cartella indicata qui per pedine di eserciti, capi e flotte, figure e carte degli agenti, al posto di quella della
; religione (Christian, Muslim, Pagan, Asian). Se un'immagine della cultura non c'e' ancora, resta quella della religione.
; Le immagini rifatte stanno in assets/rifatti/campmap/{pieces,review_panel}/<units|ships|agents>/<cultura minuscola>/,
; preparate da tools/prepara_pedine.py (coda di AI-Playground/media/conversione_pedine).

