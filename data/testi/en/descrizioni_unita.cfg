; Testi propri di Medieval Quest (riscritti il 2026-11-18): descrizioni delle unita'

[descrizioni_unita]
AbyssinianEliteGuard="Picked Ethiopian warriors, often taken young as slave-soldiers and drilled with great severity. They serve as the personal guard of the Sultan of Cairo, combining strict discipline with excellent close-combat skill."
AbyssinianGuard="Ethiopian axemen who have served the rulers of Egypt for generations. Well drilled, they can hew gaps in an enemy line, though their light protection leaves them exposed. They do best against peasants, levies and spearmen."
AlanMercenaryCavalry="Horsemen from the Caucasian steppe, hired chiefly by Byzantium. Light and fast, they are suited to skirmishing, ambushes and screening the flanks of heavier cavalry."
AlmohadUrbanMilitia="Town militias of Muslim Spain, raised to defend urban centres under Christian pressure. Better armed and trained than ordinary levies, they fight with more vigour and approach the standard of a small standing force."
Almughavars="Lightly equipped Catalan and Aragonese mercenaries who sold their swords across the Mediterranean. They open with a volley of javelins and then press home with spears, known for their stubbornness and ferocity."
AngevinInfantry="Foot soldiers drawn from English villages and trained for the crusades, notably that of Richard I. Equipped with shield, short sword and mail, they lend solidity to the battle line."
ArabHeavyInfantry="Heavy foot, mostly trained slaves or mercenaries from Damascus, Cairo and Baghdad. They fill a gap in Islamic armies, where the nobility preferred to stay mounted and sturdy infantry was scarce."
ArabInfantry="The backbone of Islamic armies on foot. Armed with sword and shield, they fight competently in melee and are more useful on the attack than in a defensive stand."
Arbalester="Crossbowmen with heavy bows whose bolts pierce almost any armour. Spanning the weapon with a windlass makes reloading very slow, so they need other troops to shield them; thus covered, they are deadly."
Archers="Shortbow men, drawn from hunters and peasants. They can hurt an armoured man, but their weapon has less power and range than a true war bow."
ArmenianHeavyCavalry="Armenian heavy horse, valued since Roman times. Disciplined and aggressive, they deliver a strong opening charge with the lance and are steadier than ordinary feudal cavalry."
ArmenianInfantry="The infantry of the Armenian armies of Cilicia, heir to a long fighting tradition in Asia Minor. A capable and dependable force, fit for any task in the line."
ArmouredAlmughavars="An elite version of the almogavars, with heavier kit reserved for the wealthier or luckier. Like their comrades they throw javelins before closing, but they absorb blows far better."
ArmouredSpearmen="Spearmen in mail with shields. Cheap to equip and train, they hold their ground against most infantry and are especially good at stopping cavalry."
Arquebusier="Gunners with the matchlock arquebus, a simple weapon and reasonably accurate. Their volleys shake morale as well as wounding, but in rain the match goes out and they cannot fire."
Arsenalotti="The elite guard of the Doge of Venice, drawn from the workers of the Arsenal. It watches over government buildings, acts as police and firefighters, and can supply well-equipped infantry detachments."
Assassin="An agent sent to kill another character. His odds rest on his own skill and on how important the target is."
AvarNobles="Avar noblemen on horseback, whose strength like that of other steppe peoples lies in cavalry. Less heavily armoured than Byzantine cataphracts, but fast and dangerous for striking flanks and breaking up formations."
AvizFootKnights="Knights of the Portuguese Order of Aviz, fighting dismounted now that heavy cavalry no longer answers well to trained infantry and gunpowder. An elite military body suited to carving out lands in Spain and Africa."
Baggala="An Arab ship developed from the dhow, fitted with a catapult that hurls pots of Greek fire at enemy vessels. Pirates use versions that throw only stones, having no Greek fire."
BallistaCrew="Crew of a ballista, a Greek-derived engine resembling an enormous crossbow. Its power comes from twisted bundles of sinew, and it throws heavy bolts or stones over long range with lethal effect."
Barque="A small single-masted sailing vessel, cheap and easy to build but fit only for short coastal runs. In open water it risks foundering, and its small crew is poor at boarding."
Bashkorts="A people of the Urals related to the Finns and Hungarians, living near the headwaters of the Volga. Not warlike by nature, they are conscripted by their Muslim overlords as infantry support for Bulgar cavalry."
BedouinCamelGun="Bedouin carrying a small swivel gun, the jezail, mounted on the camel's saddle. The beast must stand still to fire, but the mobility lets them advance, shoot and withdraw to reload, catching enemies unprepared."
BedouinCamelWarriors="Desert warriors mounted on camels, tough but sometimes poorly disciplined. They unsettle troops unused to camels, especially when charging, and the smell disturbs horses; like all cavalry, though, they fear spearmen."
BerberCamel="Hardy desert fighters who serve as camel-borne archers to harass the enemy. In melee they hold their own against similar light cavalry, and the scent of camels keeps many horses at a distance."
Berserkers="Norse warriors seized by a sacred frenzy, who scorn armour. They wreak havoc in battle but cannot be directed; a sensible commander simply lets them loose."
Besteiros="Portuguese peasant-soldiers gathered into makeshift companies with modest weapons. They can overwhelm some opponents and form the skeleton of the realm's forces, but need support against good infantry or heavy horse."
Billmen="English foot armed with the bill, a farm tool turned polearm with a blade and a hook. Well trained against armoured and mounted men, they haul riders from the saddle and finish them on the ground."
Bishop="A churchman who strengthens the faith of Catholics in the province where he stands. He has no effect on Orthodox Christians."
BohemianBowmen="Archers of the Kingdom of Bohemia, most valuable on the defensive. They inflict heavy losses at range and then support the rest of the army in close fighting."
BombardCrew="Crew of a bombard, an early gunpowder piece built from hooped wrought iron on a fixed mounting. Used chiefly in sieges, it fires stone balls that shatter on impact; it may burst, but terrifies those unfamiliar with gunpowder."
Bonnachts="Irish fighting men for whom the spear ranks just after the sword. Hurled at short range during the approach, it is devastating and gives the charge a second blow."
Boom="An Arab craft akin to the dhow, armed with a small cannon and carrying enough men to board. It can defeat galleys and is nimble enough to attack from almost any direction."
Boyar="The Russian landed nobility, trained as heavy household cavalry. Heavy mail, sword and bow make them a formidable force, sharpened by constant practice of war."
BulgarianArmouredPikemen="Bulgarian pikemen better protected than many Western equivalents. The first four ranks fight together and are deadly to cavalry, though the length of the pike demands longer training."
BulgarianBrigands="Balkan highlanders, organised and hard enough to serve as mercenaries. Versatile with bow and sword, but liable to lose heart at critical moments."
BulgarianCavalry="Lighter horse archers supporting the Bulgarian boyars, sometimes drawn from the Cuman and Pecheneg nomads absorbed into the realm. Fast, they lure heavier troops out of formation and then finish them."
BulgarianHeavyInfantry="Heavy infantry, the main foot troops of Bulgarian armies. Forged by centuries of war with Byzantines and Serbs, they are capable even without the most modern arms and armour."
BulgarianRoyalCavalry="Heavy horse of the Volga Bulgars, better armoured than the usual steppe cavalry and carrying lances in addition to swords."
ByzantineCavalry="Disciplined, armoured horsemen of the Byzantine state army, heirs of the Roman legions, armed with bow and sword. Slower than steppe mercenaries but dependable in battle."
ByzantineInfantry="Professional foot soldiers in the Roman tradition, with mail, large shields and swords. They fight skilfully against nearly any opponent and rank among the best heavy infantry of eastern Europe."
ByzantineLancers="Mounted lancers, the mainstay of Byzantine cavalry. Lighter and cheaper than cataphracts, yet protected and able to deliver heavy charges; it pays to soften the enemy first with archers."
Caravel="An ocean-going ship of Mediterranean origin, now used everywhere, that can ride out some storms. In battle it is merely adequate: small catapults strike enemy ships, but in light winds it handles poorly."
Cardinal="A senior prelate of the Catholic Church, whose mere presence greatly strengthens the faith of Catholics."
Carrack="A sleek ship developed from the cog, sturdy in heavy seas and able to carry great cargoes. With cannon, culverins, soldiers and a large crew it normally beats any other vessel."
CatapultCrew="Crew of a catapult of Roman origin, whose arm, driven by twisted rope or sinew, hurls missiles over a distance. Simple and fairly powerful, it will in time be outclassed by gunpowder artillery."
CelticWarriors="Light infantry from the Celtic lands, famed since antiquity for their ferocity. They form the core of Celtic armies."
ChernyeKlobuki="Mounted lancers of the Berendei tribe, known as the Black Hoods. Light and inexpensive but protected, they charge hard; it is wise to weaken the enemy first with archers."
ChivalricFootKnights="Dismounted knights in plate armour, wielding poleaxes made to defeat any harness. An elite trained from childhood, and for that reason somewhat headstrong."
ChivalricKnights="Knights in plate armour on barded horses, whose lances give a formidable charge. Trained from boyhood, they are an elite but tend to rush into battle without thought."
ChivalricManAtArms="Very heavy infantry of professional soldiers or minor lords in old or second-hand armour. Swordsmen equally good at attack and defence, they often form the backbone of the line, though their armour makes them slow."
ChivalricSergeants="Heavy spearmen, career soldiers or men hoping for ennoblement. Their equipment is somewhat dated but well kept, and their individual skill is high; discipline, however, may waver."
Cog="A ship born of advances in shipbuilding, sturdy and deep-draughted, with a large crew and complement of troops. Armed with demi-cannon, it is versatile in battle."
Coustillier="Light cavalry of the Burgundian army, armed with javelin, sword and lance. Good skirmishers, but their light armour suits them to quick raids and flanking moves."
Crossbows="Crossbowmen who master the weapon in weeks, where an archer needs years. Even the humblest can kill a nobleman, which is why the great often called it an unfair weapon."
Crusade="A popular movement as much as an army, raised to drive the Church's enemies out of a province. Once launched it cannot be recalled, and its strength rises or falls along the road with its successes and the zeal of the provinces it crosses."
CulverinCrew="Crew of a culverin, a long-barrelled gun on a light carriage. The slender barrel gives good range and uses less powder; it can throw balls up to 45 kg, but generals prefer lighter, more portable pieces."
CumanHeavyCavalry="Heavy cavalry of the Cumans, a steppe people. Less armoured than Byzantine cataphracts, but swift and dangerous for striking flanks and disordering units."
CumanWarriors="Steppe nomads who long troubled the Russian princes and the Byzantine empire. Only the poorest of the tribe fight on foot; they shoot well, loosing arrows before they plunge into the melee."
DarkAgeKnights="Mounted noblemen, forerunners of the medieval knight. Better equipped and trained than common troops, they break less readily and make good medium cavalry, able to face all but the heaviest opponents."
DarkAgeRoyalKnights="The mounted royal guard, core of most royal armies. Few, costly and superbly trained, they can decide a battle if used with judgement."
Dejma="Light bowmen of the Mediterranean and Aegean islands, raised as garrison and police against pirates and raiders, manning coastal watchtowers. Occupying powers, valuing their skill, also employ them abroad."
DemicannonCrew="Crew of a demi-cannon, a siege piece small only by comparison and often very heavy. Set on a stout carriage, it is not moved once placed; it throws balls up to 30 kg with considerable effect."
DemiculverinCrew="Crew of a demi-culverin, a smaller-bore gun firing balls of 3 to 4 kg. Well made and inexpensive, it is a versatile piece and easy to position."
DesertArchers="Light archers of the desert peoples, armed with fine composite bows. They should shoot from beyond the enemy's reach, as they fare poorly in melee."
Dhow="A small merchant and war vessel of the Arab world, fast and handy, able to use light winds to enter battle or slip away from stronger foes. It carries no weapons; the crew attacks by grappling and boarding."
DismountedFaris="Arab knights fighting on foot with the same skill as on horseback. Well-trained professionals, though less heavily armoured than their Frankish counterparts."
Dromon="A small sail-and-oar galley of shallow draught, used for scouting and coastal work. Not built for fleet battles, but in calm seas it outclasses smaller craft and can escape by speed."
DruzhinaCavalry="The druzhina cavalry, an important part of the armies of the Rus'. Said to be modelled on Byzantine horse known to the Scandinavians and Russians of the Varangian Guard, it is lighter armoured but effective."
DruzhinaInfantry="Sturdy Russian foot of the druzhina, shaped by Byzantine and Viking military traditions. They match or surpass the infantry of neighbouring realms and handle sword and shield with precision."
EarlyCarskaGarda="The Serbian tsar's guard, an elite trained to escort the sovereign. Heavy mail, sword and bow make it a formidable force, kept sharp by constant campaigning."
EarlyDidebuls="The lesser Armenian nobility, a select core of the army. They hold modest estates and closely resemble European knights."
EarlyFootKnights="Dismounted nobles, heirs to the Celtic, Saxon and Viking tradition of lords with their own retinue; the Norman counterpart of the huscarls. Professionals, they make very effective infantry."
EarlyNaxarars="The great Armenian landholding nobility, comparable to the feudal lords of Europe. Administrators and warriors, they fight mounted as well-equipped heavy cavalry."
EarlyRoyalFootKnights="The royal guard on foot, core of nearly every sovereign's army. Few, costly and highly trained, they can decide a battle if used wisely."
EarlyRoyalGhulamKnights="Ghulams, slave-soldiers who form the sultan's guard and finest cavalry. In heavy mail with lances they equal any other heavy horse; the sultan and each prince lead a body of them, and more can be trained at great cost."
EarlyRoyalKnights="The king's picked mounted guard, in mail on barded horses with lances. Their loyalty to the crown makes them more dangerous still. The king and princes of the blood lead small bodies of them; more can be raised, but at a high price."
EarlyVarangianGuard="Elite heavy infantry recruited from Russians and Vikings, complementing Byzantium's famed heavy cavalry. More than one Scandinavian king later won his throne after a spell in the guard."
EarlyVlastelaCavalry="Serbian mounted nobility, the equivalent of Western knights. Their kit may be dated or poorly kept, but at full gallop their charge commands respect."
Emissary="A nobleman or man of high birth trained in diplomacy and sent to rival rulers and lords. He represents his master where he stands and reports back to him."
Faris="The Arabic word means horseman or knight. Faris are professional cavalrymen, well trained and equipped, and many regard them as equal to the knights of Christendom."
FeudalFootKnights="Dismounted feudal knights, an elite trained from childhood who hold land in return for service. They favour the spear for its charge advantage; mail and shield protect them well against lesser troops."
FeudalKnights="Knights who receive their land in exchange for armed service, trained from boyhood. With the lance they ride the enemy down, but their honour and courage verge on recklessness."
FeudalManAtArms="Hardened fighters seeking social standing, in second-hand or outdated mail, with broadsword and shield. Good on both attack and defence."
FeudalSergeants="Professional spearmen who rank below knights but above landless peasants in the feudal order. Many lords field them as dependable medium infantry."
FiannaEireann="A band of Irish nobles sworn to protect the country against invaders. Admission demands strange trials, such as fending off ten spearmen with only their upper body above ground. Their name as close-quarters fighters is well deserved."
Firegalley="A galley fitted with a catapult that rains Greek fire on the enemy. With soldiers and a ram aboard it is formidable, since Greek fire burns even on water."
FrenchManAtArms="French foot armed with maces, who often strike cavalry already engaged and therefore exposed. Their weapons deal enormous damage in the chaos of melee."
Futuwwa="Fanatical fighters, shielded by faith and ready to die, especially against unbelievers. Armed with bow and sword, they are versatile, but their recklessness exposes them to heavy losses in assaults."
Fyrdmen="The fyrd is the common Saxon infantry, free peasants called to arms by the king. They are better than peasant levies and cheaper than professionals such as the housecarls."
GaelGaedhil="Warriors of mixed Norse and Irish blood, heirs to pagan ferocity. Nearly unarmoured and hungry for glory, they are fearsome shock troops when hurled against the enemy."
Galley="A long-proven ship under oar and sail, suited to the Mediterranean. The crew is mostly rowers, with a few archers and soldiers. It carries grapnels and a ram to break enemy hulls and oars."
Gallowglass="Irish Celtic warriors with two-handed swords, loyal to a clan chief. Quick and fierce, they fall into a near-berserk rage in battle; they are said to take the heads of the slain as trophies."
Gendarmes="Good-quality militia cavalry, recruited in the growing towns. Well equipped and more disciplined than many part-time soldiers, but lacking the dash of knights. France's rich provinces produce them in numbers."
GenoeseSailors="Genoese seamen who, away from their ships, make excellent light missile troops, far better than hastily raised infantry. Quick and lightly armoured, they are unsuited to melee except as a last resort."
GhaziInfantry="Fanatical warriors who face superior forces without fear. Hard to restrain, they crash into the enemy on the attack with devastating axes; on defence they may counter-attack rashly and weaken a sound position."
GhulamCavalry="The heavy attacking cavalry of desert armies, in mail with light lances. They charge well and do fine against other horse, but must beware spearmen; against missile troops a swift attack pays."
GoldenHordeHeavyCavalry="Mounted Mongol nobility whose task is to shatter lesser troops by impact. Armed with lances and well protected by armour and shield, they do best against infantry and against units on the verge of breaking."
GoldenHordeHorseArchers="Horse archers for harrying and ambush, ideal for the Mongol tactic of strike and withdraw. Their speed lets them gather, shoot, retire and repeat without ever closing to melee."
GoldenHordeWarriors="Dismounted Mongols, disciplined and formidable, skilled with composite bow and sword. They are ill suited to assaulting heavy infantry; better to break its ranks with arrows and then finish a beaten foe."
GothicFootKnights="Dismounted knights in Gothic plate, whose smooth surfaces turn blows despite a bulky look. With two-handed swords they break many defensive formations, though hunger for glory can make them rash."
GothicKnights="Knights in Gothic armour on heavily barded horses. Little troubled by most foes, though archers and pikemen remain dangers; they represent the peak of heavy cavalry and of the armourer's craft."
GothicSergeants="Sergeants in slightly outdated armour who are a pillar of any army. With spears they fit anywhere in the line, and driven by a budding professionalism they lack the thirst for glory of the nobility."
GrandInquisitor="His task is to root out heresy and dissent among Catholics. His presence sharply reduces heresy, raises zeal and usually subdues rebellious populations, often through sheer fear."
Gungalley="A galley with cannon as its main weapon, still carrying a ram and soldiers for boarding. Formidable under sail and oar, but it has blind spots and handles poorly at close quarters."
Halbardiers="Foot soldiers in plate armour carrying the halberd, a weapon able to fell a horse or cleave a man. They are assault troops suited to breaking enemy formations and storming fortifications."
HandGun="Portable firearms that are inaccurate and unreliable, useless in damp, but easy to teach. Slow, short-range shooters, they are valued mainly for the noise and smoke that frighten."
Hashishin="A sect born in Persia, masters of stealth, deceit and murder. On the field they hide in almost any terrain, ideal for ambushing enemy generals; in action they strike with sword and bow."
HighCarskaGarda="Heavy cavalry of the Serbian king's or tsar's guard, grown stronger since independence. Its fighting style draws on the armoured knights of the West."
HighDidebuls="Armenian nobles who, through contact with crusaders and Europe, adopted feudal structures and more advanced arms and armour. With plate, barded horses and lances they deliver a strong charge."
HighNaxarars="The great Armenian nobility, administrators and warriors comparable to European feudal lords. Through contact with crusaders they took up Western cavalry equipment and fight as heavy horse."
HighRoyalGhulamKnights="Picked ghulams, slave-soldiers who form the sultan's guard and best cavalry. In heavy mail with lances they equal any other heavy horse; the sultan and princes lead a body of them, and further units are costly to train."
HighRoyalKnights="The king's picked mounted guard, in plate on barded horses with lances. Devotion to the crown makes them extremely dangerous. The king and princes of the blood lead small bodies of them; more can be raised, but at great cost."
HighlandClansman="The last tribal warriors of western Europe, gathered by their chiefs from among kinsmen. Brave but stubborn and impetuous, they are light foot from harsh country, usually poorly armed and unarmoured."
HighlandWarriors="Nobles and professional fighters who fight on foot, coming from a land with few good horses. Less mobile and vulnerable to charges, but steadier in formation."
Hobilar="Riders on small horses, useful as scouts and pursuers. They are best at driving the enemy from the field or taking prisoners for ransom; lightly equipped, they cannot match noble cavalry."
HorseArchers="Horse archers of many eastern European peoples, excellent riders and shots. They strike from afar, staying out of reach, but are vulnerable in melee."
HospitallerFootKnights="Hospitaller knights adapted to new ways of war: they fight on foot as armoured elite infantry able to cut through enemy ranks. Versatility, discipline and courage keep them formidable."
Housecarle="Picked Norse warriors from the era of the Vikings' decline, strong in the shield wall, a tight formation facing the enemy. They are chiefly vulnerable if the line is broken."
Inquisitor="His task is to root out heresy and dissent from the Catholic flock. His presence reduces heresy, and his ruthless reputation can cow the whole population."
IrishDartmen="Throwers of darts, light javelins of great antiquity in Ireland. Less deadly than arrows, but a shower of darts disorders many undisciplined units."
IrishHorsemen="Irish riders on small but sturdy horses, useful as scouts and pursuers. With spear, darts and light armour they skirmish well, but cannot stand against noble cavalry."
ItalianLightInfantry="Italian medium infantry, hardened by years of war against Normans, French, imperial forces and one another. In padded jackets with spears and shields, they lack veteran bite but are reliable."
JanissaryBows="Janissary archers, a Turkish regular force, disciplined and devoted, raised to form national rather than feudal armies. Their job is to disorder and weaken enemy lines so other units can finish them."
JanissaryHeavyInfantry="The disciplined elite of the Turkish armies, with a dreaded name. Heavy shock troops, armoured and armed with polearms, they must open the enemy line to let other units through."
JanissaryInfantry="Raised from boys levied in the Ottoman provinces and brought up in barracks under strict discipline, the Janissaries are the sultan's regular infantry. Armed with bow and sword, they wear an enemy down at range, then close to fight hand to hand. Reliable professionals, they suit any role."
Jihad="In the game a jihad stands for a popular rising of Muslim believers who take up arms to defend a province against any aggressor. Once launched it cannot be halted or recalled. Its numbers swell or shrink according to its victories and the religious fervour of the lands it passes through."
Jobbagy="The name comes from a Hungarian land measure, since nobles and towns supplied these men in proportion to their estates. They are cheap, poorly trained levy infantry, much like the peasant conscripts found in other kingdoms."
JomsVikings="According to the sagas, the fortress of Jomsborg housed a warrior brotherhood that barred women and whose harbour could shelter three hundred longships. Its members were hand-picked fighters, reputed to outclass even the berserkers. On the battlefield they form an elite infantry force that is formidable on the attack."
Kataphraktoi="Heirs of the armoured horsemen of the late Roman world, the Byzantine kataphraktoi cover both rider and mount in metal. Their charge is very hard to stop, but the weight of armour makes them slow, and they cost more to maintain than other horsemen."
Kazanchis="The Volga Bulgars' principal foot soldiers, the kazanchis carry an armour-piercing polearm and wear fair protection. They do best deployed beside the heavy cavalry, whose operations they cover."
Kern="In Gaelic Ireland, incessant feuds between local lords and clashes with English invaders turned even ordinary folk into fighters. Kerns are lightly equipped javelin infantry, used to harry the enemy and capable of savage fighting once battle is joined."
KhazarRoyalCavalry="The Khazar Khaganate, Jewish by faith, relies on cavalry as other steppe peoples do. These heavy horsemen wear sturdier armour than their nomadic neighbours and fight with lance as well as sword."
KhwarazmianCavalry="Unusually for an Islamic army, the horsemen of Khwarazm armour their mounts as well as themselves. They hit hard against lighter opponents but are clumsy to manoeuvre. As shock cavalry they stand comparison with Western knights, and show better discipline."
Klibanophoroi="A disciplined heavy cavalry, traditionally the spearhead of Byzantine assaults, though its numbers fell after the defeat at Manzikert. It fights alongside the kataphraktoi, and its maces are well suited to breaking helmets of Turks and Western knights alike."
KnightsAviz="The Order of Aviz is one of the Iberian military orders, whose vow to fight the Moors was lifelong rather than temporary, as it often was in the Holy Land. It serves the Portuguese crown, defending the realm or extending it by war against Islam."
KnightsHospitaller="The Order of St John began by caring for pilgrims in a Jerusalem hospital and grew into a leading military order. Its knights, heavily armoured and armed with lances, deliver devastating charges and can be trusted to hold their ground when the fighting gets hard."
KnightsSantiago="Founded to guard pilgrims on the Spanish road, the Order of Santiago is a fighting brotherhood with quasi-monastic rules. Its heavy knights are solid and dependable, shattering many a line with their charge, yet more controlled than lay noblemen."
KnightsTemplar="The Templars are the most prestigious of the religious military orders of Christendom. Top-grade heavy cavalry, they can ride down far larger forces and win. Their orthodoxy, however, is doubted in some quarters."
KoreanGuardsmen="Assault infantry in Mongol service, the Korean guardsmen are slower than ordinary spearmen but better armed and armoured. They wield a large polearm with which they break into enemy formations."
KoreanSkirmishers="Heavily protected foot soldiers equipped with shield, sword and javelins. They are weak in a prolonged melee: their task is to hurl a volley of javelins at the enemy and then finish the work with the sword."
KoreanSpearmen="Levy spearmen of the Korean army, chiefly useful for holding off cavalry. They are less trained than picked troops but generally do their duty."
Kursybays="Well-equipped spearmen often recruited by the Volga Bulgars. They are less hardened than the kazanchis, but hold their place in the line firmly."
Lancers="Very heavy cavalry designed for the shock charge, wearing plate armour built up with extra pieces. Their charge is powerful, but once outflanked and struck from the side or rear they become vulnerable."
LateRoyalGhulamKnights="Ghulams are slave-soldiers of high standing, and these form the sultan's personal guard. In plate armour and with lances, they outmatch most heavy cavalry. The ruler and his princes lead some of the units, and raising more is very expensive."
LateRoyalKnights="The household guard of the crown, these knights wear full plate and carry lances, and loyalty to their sovereign raises their fighting spirit. The king and princes of the blood command a few such units, while hiring more is possible but costly."
LatinAuxillaries="After the crusades many Westerners stayed in the East and entered Byzantine and Armenian service, especially after the Fourth Crusade and the founding of the Latin Empire. They fight on foot as auxiliaries and can defeat much of the Muslim infantry in open combat."
LithuanianCavalry="Light cavalry drawn from the lesser Lithuanian nobility, with light mail, lance and bow. They ride well and can dismount to shoot on foot if needed, but are no match for true knights."
LithuanianInfantry="Tough, courageous warriors serving Lithuania's rulers, first pagan and later Christian. They move confidently both in open country and in the dense Belarusian forests, and stand in the way of Scandinavian and Russian ambitions on the Baltic."
LithuanianTurcopole="The Baltic tribes lack the skill of the Turkic nomads, but still make capable horsemen. The Teutonic Order prized them: in its armies they rank below the brother knights and above the local foot auxiliaries."
Longboat="The long, narrow Viking hull is the product of many generations of refinement. It can cross oceans, is easily beached and carries heavy loads. As a warship it is good only for boarding."
Longbows="English longbowmen are the finest archers on the continent, loosing clouds of arrows out to three hundred metres, with war-heads that threaten even armoured knights. They are most effective when the enemy has to advance against them."
MamlukCavalry="Slaves trained for war from boyhood, the Mamluks make up a well-armed, disciplined medium cavalry carrying axes, which are excellent against armour. Suited to many tasks, they can catch even heavy cavalry off guard."
MamlukHandgun="Thanks to Islamic scholarship the Mamluks make better powder and weapons than the Christians, and their handgunners are better drilled. They are still held back by the slow rate of fire and poor accuracy of the guns."
MamlukHorseArchers="An elite of slave-soldiers, Mamluk horse archers combine discipline, accurate shooting and superb riding to run down slower opponents. They can defend themselves in a melee, but are best not thrown into one recklessly."
MangonelCrew="The mangonel is a small catapult of ancient origin: an arm driven by twisted rope or sinew throws light missiles over a short range. It has no wheels, so once assembled it stays put, and it will be eclipsed by gunpowder weapons."
MediumCavalry="Essentially a foot soldier put on horseback, he brings mobility to an army and is useful for chasing a fleeing enemy. Seldom decisive alone, but used at the right moment in the right place he can swing the outcome of a fight."
MilitiaSergeants="Town militia recruited from apprentices in growing cities, armed with sturdy polearms. They give a good account against inferior troops, but their training is uneven and they falter before professional soldiers."
MortarCrew="The mortar is a short-barrelled piece that fires in a high arc, dropping its shot over walls. It is tricky to use, since elevation, powder charge and wind all affect accuracy. In sieges it is devastating."
MountedCrossbows="Horsemen with crossbows shorter than the infantry type, a Western answer to the Eastern horse archers. The weapons are lethal but slow to reload, so these men must rely on mobility to avoid being caught."
MountedSergeants="Cavalry lighter than knights but quick, with heavy lances that make the charge effective. They should be sent against the enemy's flank or rear for maximum effect, then withdrawn by using their speed."
Mullah="The mullah is a learned man of the Muslim religion; in a province he noticeably bolsters the faith of its Muslim inhabitants."
MurabitinHorsemen="The Almoravids, a Berber and Arab people of North Africa, are known for strict religious observance. Their zeal makes them valuable light cavalry, the fast arm of the Almohad armies."
MurabitinInfantry="Hardy foot soldiers recruited in the arid provinces of the Almohad empire on the North African seaboard. Their javelins harass enemy formations and cause surprising losses, while the rest of their kit is merely defensive, so they are best used as skirmishers."
MuslimPeasants="Muslim peasants, at the bottom of society, tied to the land or crowded on the edges of towns. In wartime they are conscripted by force and have little reason for loyalty to those who send them to fight."
MuwahidFoot="Spearmen serving the Almohads, lightly equipped so as to hold the line. Hardy desert men protected mostly by large shields, they are quick and perhaps overconfident. Like all spearmen, they are effective against horses."
NapthaThrowers="Naphtha is an incendiary mixture that burns stubbornly. Packed into clay grenades that shatter on impact, it is dangerous even to its users, and a thrower may well set himself alight."
NegroSpearmen="The name of the Nubian spearmen is imprecise: they come from all over Africa and were brought north into the sultan's service. They carry the same kit as other spearmen but are usually more skilled and better disciplined."
Nizari="Followers of an Ismaili sect, the Nizaris are driven by faith and fight with sword and bow, making a flexible unit for any Muslim commander. Their fanaticism makes them rash, and they will press on regardless of the odds."
NormanFootKnights="Norman nobles, though excellent horsemen, sometimes prefer to fight dismounted. Equipped like other feudal nobles, with sword and kite shield, they are capable but vulnerable to cavalry charges."
NormanKnights="The Normans ranked among the foremost military powers of the early Middle Ages, joining Scandinavian aggression to Frankish horsemanship and arms. After the conquests of England and Sicily, their heavy cavalry became the model for knightly warfare."
OrderFootsoldiers="Military orders reserve knighthood for the well-born; men of lower station serve as supporting foot soldiers, often to good effect, motivated by hopes of salvation and promotion. They have good armour and spears."
OrganCrew="It takes its name from the many barrels set side by side on a wooden frame, like the pipes of a church organ. Its volleys are deadly, but like all artillery it fires slowly and is hard to move."
OrthodoxBishop="Within his province the Orthodox bishop reinforces the faith of Orthodox Christians. He has no effect on Catholics or followers of other religions."
OttomanInfantry="Well-armed, well-armoured infantry, sturdy enough to stand in the front line of a Turkish army. They carry bows and axes, handy against armoured foes, and in training and discipline usually outclass other infantry."
OttomanSipahi="Turkish sipahis differ from many European horsemen in their obedience to orders. Professionals with equipment equal to any heavy cavalry, they have mainly spears and pikes to fear on the field."
PaviseArbalester="The heavy crossbow shoots a bolt that pierces nearly any armour, but it is spanned with a winch and fires very slowly. While reloading, the crossbowman shelters behind a pavise, a shield as tall as himself."
PaviseCrossbows="A crossbow can be learned in a few weeks, but it has drawbacks: a slow rate of fire and an exposed shooter while reloading, unless he takes cover behind a pavise, a large standing shield. Italian crossbowmen are among the most esteemed."
Peasants="Peasants, the lowest level of society. Conscription takes them from their fields to fight for their lords with poor weapons. They are unreliable, but cost very little."
PictishCavalry="Pictish horsemen have the toughness of other hill and mountain peoples. Fierce and quick, they are excellent for raiding and skirmishing."
PictishCrossbows="Often thought backward by foreigners, the Picts were quick to see the merits of the crossbow, whose range, power and simplicity helped them prevail against armies of more advanced nations."
PictishMountedCrossbows="Fast, light cavalry equipped with the Pictish crossbow, which strikes hard at range though slowly. More flexible than most light horse, they are a useful reinforcement for any Pictish army."
Pikemen="The pike is a very long shaft, and its users must drill to move as one body. Unlike other troops, pikemen fight with their front four ranks, presenting a wall of points to anyone who charges them."
PolishRetainer="Minor Polish nobility making up good medium cavalry, with mail and heavy lances that strengthen the charge. They attack well but cannot match knights, and struggle to hold against such strong opponents."
Priest="By his presence the priest strengthens the faith of Orthodox Christians in the province where he stands; followers of other religions gain nothing from him."
Princess="The princess is a dynastic asset who can serve as an envoy. She may marry a general to secure his loyalty, or join another royal house to seal an alliance, though her husband may later lay claim to his father-in-law's lands."
PronoiaiAllagion="Even the Byzantine treasury has its limits, so these mercenaries are paid in land rather than coin. They are the Byzantine equivalent of heavy knights, half soldier and half local lord, and with mail, lance and barded horse they rival many Western knights."
ReligiousFanatics="Ordinary people readily follow anyone who promises paradise. For many, life is toil and poverty, and dying in battle with blind faith looks like a path to salvation: this is how fanatics are made."
RoundShieldSpearmen="Spearmen serve in nearly every army, especially against cavalry, and fight two ranks deep with their spears. They cannot long withstand professional soldiers, but while they keep formation they can give horsemen an unpleasant surprise."
RusSpearmen="Experienced warriors of the Rus, at home in battle and well armoured. They withstand assaults that would send lesser units fleeing."
SaharanCavalry="In the desert speed protects better than armour, which would bake its wearer under the sun. Saharan horsemen are fast skirmishers suited to guarding flanks, keeping archers at bay and pursuing. With sword and shield they cannot sustain a long melee."
SantiagoFootKnights="These knights serve the kingdom of Castile in its long struggle against Muslim invaders. Formidable on their sturdy Spanish horses, when a charge is impossible they can fight on foot in the infantry ranks."
SaracenInfantry="Medium spearmen, better disciplined than the Frankish crusaders. The spear gives them an edge over cavalry, and light armour keeps them quick in the desert heat; they also hold their own against similar infantry."
SaxonHuscarles="Huscarls are the personal retinue of a king or noble: in peacetime a guard and household, in war the professional core of the army. Where the fyrd is the ordinary Anglo-Saxon levy, they are its elite."
ScottishCavalry="Cavalry is not Scotland's strength, and the Scots themselves favour fighting dismounted. Even so, these light horsemen of the Lowlands add useful mobility to the army, above all against English archers."
ScottishLancers="Not among the best cavalry, but aggressive enough to worry an enemy. These lancers depend on speed and the impact of their charge, with the best results against light infantry."
ScottishSpearmen="Sturdy men of the Lowlands, they give the king's army the defensive solidity the wild, stubborn Highlanders cannot. Dependable against most medium infantry, they also withstand many heavy cavalry charges."
SerbianCavalry="In the Serbian hills money is short and wars are plentiful, so this cavalry is lighter than most: it prefers archery to the lance charge and, when pressed, falls back to its mountain strongholds."
SerpentineCrew="The serpentine is a light, very long cannon, hence the name. It fires a ball of about a kilogramme; it is portable, fairly accurate and has good range. A single shot can bring down several men."
Shaman="By his presence the shaman strengthens the faith of pagans in the province where he stands; followers of other religions do not benefit."
SherwoodForesters="Those who live in the royal forests develop their skill with the bow by poaching the sovereign's game and learning to move through the trees. In war they are valuable archers, adept at hiding and better than nearly any others."
ShieldedBowmen="Centuries of warfare have made the Balkan peoples proud and hard. This light infantry mostly serves the Serbian tsar and is more capable than the average archer, both in shooting and in close combat."
SiegecannonCrew="The siege cannon is a status symbol every monarch wants. With more skilled founders and better powder, artillery stops being a matter of luck and the great guns no longer burst and kill their own crews."
SipahiofthePorte="The Turkish sultans' picked guard, with mail, barded horses, sword and bow. They are fearsome opponents above all for their rigorous training. The sultan and princes lead small units of them, while recruiting more is expensive."
SlavJavelinmen="Light infantry conscripted by many lords. They are versatile: they pelt the enemy with javelins at close range and then fight skirmishes hand to hand."
SlavWarriors="Cheap light infantry, often conscripted by Slavic lords and armed with short spears."
SpanishJavelinmen="Spain has been famous since antiquity for its javelin throwers. With javelins and swords they make good light infantry and excellent skirmishers."
SpanishJinetes="Heirs to the Moorish horsemen, the jinetes are fast, agile light cavalry. Instead of lances they throw javelins before drawing swords, and this double role makes them useful in any Spanish army."
Spearmen="Spearmen serve in nearly every army, especially against cavalry, and fight two ranks deep with their spears. They cannot long withstand professional soldiers, but while they keep formation they can give horsemen an unpleasant surprise."
Spy="The spy gathers intelligence on rivals and sees everything in the province or army where she is placed. She can expose a character's vices, forge evidence of treason and stir up discontent in enemy provinces."
SteppeCavalry="The peoples of the steppe learn to ride as small children, since hunting and war demand it. They are outstanding light horsemen and masters of many weapons, at their best in harassing and pursuit."
SteppeHeavyCavalry="The heavy cavalry of the steppe is powerful and versatile: with the short bow it shoots from the saddle to great effect, and in melee it wields the sword with deadly results."
SwabianSwordsmen="The Swabians of south-western Germany are regarded by other Germans as almost a people apart. In mail and with great two-handed swords they make a powerful heavy infantry, built to attack."
SwissArmouredPikemen="Armoured Swiss pikemen, highly effective against cavalry: they fight four ranks deep and no horse will charge a wall of pikes. Esteemed for their professionalism, in tight formation they are nevertheless an easy target for missile troops."
SwissHalbardiers="Well-trained, disciplined Swiss halberdiers, the product of the Confederation's care for its own defence. Though lightly armoured, their halberds hit hard even against armoured enemies, unlike spears, which are good mainly against cavalry."
SwissPikemen="The pike can top four metres and takes drilling to handle; the Swiss rank among Europe's finest pikemen. They stand four ranks deep, and no horse will charge such a hedge of points, which makes them superb against cavalry."
Szekely="Light cavalry from the borders of the steppe, made up of mobile, skilled scouts and skirmishers. Too lightly equipped for a frontal clash, they are ideal raiders for disordering the enemy before heavier troops go in."
TemplarFootKnights="The Templars, known for piety and irresistible charges, dismount readily to face the enemy openly, convinced they carry divine judgement against him."
TeutonicFootKnights="The Teutonic Order has adapted to new methods: rather than fight mounted, it fields elite armoured infantry able to cut a path through enemy ranks. Discipline, courage and versatility keep it formidable."
TeutonicKnights="An order of German knights sworn to fight heretics, infidels and pagans. In battle they match the other orders, though with less discipline, which is small comfort to those who face them."
TeutonicSergeants="The military orders are closed to men of low birth. Teutonic sergeants, of lesser rank, have heavy cavalry training but not the drive of true knights; in combat they come close to matching their effectiveness."
TrebizondArchers="Composite bows give these soldiers superior range, accuracy and penetration. The archers of Trebizond are trained and disciplined and can act as light infantry, but it would be unwise to send them against enemies still in good order."
TrebuchetCrew="The trebuchet is a gigantic engine, often built on site: a counterweight drives its arm to hurl missiles over great distances, such as boulders, fire pots and, to demoralise, dead animals, prisoners or corpses."
TurcomanFoot="The Turcomans of Central Asia and north-eastern Persia know desert warfare well. They are mainly archers and, if necessary, light infantry. They serve to weaken the enemy before other units attack; in melee they can do no more than defend themselves."
TurcomanHorse="Fast light cavalry suited to the desert, with light armour, bow and sword. They wear down units with fire before charging, and against Frankish crusaders usually stay out of reach while grinding them down."
Turcopole="After facing Saracen cavalry, the crusaders realised that knights alone were not enough in the East and hired local warriors. Turcopoles have light armour, bow and spear, and are very versatile."
Ulama="The imam is a scholar who has given his life to the study of Islam. In a province he inspires Muslims and heightens their zeal."
UrbanMilitia="Growing towns and trade create a need for local defence, and some cities raise troops from their own apprentices and journeymen. Barely trained, they carry polearms that work well against armoured soldiers, and they are steadier than peasants."
VarangianGuard="The Byzantine imperial bodyguard, composed of loyal and resourceful Northern mercenaries. Over the centuries it has included Vikings, even a king, as well as Saxons and Englishmen. In the late period it is often more ceremonial than a fighting unit."
VarangianSwordsmen="Recruited from Russians and Scandinavians, Varangian swordsmen form an elite heavy infantry, known as the Varangian Guard when in Byzantine pay, whose emperors gladly pay for their skill."
VikingHuscarles="Professional warriors in the following of a jarl, serving as his guard and court in peace and fighting beside him in war. They are superior infantry, better but dearer than the karls, who are summoned only when needed."
VikingKarls="The bulk of Scandinavians are karls, free farmers and fishermen. They form the ordinary soldiery of Viking armies and man the dragon ships, and are far better than the peasant levies of other lands."
VikingLandsmenn="Landsmen are free Scandinavian men, farmers or proprietors, whom a jarl may summon in an emergency to serve under arms and to build defensive works."
VikingRaiderCavalry="The Vikings are not famous for cavalry, and rightly so: Scandinavian horses are small. They still give a Viking army a measure of mobility."
VikingThralls="Thralls are the lowest class of Viking society, little better than slaves. They are sent to fight like free men but are unskilled and unmotivated, and should not be given decisive tasks."
VlastelaHeavyCavalry="After hiring German knights, the tsar recognised their worth and began training similar units in Serbia. With plate armour, barded horses and lances, they are formidable."
Voi="Tribal levies of the Novgorod armies, used chiefly as skirmishers. With small shield, sword and light armour they are quick and versatile, but lack the mettle of professional troops."
VoynukBlades="Dependable foot soldiers armed mainly with polearms, in a defensive role: they often march at the head of the tsar's army or shield more vulnerable units from enemy cavalry."
VoynukSwordsmen="The Slavic peoples of the Balkans have a reputation for being imposing, taller than many Westerners and keen-eyed. These foot soldiers live up to it, fighting as well as many Western men-at-arms even without modern equipment."
WallachianMercenaryCavalry="Excellent mercenary horsemen, the Wallachians are often hired as light cavalry for skirmishes, ambushes and swift cover on the flanks of heavier cavalry."
Wargalley="A large oared and sailing ship carrying several catapults for Greek fire pots and a ram for ramming. Imposing but unwieldy, it is more powerful than nimble at sea."
WelshBandits="The rough terrain of Wales favours irregular warfare, as invaders have learned since Roman times. With bow and sword and plenty of ambush practice, Welsh bandits are dangerous, adaptable opponents."
WelshLongbows="Welsh longbowmen rank among the best archers in Europe: arrows rain in clouds out to three hundred metres, and their war-heads threaten even knights. They do best when it is the enemy who has to attack."
Woodsman="Strong woodcutters, better than peasant levies, who live in heavily forested regions. Their axes can do serious harm even to stronger troops, and light protection helps them a little. They remain peasants, however, and may run like them."
XLCatapultCrew="The naphtha catapult dates back to Roman times: an arm driven by twisted rope or sinew hurls incendiary missiles a fair distance, and small wheels absorb the recoil. Simple and effective, but doomed to be outdone by cannon."
XLHospitallerFootKnights="Even without their horses the Hospitallers are warriors feared by the enemies of the Church and the Order. Sword and shield make them useful in attack and defence where horses are of little use, such as on rough ground or against dense masses of spearmen."
XLKnightsHospitaller="The Order of St John began by caring for pilgrims in a Jerusalem hospital and grew into a leading military order. Its knights, heavily armoured and armed with lances, deliver devastating charges and can be trusted to hold their ground when the fighting gets hard."
XLKnightsTemplar="The Templars are the most prestigious of the religious military orders of Christendom. Top-grade heavy cavalry, they can ride down far larger forces and win. Their orthodoxy, however, is doubted in some quarters."
XLOrderFootsoldiers="Military orders reserve knighthood for the well-born; men of lower station serve as supporting foot soldiers, often to good effect, motivated by hopes of salvation and promotion. They have good armour and spears."
XLTeutonicKnights="An order of German knights sworn to fight heretics, infidels and pagans. In battle they match the other orders, though with less discipline, which is small comfort to those who face them."
XLTeutonicSergeants="The military orders are closed to men of low birth. Teutonic sergeants, of lesser rank, have heavy cavalry training but not the drive of true knights; in combat they come close to matching their effectiveness."
