[eventi_testi]
0="At the Council of Clermont the Pope delivered a fiery appeal to the faithful: free Jerusalem and defend Christendom. The cry of \"God wills it\" rose from the crowd, and a great many swore on the spot to take up the cross."
1="On the orders of William the Conqueror, royal commissioners have travelled every shire of England recording land, livestock, mills and people. The great survey is now complete, so the crown knows exactly what the kingdom yields and can tax it accordingly."
2="A splinter of the True Cross has reached Paris and been placed with great ceremony in the cathedral. Pilgrims flock in from all quarters and Catholic devotion grows throughout France."
3="The Assassins, an Ismaili sect led by the Old Man of the Mountain, strike for whoever employs them. It is said that, drugged with hashish and certain they stand at the gates of paradise, they meet death without hesitation. Rulers may put their daggers to uses that are anything but spiritual."
4="Preached by Peter the Hermit and the knight Walter the Penniless, a ragged multitude of peasants sets out for the Holy Land, sure of divine aid. The French countryside is left short of hands and the country's farming income falls by 10%."
5="The ideal of the knight demands courage, loyalty, protection of the weak and respect for every opponent. It is seldom practised in full, but its stress on Christian virtue helps to spread the Catholic faith."
6="Abu Hamid al-Ghazali, jurist, theologian and philosopher, distrusts Aristotle and the rationalists and returns Islamic faith to the ground of mystical experience. His teaching is deeply appealing and strengthens Islam among the Turkish peoples."
7="Withdrawn to a convent after her plot failed, Anna Comnena writes the history of her father Alexios I's reign. The work glorifies the dynasty and the Empire and brings the Byzantine emperor +1 influence."
8="Persian mathematician, astronomer and poet, Omar Khayyam commits to his quatrains a bitter meditation on fate and the shortness of life. The scholar's standing dampens religious fervour in the Turkish provinces, while governors learn clear-sightedness from him: +1 acumen."
9="Geoffrey of Monmouth sets down the legend of King Arthur and the knights of the Round Table, and the book is a runaway success. The English crown basks in the glow (+1 influence), but readers care more for the tales than for sermons: zeal -10% in English provinces."
10="Thomas Becket, Archbishop of Canterbury, is struck down by the king's men. The murder is felt as a sacrilege: the monarch's influence is weakened and the Catholic Church grows stronger in every English province."
11="The Cistercian abbot Bernard of Clairvaux preaches the crusade against the Muslims. His oratory and his devotion to the Virgin win over many, the sovereign among them, and rekindle piety in Champagne."
12="The priest Bogomil gathers followers around a dualist creed: matter, he says, is the work of evil and only spirit is good. The Bogomils reject marriage, the sacraments and ecclesiastical authority, and they spread through Bulgaria and Wallachia."
13="The remains of Saint Eustace, untouched down the centuries, are now kept in a jewelled reliquary. Pilgrims from across northern Italy hurry to venerate them and the region's zeal increases."
14="For generations the counts of Champagne have protected the merchants who cross their lands, and the region's fairs have become one of the greatest markets in Europe. Thanks to this foresight, the governor of Champagne gains +3 acumen."
15="The Andalusian philosopher and physician Averroes comments rigorously on the works of Aristotle and defends the role of reason; his writings are read by Muslims and Christians alike. His influence lowers zeal in both Christian and Islamic Spain."
16="Chrétien de Troyes devotes richly detailed poems to Arthur, Lancelot, Guinevere and the Round Table. His tales of courtly love enchant audiences and draw them away from devotional reading: zeal -10% across France."
17="Abbess Hildegard of Bingen, healer and author of medical treatises, is also a visionary: bishops and even the Pope approve the recording of her visions. She strengthens the Catholic Church in Germany and brings +1 health to the region."
18="The North is Christian now, yet the old cults linger in the thickest forests. Erik's devotion to the Church is unmatched and consolidates Catholicism across Scandinavia."
19="Henry II has sixteen articles approved that curb the autonomy of the English clergy and the Pope's weight in the affairs of the realm. The king gains +1 influence and loses 1 piety."
20="Theodore Prodromos writes polished verse for the court of Byzantium, a novel in verse and even satires in the vernacular Greek. Such a man of letters lends the throne prestige: +1 influence, but zeal falls by 10%."
21="The magnetic needle points north even under cloud or at night. Sailors no longer need to creep along the coast: on larger ships they can brave the open sea."
22="The Cathar heresy can no longer be ignored. These dualists deny the authority of the Church, the sacraments, the cross and that God made the world, and many simple folk listen to them. Their followers multiply in Bavaria, Franconia, Milan, Genoa, Provence and around Toulouse."
23="Gottfried of Strasbourg composes a new version of the ill-fated love of Tristan and Isolde, and audiences are enthralled, to the detriment of devotional habits. Zeal falls by 10% in Franconia and neighbouring provinces."
24="Dominic and his friars preach against heresy and earn the nickname \"Domini canes\", the Lord's hounds, a play on the name of their order. Their fervour invigorates the Church: all Spanish provinces gain at least +10% zeal and new converts."
25="The Albigensians, a branch of Catharism, go further than their teachers: they reject the clergy and everything sacred. They may change their name, but they remain heretics. They grow in Toulouse, Provence, Aquitaine and Genoa."
26="Word spreads that the True Cross has been found and entrusted to the Church of Castile. Devout pilgrims arrive from all over the peninsula and Catholic zeal rises across Spain."
27="Francis of Assisi preaches poverty and a simple life, and the Pope approves his rule. The new Franciscan order wins followers by example. Zeal and conversions climb in Genoa, Naples, Rome, Tuscany and the Papal States."
28="The Nibelungenlied, the great poem of Germanic tradition, becomes common property for the Germans and helps them feel a single people. It inspires the commanders of the Holy Roman Empire: +1 loyalty."
29="Niketas Choniates, a worthy heir to Anna Comnena, writes histories in which the Empire and the Orthodox Church do not always look their best, though the reigning emperor comes out well: +1 influence and zeal -10% in all Orthodox provinces."
30="Thousands of youngsters set off for the Holy Land convinced that innocence alone will win the day. It ends in tragedy: many are deceived and, it seems, sold into slavery after embarking at Venice. Farming income falls in France and the Empire, and grieving parents turn from the Church towards heresy."
31="The English barons compel the king to accept limits on his power over them and over his subjects. The king loses 1 influence, but the nobility is bound closer to the crown: +3 loyalty for all English generals."
32="The Dominican Albertus Magnus studies Aristotle and the Arab thinkers and comments on them in widely read works. He honours Church and reason together: zeal -10% in Germany, while the Catholic Church wins new adherents."
33="Roger Bacon, student of Aristotle and of Arabic science, compiles the vast Opus Majus and passes on a love of enquiry to his pupils, though some of his ideas smack of sorcery. The English king gains +1 influence, but zeal falls by 10% in English provinces."
34="The Franciscan Bonaventure, as learned as Thomas Aquinas and a familiar of kings and popes, is admired for his holiness. By his writings and example he stirs up the flock of northern Italy."
35="Ibn Rushd, known in the West as Averroes, serves as judge and physician under the Almohads, and his commentaries on Aristotle are prized by scholars of both worlds. Admiration for his rationalism lowers zeal by 10% throughout Almohad Spain."
36="An exceptional relic reaches Milan Cathedral: a skull held to be that of Saint John the Baptist as a youth. The marvel draws the faithful from every direction and Catholic zeal grows across northern Italy."
37="Alchemists have produced an explosive mixture, gunpowder. It stinks of sulphur, makes an infernal din and some think it unworthy of knights, but it will soon appear on the battlefield."
38="The Dominican Thomas Aquinas, one of the greatest theologians of his age, remains true to his vows despite temptations arranged by his own relatives. His teaching inspires zeal and swells the Church's flock in Italy."
39="Although lending at interest is regarded as sinful, wealthy families begin to finance merchants, safeguard their capital and transfer it between branches in different provinces. It is a turning point for trade."
40="For centuries the day was cut into hours that lengthened and shortened with the seasons. Mechanical clocks strike equal, steady hours, and work and exchange fall into the new rhythm, with greater productivity."
41="The Aragonese nobles force their sovereign to recognise privileges that limit his power: his influence declines. But the nobility likes the new balance and all Spanish generals gain +2 loyalty."
42="The scholastic theologian John Duns Scotus tries to reconcile Aristotle with Christian doctrine. His reasoning is too subtle for ordinary people, and zeal falls in Scotland, Northumbria, Mercia and Wales."
43="Threatened by their neighbours and caught up in the Empire's conflicts, the cantons of Uri, Schwyz and Unterwalden agree a pact of mutual defence. A modest beginning, but the future Swiss Confederation will field a fearsome force of pikemen."
44="Dante leads the reader through Hell, Purgatory and Paradise and, allegorically, places his political enemies there. It is a masterpiece, but it has its targets: zeal falls in Venice and the doge loses a little influence."
45="Marco Polo recounts his journeys as far as the court of the Great Khan and Cathay, with a flourish that seems barely credible. The silks and spices he has brought back are welcome all the same: new goods to trade in Tripoli and Syria."
46="The King of France summons nobles, clergy and townsmen, gathered in their separate estates, to win consent for laws and taxes. Being able to levy tribute and spend it freely strengthens his authority: +1 influence for the King of France."
47="For several seasons the weather has run wild: winter will not end, spring is sodden and summer never comes. Harvests fail and rivers freeze. This year's revenues will suffer all across northern Europe."
48="An unusual relic is presented in Paris: a fragment of the bread Christ ate. The cathedral becomes a pilgrimage destination and Catholic France gains +10% zeal."
49="The Dominican Meister Eckhart, vicar for Bohemia, is accused of heresy: his ideas about the soul and God show Greek and Arabic influence and clash with the Church's teaching. His sermons lead many to unorthodox views in Franconia, Bohemia, Frisia and Flanders."
50="William of Ockham holds that, among competing explanations, the simplest should be preferred. This principle, called Ockham's razor, gives scholars a method for nature, faith and life. Zeal falls by 10% in English provinces."
51="Jean Buridan is credited with the image of the donkey that, undecided between two identical heaps of hay, starves: a comic example about free will. His work ranges widely, though, from optics to mechanics and logic. Zeal -10% in all French provinces."
52="Francesco Petrarch, born in Arezzo, travels, studies and composes the verses to Laura that make him famous. His love lyrics, pleasant but hardly pious, lower zeal by at least 10% across much of northern Italy."
53="Giovanni Boccaccio, set on a career in trade and banking but ill-suited to business, writes the Decameron: a hundred tales told over ten days. Its irreverent tone lowers zeal by at least 10% throughout northern Italy."
54="Plague has overrun every corner of Europe. Towns, villages and households alike have been struck, the dead number in the millions and the mass graves cannot keep pace. For the survivors, prayer is the only comfort left."
55="In Spain angry mobs, often abetted by notables and officials, attack Jewish communities and drive them out of many provinces. Religion is the pretext for the violence and plunder; those who survived chose to flee."
56="John Wycliffe, a reformer who denounces clerical abuses, goes so far as to deny the church hierarchy and to challenge the wealth and privileges of prelates, besides reading the authority of Scripture in his own way. His theses seduce many in Northumbria, Mercia and Wessex, where heresy takes hold."
57="The Golden Bull lays down the rules for electing the emperor, a task given to seven prince-electors. Papal interference shrinks and imperial authority grows: more influence for the Emperor."
58="The Church acquires a sacred garment, the loincloth Christ is said to have worn on the cross. Kept at Bamberg, it raises the city's prestige and fires the faithful of Franconia and neighbouring provinces."
59="Ibn Battuta, jurist and traveller, returns from a long journey through India and China. His stories amaze, and the precious goods he carries impress even more. New goods to trade in Khazaria and the Crimea."
60="Hafez of Shiraz gathers his lyrics, in the ghazal form, in the Divan. The title hafez belongs to one who knows the Quran by heart, and his learning shows through the verses. Many convert to Islam in Islamic provinces, but Islamic zeal declines."
61="Catherine of Siena, who has seen visions of angels, Christ and the saints since childhood, is a mystic of deep piety and a forceful supporter of the Pope. An example to many believers, she raises the pontiff's influence."
62="The preacher John Ball attacks the privileges and wealth of nobles and prelates and urges the poor to rise against Crown and Church. Wessex becomes fertile ground for heresy and disloyalty."
63="Geoffrey Chaucer's Canterbury Tales, witty and at times bawdy, are hugely popular but make fun of clergy and authority. Zeal -20% in English provinces, and the king's influence rises."
64="The Lollards, followers of Wycliffe, read the Bible for themselves, reject the hierarchy, doubt transubstantiation and clerical celibacy, and preach pacifism and freedom in love. Mercia becomes a hotbed of heresy and disloyalty."
65="Jean Froissart, priest, poet and courtier, continues his chronicles to the glory of France and the monarchy. His writings, among the most widely read in Europe, improve the realm's image among scholars: the French king's influence grows."
66="The diplomat Manuel Chrysoloras translates Homer and Plato for a wider circle of scholars, restoring glory to the Byzantine Empire and fighting ignorance. The emperor's influence grows."
67="Jan Hus, a fiery and influential preacher, takes up Wycliffe's ideas and criticises the Church, rousing the people even against the Germans. He defies the emperor and the Pope's authority. Bohemia becomes a hotbed of heresy and disloyalty."
68="A most sacred relic comes to the Church: a piece of wood held to be of the True Cross. That it has survived to this day is, for many, proof of its authenticity. Catholic zeal rises across Italy."
69="With the crown's backing, the Portuguese navigator Gil Eanes pushes south along the African coast and passes Cape Bojador. His success brings prestige to the royal house and opens new trade: new goods in Portugal."
70="Jacques Cœur, merchant, banker, master of the mint and royal counsellor, boosts French trade with his schemes and enriches the country. The French king's acumen rises as well."
71="At the Althing, beneath the Law Rock, the Icelandic chieftains have agreed, through the lawspeaker Thorgeir, that everyone on the island shall be baptised; the old rites are tolerated only in private. Christian zeal grows in Iceland."
72="Sailing west from Greenland, Leif, son of Erik the Red, has reached a land of forests, meadows and wild vines, which he has named Vinland. His ships return laden with timber, the most precious of goods for the Greenland settlers: a new trade good in Greenland."
73="With a crown sent by Pope Sylvester II, Prince Stephen has been crowned the first Christian king of Hungary. The new ruler founds bishoprics and monasteries and imposes the new faith on the whole realm. Zeal grows in the Hungarian provinces."
74="At Chichén Itzá the priests have consecrated the great pyramid of Kukulkan, the Feathered Serpent: four stairways, one for each direction, and at the equinox the shadow of a serpent slides down the steps. Pilgrims come from all over Yucatán. Zeal grows in the Maya lands."
75="At the Heian court a lady-in-waiting of the empress, known as Murasaki Shikibu, is circulating the chapters of a long tale of the loves of the Shining Prince Genji. Courtiers and ladies compete for copies, and the refinement of the capital becomes a model for the whole archipelago."
76="While the Khitan threaten the kingdom of Goryeo, the king orders the whole Buddhist canon to be carved on thousands of wooden blocks, so that the Buddha's protection may save the country. Monks and carvers will labour for decades. Zeal grows in Korea."
77="The physician and philosopher Ibn Sina, whom the Latins call Avicenna, has completed the Canon of Medicine, a summa of all Greek and Persian learning on diseases and remedies. His pupils also read it as an invitation to trust reason: zeal falls in Persia."
78="King Rajendra Chola has sent a great fleet across the sea against the ports of Srivijaya, which barred the straits towards China. The ships return with plunder and with control of the routes: a new trade good, silk, reaches the Chola lands."
79="The monk Guido of Arezzo has devised a way of writing chant on parallel lines and of naming the notes after the syllables of a hymn: ut, re, mi, fa, sol, la. A boy can now learn in a few months what once took years: church choirs multiply and zeal grows in central Italy."
80="Gathered in synod at Toulouges, bishops and abbots have proclaimed the Truce of God: from Saturday evening to Monday morning, and in holy seasons, no knight may fight or attack clerics, peasants and merchants, on pain of excommunication. The lords swear on the relics. Zeal grows in southern France."
81="A year after his death in battle at Stiklestad, King Olaf's body has been exhumed incorrupt, with hair and nails grown, and the bishop has proclaimed him a saint. Pilgrims from all over the North flock to Nidaros. Zeal grows in Norway."
82="Grand Prince Yaroslav the Wise has raised in Kiev a cathedral dedicated to Holy Wisdom, with thirteen domes and golden mosaics by masters from Constantinople. Beside it stands a library where books are copied and translated. Zeal grows in the region of Kiev."
83="In Chaco Canyon the ancestral builders are raising Pueblo Bonito: hundreds of rooms on several storeys around great round kivas, aligned with the sun and the moon. Turquoise, shells and even red-feathered birds arrive from afar. Zeal grows in Chaco."
84="On the banks of the Mississippi thousands of people carry baskets of earth to raise an immense terraced mound, on whose summit the house of the chief, brother of the sun, will stand. Around it spreads a city of plazas, palisades and maize fields. Zeal grows along the Mississippi."
85="The regent Fujiwara no Yorimichi has consecrated the Phoenix Hall at Uji, where a gilded statue of Amida Buddha sits above a pond, as in the Pure Land of the West. More and more believers call upon Amida's name to be reborn in his paradise. Zeal grows in the Kinai."
86="In the basilica of Hagia Sophia the papal legate, Cardinal Humbert, has laid on the altar a bull of excommunication against Patriarch Michael Cerularius, who has replied by excommunicating the legates. Rome and Constantinople part ways; the eastern faithful rally round their patriarchs and zeal grows in every Orthodox province."
87="The Abbasid caliph has received the Turkish warlord Tughril Beg with great honours and granted him the title of sultan, king of East and West and defender of the Sunni faith. The religious prestige of the Turkish leader grows: +1 piety."
88="King Udayadityavarman II has raised at the heart of his capital the Baphuon, a sacred mountain of sandstone with five terraces, the dwelling of the gods on earth. A long causeway on columns crosses the water to its gate. Zeal grows in the Khmer lands."
89="For seven nights a star with a long mane of fire has crossed the skies of Europe. Monks record the portent in their chronicles, kings consult astrologers and the people read in it the herald of wars and falling kingdoms. Out of fear many return to prayer: zeal grows in every Catholic province."
90="Grand Councillor Wang Anshi has persuaded the emperor to approve the New Policies: state loans to peasants in spring, public purchases of harvests, a tax in place of labour service and a new survey of the land. Conservative scholars protest, but the imperial treasury fills: +1500 denarii."
91="Yusuf of Balasagun has presented to the khan of Kashgar the Kutadgu Bilig, a long poem in the Turkic tongue that teaches how to rule with justice and serve with loyalty. The commanders learn it by heart: +1 loyalty for the Karakhanid generals."
92="At the foot of the Atlas, the Almoravid leader Abu Bakr ibn Umar has laid out the camp of a new city, Marrakesh, with a mosque, a palace of mud brick and a ring of palm groves. From here the veiled warriors spread their stern religious rigour: zeal grows in Morocco."
93="Excommunicated by Pope Gregory VII, the king of Germany has waited three days in the snow, barefoot and dressed as a penitent, before the walls of the castle of Canossa, until the pontiff absolved him. But the German princes have seen their king on his knees: -2 loyalty for the generals of the Holy Roman Empire."
94="Heeding the teaching of the scholar Muhammad ibn Mani, Mai Hummay of Kanem has embraced Islam together with his court. A mosque is being built in the capital Njimi and the merchants who cross the Sahara find a friendly kingdom. Zeal grows in Kanem."
95="King Sejong has promulgated 'the correct sounds for the instruction of the people': twenty-eight simple letters, which anyone can learn in a few days, in place of the difficult Chinese characters. The court scholars protest, but the officials, at last understood by their subjects, serve the crown with greater devotion: +1 loyalty for the Korean generals."
96="Above the gorges of the Urubamba, the Inca Pachacuti is building a residence of squared stones laid without mortar, with temples to the Sun, farmed terraces and fountains, poised between two peaks. Astronomers observe the solstices there. Zeal grows around Cuzco."
97="At Mainz the goldsmith Johannes Gutenberg has printed an entire Bible with movable metal letters, ink and a wine press. What a copyist did in three years can now be done in a few weeks, and books begin to circulate at unheard-of prices. Ideas travel faster than the clergy: zeal falls in the German lands."
98="Nezahualcoyotl, lord of Texcoco and ally of Tenochtitlan, composes songs on the brevity of life, writes stern but just laws and builds aqueducts and gardens. Poets and sages flourish at his court, and the lords of the Triple Alliance admire his wisdom: +1 loyalty for the Aztec generals."
99="Cosimo de' Medici has given the young Marsilio Ficino a villa at Careggi and the Greek manuscripts needed to translate all of Plato's works into Latin. Philosophers, poets and merchants gather around him, discussing the soul and beauty more than dogma: zeal falls in Tuscany."
100="Mai Ali Gaji has ended the struggles between the branches of the dynasty and founded a lasting capital, Ngazargamu, girded by high walls of red brick. The salt and horse caravans pass through the realm again and tribute flows in: +1000 denarii."
101="With a bull of Pope Sixtus IV, Ferdinand and Isabella have established in their kingdoms a tribunal of the Inquisition answerable only to the crown. Converts suspected of secretly practising their old faith are questioned and tried in public. Fear strengthens orthodoxy: zeal grows in the Spanish provinces."
102="The tlatoani Ahuitzotl has rededicated the Great Temple of Tenochtitlan, enlarged with a new twin-stair pyramid devoted to Huitzilopochtli and Tlaloc. For days the lords of the whole land climb it in procession and bring tribute. Zeal grows at the heart of the Aztec lands."
103="Three small ships that left Palos under the Genoese Christopher Columbus have sailed west across the Ocean for more than two months and made landfall on an island the natives call Guanahani. Columbus believes he has reached the gates of the Indies; in the ports of Europe people talk of nothing else."
104="Friar Luca Pacioli has printed in Venice his Summa de arithmetica, which teaches how to keep accounts 'the Venetian way': every sum written twice, as debit and credit, so that nothing escapes. Merchants and mint officials adopt it at once and the state's accounts are put in order: +1000 denarii for the ruler of Venice."
105="In the Dominican refectory of Santa Maria delle Grazie, Leonardo da Vinci has finished painting the Last Supper: the apostles, shaken, react to the announcement of the betrayal. People come from all over Lombardy to see the work, which moves even the coldest hearts. Zeal grows in Milan."
106="Vasco da Gama's fleet, having rounded the Cape of Good Hope and crossed the Indian Ocean, has dropped anchor at Calicut, the city of pepper. For the first time spices can reach Europe by sea, without passing through the merchants of Egypt and Venice: a new trade good in Portugal."
107="Emerging after three days from the waters of the river Bein, the accountant Nanak has begun to preach: 'There is no Hindu, there is no Muslim', only one formless God, to be served with honesty and work. With his musician companion Mardana he travels the Punjab singing hymns. Zeal grows in the Punjab."
108="After three years' work on a block nobody dared touch, Michelangelo Buonarroti has delivered the David, a marble giant more than four metres tall. Hauled with great effort before the Palazzo della Signoria, it is the symbol of a small city unafraid of the mighty: +1 loyalty for the generals of the ruler of Tuscany."
109="The monk Philotheus of Pskov has written to the grand prince of Moscow: 'Two Romes have fallen, the third stands, and there shall be no fourth.' Rome has fallen into heresy and Constantinople into misfortune: Moscow feels itself heir to the Empire and guardian of the true faith. Zeal grows in the Russian provinces."
110="The London lawyer Thomas More has published a little book about an imaginary island, Utopia, where there is no private property, people work six hours a day and every faith is tolerated. Many laugh, others reflect on the ills of England, and some begin to doubt the order willed by God: zeal falls in the English provinces."
111="The Augustinian monk Martin Luther has posted on the door of the castle church at Wittenberg ninety-five theses against the sale of indulgences. Thanks to printing, within weeks his words run through all of Germany; princes and townsmen feel that the Church of Rome can be defied. Heresy spreads through the German lands."
112="A single ship, the Victoria, has returned to Spain with eighteen exhausted men: all that remains of the five-ship fleet that left three years ago under Ferdinand Magellan, who died in the islands of the East. Sailing ever westward they have gone round the world, and the hold is full of cloves from the Moluccas: a new trade good in Castile."
113="After a public disputation before the city council, the preacher Huldrych Zwingli has persuaded Zurich to abolish the Mass, remove images from the churches and close the convents. Some cantons look on with interest, others with horror: heresy spreads in Switzerland."
114="To obtain the annulment of the marriage the Pope refused him, the king of England has had Parliament proclaim him Supreme Head of the Church of England. Those who refuse the oath risk their lives, the monasteries tremble for their lands and the ties with Rome are broken: heresy spreads in England."
115="Pope Paul III has approved the Society of Jesus founded by the Basque Ignatius of Loyola, a former soldier: educated and disciplined priests, bound to the pontiff by a special vow of obedience, ready to teach, preach and set out for every corner of the world. Zeal grows in Italy and the Iberian peninsula."
116="Recalled by the city council, the French theologian John Calvin has returned to Geneva and imposed a stern Church there, governed by pastors and elders who watch over everyone's morals. From there books and preachers cross into France, where the Huguenots multiply in the south: heresy spreads."
117="Shortly before his death, Canon Nicolaus Copernicus has seen his work on the revolutions of the heavenly spheres in print: it is not the Sun that circles the Earth, but the Earth that circles the Sun. Theologians judge it an extravagant hypothesis, but scholars begin to doubt the heavens of their fathers: zeal falls in Poland and Prussia."
118="On the Andean plateau, more than four thousand metres up, a herdsman has discovered that the mountain of Potosí is threaded with veins of the purest silver. Within months thousands of miners rush there and a town springs up around the shafts: +2000 denarii for the ruler of the region of Charcas."
119="King Ang Chan has brought the court back among the temples of Angkor, abandoned in the forest for generations. Sculptors complete the galleries left unfinished and Buddhist monks once more officiate in the great sanctuary. Zeal grows in the Khmer lands."
120="Some K'iche' nobles, so that it may not be lost, have written down the ancient story of their people: the creation of the world, the men of maize, the deeds of the divine twins in the underworld. The Popol Vuh passes from hand to hand among the Maya lords: zeal for the ancient gods grows."
121="At the diet of Augsburg the Catholic and Lutheran princes have signed the peace: each will choose the faith of his own territory, and the subjects must follow it or emigrate. 'Whose realm, his religion.' The weapons fall silent and the princes return to serving the Empire: +2 loyalty for the generals of the Holy Roman Empire."
122="The architect Sinan has completed for the sultan a great mosque with an immense dome, four minarets, schools, a library, a hospital and kitchens for the poor. It is the wonder of the capital and the sign of the dynasty's greatness: zeal grows in the Turkish provinces."
123="Back from Geneva, the preacher John Knox fires the crowds of Edinburgh against the Mass and against images. The Scottish Parliament has adopted a new confession of faith and broken with the Pope: heresy spreads in Scotland."
124="After eighteen years of sessions interrupted by wars and plagues, the fathers of the Council of Trent have concluded their work: the sacraments and the cult of the saints confirmed, bishops obliged to reside in their dioceses, seminaries founded to train the clergy. The Catholic Church emerges renewed: zeal grows in every Catholic province."
125="Mai Idris Alooma has returned from the pilgrimage to Mecca with scholars, books and Turkish musketeers. He has brick mosques built, appoints judges of Islamic law and governs with a severity his subjects call justice: +1 piety for the leader of Kanem."
126="Gathered in Warsaw during the interregnum, the Polish nobles have sworn never to shed blood over matters of faith: Catholics, Lutherans, Calvinists and Orthodox will have equal rights in the Commonwealth. While the rest of Europe burns, the nobility stays united: +1 loyalty for the Polish generals."
127="On the shores of Lake Kokonor, Altan Khan has welcomed the Tibetan master Sonam Gyatso and given him the title of Dalai Lama, 'ocean of wisdom'; in return the lama has recognised him as heir of Kublai. The Mongols embrace Buddhism en masse: zeal grows in their lands."
128="With the bull Inter gravissimas Pope Gregory XIII has corrected the calendar, which had drifted from the course of the sun for centuries: this year Thursday 4 October will be followed directly by Friday 15 October. Catholic countries obey; Protestants and Orthodox refuse to count the days as the Pope does."
129="The regent has invited to the Kitano shrine anyone, noble or peasant, provided they brought a cup and a kettle. The master Sen no Rikyu has served tea according to the 'way of tea', simple and silent, uniting warriors and merchants in the same gesture: +1 loyalty for the Japanese generals."
130="Shah Abbas has chosen Isfahan as his capital and is laying out an immense square, the 'image of the world', surrounded by covered bazaars, mosques with turquoise domes and a palace from which to watch polo matches. Armenian, European and Indian merchants flock there: 'Isfahan is half the world'. +1000 denarii for the ruler of the region."
131="After eight years on trial, the friar-philosopher Giordano Bruno, who spoke of infinite worlds and refused to recant, has been led to Campo de' Fiori and burned alive. 'Perhaps you pronounce this sentence with greater fear than I receive it,' he is said to have told his judges. The Inquisition shows its power: zeal grows in Rome."
132="The Queen of England has granted a group of London merchants the monopoly of trade beyond the Cape of Good Hope. The Company raises capital among hundreds of shareholders and fits out ships for the spice islands: the first shares at once bring the crown +1500 denarii."
133="On the dry riverbed of the Kamo in Kyoto, a dancer named Okuni, dressed as a young samurai with a Christian cross at her neck, stages dances and risqué sketches that draw enormous crowds. The monks are scandalised, but people flock there every day: zeal falls in the Kinai."
134="Miguel de Cervantes, an old soldier wounded at Lepanto, has published the adventures of a gentleman of La Mancha who, driven mad by reading tales of chivalry, sets out to right wrongs with his squire. All Spain laughs, and laughing begins to look on its own ideals with irony: zeal falls in the Spanish provinces."
135="With a telescope of his own making, the Paduan professor Galileo Galilei has seen mountains on the Moon, countless stars in the Milky Way and four moons circling Jupiter. His little book sells out: the heavens are not as perfect as the theologians taught, and zeal falls in Venice and Tuscany."
136="Facing the ancient madrasa of Ulugh Beg, the governor of Samarkand is raising the Sher-Dor, a Koranic school with portals covered in glazed tiles, where two tigers chase two deer beneath a sun with a human face. Students and pilgrims fill the square: zeal grows in Transoxiana."
137="In the mines of Kollur, along the river Krishna, thousands of workers sift gravel in search of diamonds, and stones as large as pigeons' eggs come out of them. Jewellers from Persia, Europe and India flock to the markets of Golconda: +1500 denarii for the ruler of the Deccan."
138="To honour his beloved wife, who died in childbirth, the emperor has begun to build at Agra, on the bank of the Yamuna, a mausoleum of white marble inlaid with precious stones, in the midst of a garden of paradise. Twenty thousand workers will labour on it for twenty years: zeal grows in the region."
139="A French gentleman living in seclusion in the United Provinces, René Descartes, has published at Leiden a discourse on the method of rightly conducting reason: doubt everything until only one certainty remains, 'I think, therefore I am'. The universities of the Netherlands talk of nothing else: zeal falls in Frisia and Flanders."
140="The King of France has moved his court and government to the palace of Versailles, with its gilded halls and endless gardens. The great nobles, once rebellious, now live under the sovereign's eyes and compete for the honour of handing him his shirt at his rising: +2 loyalty for the French generals."
141="The Cambridge professor Isaac Newton has published the Mathematical Principles of Natural Philosophy: the same force that makes an apple fall keeps the Moon in orbit round the Earth and the planets round the Sun, according to laws that can be calculated. The universe looks like a perfect clock: zeal falls in the English provinces."

