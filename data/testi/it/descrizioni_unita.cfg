; Testi propri di Medieval Quest (riscritti il 2026-11-18): descrizioni delle unita'

[descrizioni_unita]
AbyssinianEliteGuard="Reparto scelto di guerrieri etiopi, spesso reclutati da giovani come schiavi-soldato e addestrati con rigore. Servono come guardia personale del sultano del Cairo e uniscono disciplina e ottima abilità nel combattimento ravvicinato."
AbyssinianGuard="Fanti etiopi al servizio dei sovrani d'Egitto da generazioni, armati di ascia. Disciplinati, aprono varchi nelle linee avversarie, ma l'equipaggiamento leggero li espone ai colpi. Sono più efficaci contro contadini, milizie e lancieri."
AlanMercenaryCavalry="Cavalieri delle steppe del Caucaso, assoldati soprattutto da Bisanzio. Leggeri e mobili, sono adatti a schermaglie, imboscate e alla protezione dei fianchi della cavalleria pesante."
AlmohadUrbanMilitia="Milizie cittadine della Spagna musulmana, formate per difendere i centri abitati sotto la pressione cristiana. Addestrate e ben armate, combattono con più aggressività dei comuni miliziani e si avvicinano a una piccola truppa permanente."
Almughavars="Mercenari catalani e aragonesi dall'equipaggiamento leggero, attivi in tutto il Mediterraneo. Aprono il combattimento con una salva di giavellotti e poi si lanciano all'assalto con la lancia, distinguendosi per tenacia e ferocia."
AngevinInfantry="Fanti reclutati nei villaggi inglesi e addestrati in vista delle crociate, come quella di Riccardo I. Equipaggiati di scudo, spada corta e maglia, danno spessore alla linea di battaglia."
ArabHeavyInfantry="Fanteria pesante, in genere schiavi addestrati o mercenari di Damasco, del Cairo e di Baghdad. Colma la carenza di fanti robusti negli eserciti islamici, dove la nobiltà preferiva restare a cavallo."
ArabInfantry="Il nerbo degli eserciti islamici a piedi. Armati di spada e scudo, se la cavano bene in mischia e sono più utili all'attacco che nella difesa."
Arbalester="Balestrieri con balestra pesante, il cui dardo penetra quasi ogni corazza. La ricarica richiede un piccolo argano ed è molto lenta, per cui vanno protetti da altre truppe: così schierati diventano micidiali."
Archers="Tiratori con arco corto, tratti da cacciatori e contadini. Possono ferire anche un uomo corazzato, ma la loro arma ha potenza e gittata inferiori a quelle dei veri archi da guerra."
ArmenianHeavyCavalry="Cavalleria pesante armena, apprezzata fin dall'età romana. Disciplinata e aggressiva, con la lancia sferra una carica iniziale potente ed è più affidabile della comune cavalleria feudale."
ArmenianInfantry="Fanteria degli eserciti armeni di Cilicia, erede di una lunga tradizione guerriera in Asia Minore. È una truppa capace e fidata, adatta a ogni compito della linea."
ArmouredAlmughavars="Versione d'élite degli almogàveri, con equipaggiamento più pesante riservato ai più ricchi o fortunati. Come i compagni lanciano giavellotti prima del corpo a corpo, ma reggono meglio i colpi."
ArmouredSpearmen="Lancieri con cotta di maglia e scudo. Economici da armare e addestrare, tengono bene il campo contro quasi ogni fanteria e sono particolarmente efficaci contro la cavalleria."
Arquebusier="Tiratori con archibugio a miccia, arma semplice da usare e discretamente precisa. Le salve scuotono il morale oltre a ferire, ma con la pioggia la miccia si spegne e non possono sparare."
Arsenalotti="Guardia scelta del doge di Venezia, tratta dalle maestranze dell'Arsenale. Presidia i palazzi del governo, svolge compiti di polizia e antincendio e può fornire reparti di fanteria ben equipaggiata."
Assassin="Agente che tenta di eliminare un altro personaggio. Il successo dipende dalla sua perizia e dal rango del bersaglio."
AvarNobles="Nobili avari a cavallo, come altri popoli delle steppe forti soprattutto nella cavalleria. Meno corazzati dei catafratti bizantini, ma veloci e temibili per colpire i fianchi e disgregare gli schieramenti."
AvizFootKnights="Cavalieri dell'ordine portoghese di Avis, che combattono appiedati perché la cavalleria pesante non regge più contro fanteria addestrata e armi da fuoco. Sono un'élite militare adatta a conquistare terre in Spagna e in Africa."
Baggala="Nave araba derivata dal dau, con una catapulta che lancia vasi di fuoco greco contro i vascelli nemici. I pirati ne usano versioni che scagliano solo pietre, non possedendo il fuoco greco."
BallistaCrew="Serventi di una balista, macchina di origine greca simile a una grossa balestra. La potenza viene da fasci di tendini ritorti; scaglia grandi dardi o pietre a grande distanza con effetto letale."
Barque="Piccolo veliero a un albero, economico e semplice da costruire ma adatto solo a brevi tratte in acque basse. In mare aperto rischia di affondare e il suo equipaggio ridotto abborda con poca efficacia."
Bashkorts="Popolo degli Urali imparentato con finni e ungheresi, stanziato presso le sorgenti del Volga. Poco incline alla guerra, viene arruolato a forza dai signori musulmani come fanteria di appoggio alla cavalleria bulgara."
BedouinCamelGun="Beduini che portano sulla sella del cammello un piccolo cannone da campo, il jezail. L'animale deve restare fermo per sparare, ma la mobilità consente di avanzare, far fuoco e ritirarsi a ricaricare sorprendendo il nemico."
BedouinCamelWarriors="Guerrieri del deserto in sella a cammelli, tenaci ma talvolta poco disciplinati. Impressionano le truppe che non conoscono i cammelli, specie alla carica, e l'odore disturba i cavalli; restano però vulnerabili ai lancieri."
BerberCamel="Resistenti combattenti del deserto che operano come arcieri a cammello per disturbare il nemico. Nel corpo a corpo reggono contro cavalleria leggera simile, e l'odore dei cammelli tiene lontani molti cavalli."
Berserkers="Guerrieri nordici in preda a furia sacra, che rifiutano l'armatura. Seminano strage in battaglia, ma non si lasciano guidare: il comandante accorto li scatena e basta."
Besteiros="Contadini-soldato portoghesi, riuniti in reparti improvvisati con armi modeste. Possono travolgere alcuni avversari e fanno da ossatura alle forze del regno, ma contro fanteria valida o cavalleria pesante hanno bisogno di sostegno."
Billmen="Fanti inglesi con la roncola, un attrezzo agricolo trasformato in arma in asta dotata di lama e uncino. Ben addestrati contro uomini corazzati e a cavallo, li abbattono di sella e li finiscono a terra."
Bishop="Ecclesiastico che rafforza la fede dei cattolici nella provincia in cui si trova. Non ha effetto sui cristiani ortodossi."
BohemianBowmen="Arcieri del regno di Boemia, molto utili in difesa. Infliggono forti perdite a distanza e poi appoggiano il resto dell'esercito nel combattimento ravvicinato."
BombardCrew="Serventi di una bombarda, una delle prime armi da fuoco, costruita con cerchi di ferro battuto su supporto fisso. Impiegata negli assedi, lancia sfere di pietra che si spaccano al contatto; può scoppiare, ma sgomenta chi non conosce la polvere."
Bonnachts="Guerrieri irlandesi per i quali la lancia è l'arma prediletta dopo la spada. Scagliata da breve distanza durante l'avvicinamento, ha un effetto devastante e dà alla carica un secondo colpo."
Boom="Imbarcazione araba affine al dau, armata di un piccolo cannone e con equipaggio sufficiente per l'abbordaggio. Batte le galee ed è abbastanza agile da attaccare da quasi ogni direzione."
Boyar="Nobiltà terriera russa addestrata come cavalleria pesante di guardia. Cotta di maglia pesante, spada e arco ne fanno una forza temibile, affinata dalla continua pratica della guerra."
BulgarianArmouredPikemen="Picchieri bulgari con protezione superiore a quella di molti occidentali. Le prime quattro file combattono insieme e sono letali contro la cavalleria; richiedono però addestramento più lungo per via della picca."
BulgarianBrigands="Montanari dei Balcani, abbastanza organizzati e duri da servire come mercenari. Versatili con arco e spada, ma nei momenti critici possono perdere il coraggio."
BulgarianCavalry="Arcieri a cavallo più leggeri, a supporto dei boiari bulgari e talvolta tratti dai nomadi cumani e peceneghi assorbiti nel regno. Veloci, attirano le truppe pesanti fuori formazione e poi le finiscono."
BulgarianHeavyInfantry="Fanteria pesante, truppa a piedi principale degli eserciti bulgari. Temprata da secoli di guerre con bizantini e serbi, è efficace pur con armi e corazze meno moderne di quelle occidentali."
BulgarianRoyalCavalry="Cavalleria pesante dei bulgari del Volga, più corazzata di quella tipica delle steppe e armata di lancia oltre che di spada."
ByzantineCavalry="Cavalieri disciplinati e corazzati dell'esercito statale bizantino, eredi delle legioni romane, armati di arco e spada. Meno rapidi dei mercenari delle steppe, ma affidabili in battaglia."
ByzantineInfantry="Fanti di professione di tradizione romana, con maglia, scudi grandi e spada. Affrontano con perizia quasi ogni avversario e sono tra le migliori fanterie pesanti dell'Europa orientale."
ByzantineLancers="Lancieri a cavallo, base della cavalleria bizantina. Più leggeri ed economici dei catafratti, ma protetti e capaci di cariche pesanti; conviene indebolire prima il nemico con gli arcieri."
Caravel="Nave d'alto mare di origine mediterranea, ormai diffusa ovunque, che sopporta alcune tempeste. In battaglia è solo discreta: piccole catapulte colpiscono le navi nemiche, ma con vento debole manovra male."
Cardinal="Alto dignitario della Chiesa cattolica, la cui sola presenza rafforza notevolmente la fede dei cattolici."
Carrack="Nave slanciata derivata dalla cocca, robusta con mare grosso e capace di grandi carichi. Con cannoni, colubrine, soldati e grande equipaggio supera di norma ogni altro vascello."
CatapultCrew="Serventi di una catapulta di origine romana: il braccio, azionato da corde o tendini ritorti, lancia proiettili a distanza. Semplice e discretamente potente, verrà poi superata dall'artiglieria a polvere."
CelticWarriors="Fanti leggeri delle terre celtiche, noti fin dall'antichità per la ferocia. Costituiscono il centro degli eserciti celtici."
ChernyeKlobuki="Lancieri a cavallo della tribù dei berendei, detti Cappucci Neri. Leggeri ed economici ma protetti, sanno caricare con forza; è bene indebolire prima il nemico con gli arcieri."
ChivalricFootKnights="Cavalieri a piedi in armatura a piastre, armati di azze concepite per sfondare ogni corazza. Élite addestrata fin dall'infanzia, ma per questo anche impetuosa."
ChivalricKnights="Cavalieri in armature a piastre con cavalli bardati e lance, che garantiscono una carica formidabile. Addestrati da bambini, sono un'élite ma tendono a lanciarsi in battaglia senza riflettere."
ChivalricManAtArms="Fanteria pesantissima di soldati di professione o piccoli signori, con corazze vecchie o già usate da altri. Spadaccini adatti sia all'attacco sia alla difesa, spesso ossatura della linea, anche se il peso della protezione li rallenta."
ChivalricSergeants="Lancieri pesanti, soldati di mestiere o uomini che sperano di essere elevati alla nobiltà. L'equipaggiamento è un po' datato ma curato e la loro abilità individuale è alta; possono però mancare di disciplina."
Cog="Nave nata dai progressi nella costruzione navale, robusta e a pescaggio profondo, con equipaggio e truppe numerosi. Armata di mezzi cannoni, è versatile in combattimento."
Coustillier="Cavalleria leggera dell'esercito borgognone, armata di giavellotto, spada e lancia. Buoni schermagliatori, per via dell'armatura leggera vanno impiegati in razzie rapide e aggiramenti."
Crossbows="Balestrieri che imparano l'arma in poche settimane, mentre un arciere richiede anni. Anche il più umile può uccidere un nobile, e per questo i potenti la considerano un'arma sleale."
Crusade="Movimento popolare oltre che esercito, sorto per cacciare i nemici della Chiesa da una provincia. Una volta partita non si richiama, e la sua forza cresce o cala durante la marcia in base ai successi e al fervore delle province attraversate."
CulverinCrew="Serventi di una colubrina, cannone a canna lunga su affusto leggero. La canna sottile assicura buona gittata e consuma meno polvere; arriva a scagliare proiettili di 45 kg, ma i comandanti preferiscono pezzi più leggeri e facili da trasportare."
CumanHeavyCavalry="Cavalleria pesante dei cumani, popolo delle steppe. Meno corazzata dei catafratti bizantini, ma rapida e temibile per colpire i fianchi e scompaginare i reparti."
CumanWarriors="Nomadi delle steppe, per lungo tempo minaccia per i principi russi e per l'impero bizantino. Combattono a piedi solo i membri più poveri della tribù; sono buoni tiratori e colpiscono con le frecce prima di lanciarsi nella mischia."
DarkAgeKnights="Nobili a cavallo, antenati del cavaliere medievale. Meglio equipaggiati e addestrati della truppa comune, mollano meno facilmente e costituiscono una buona cavalleria media, in grado di sostenere ogni scontro tranne quelli con i nemici più corazzati."
DarkAgeRoyalKnights="Guardia reale a cavallo, nucleo della maggior parte degli eserciti dei sovrani. Pochi, costosi e di grande addestramento, se impiegati con giudizio possono decidere uno scontro."
Dejma="Arcieri leggeri delle isole del Mediterraneo e dell'Egeo, nate come guarnigione e polizia contro pirati e predoni, di guardia alle torri costiere. Le potenze occupanti, apprezzandone le doti, li impiegano anche all'estero."
DemicannonCrew="Serventi di un mezzo cannone, arma d'assedio piccola solo in confronto agli altri pezzi e spesso molto pesante. Su un affusto robusto, una volta piazzato non si sposta più; lancia palle fino a 30 kg con effetti notevoli."
DemiculverinCrew="Serventi di una mezza colubrina, di calibro ridotto, che spara palle di 3-4 kg. Ben costruita ed economica, è un pezzo versatile e facile da piazzare."
DesertArchers="Arcieri leggeri dei popoli del deserto, dotati di ottimi archi compositi. Devono bersagliare il nemico restando fuori portata, perché in mischia rendono poco."
Dhow="Piccola nave mercantile e da guerra del mondo arabo, veloce e maneggevole: coi venti deboli può cercare lo scontro o sottrarsi a nemici più forti. Priva di armi, attacca con l'equipaggio, che aggancia e abborda."
DismountedFaris="Cavalieri arabi che combattono a piedi con la stessa abilità che a cavallo. Professionisti ben addestrati, meno corazzati degli omologhi franchi."
Dromon="Piccola galea a vele e remi, di pescaggio basso, usata per esplorazione e navigazione costiera. Non è fatta per le battaglie, ma con mare calmo supera le navi minori e può sfuggire grazie alla velocità."
DruzhinaCavalry="Cavalleria della družina, parte importante degli eserciti della Rus'. Ispirata, a quanto si dice, ai modelli bizantini noti a scandinavi e russi della guardia variaga, ha corazza più leggera ma è efficace."
DruzhinaInfantry="Robusti fanti russi della družina, influenzati dalle tradizioni militari bizantine e vichinghe. Valgono o superano la fanteria dei regni vicini e maneggiano con precisione spada e scudo."
EarlyCarskaGarda="Guardia dello zar serbo, élite addestrata a scortare il sovrano. Cotta pesante, spada e arco ne fanno una forza temibile, mantenuta efficiente dalla pratica costante della guerra."
EarlyDidebuls="Piccola nobiltà armena, nucleo scelto dell'esercito. Possiede modesti territori e ricorda da vicino i cavalieri europei."
EarlyFootKnights="Nobili appiedati, erede della tradizione celtica, sassone e vichinga dei signori con milizia propria; sono l'equivalente normanno degli huscarl. Professionisti, formano una fanteria molto efficace."
EarlyNaxarars="I nakharar sono la grande aristocrazia fondiaria armena, simile ai signori feudali europei. Governano e combattono, scendendo in campo come cavalleria pesante ben equipaggiata."
EarlyRoyalFootKnights="Guardia reale appiedata, nucleo di quasi ogni esercito dei sovrani. Pochi, costosi e addestratissimi, se usati con avvedutezza possono decidere la battaglia."
EarlyRoyalGhulamKnights="I ghulam, schiavi-soldato, formano la guardia e la miglior cavalleria del sultano. In cotta pesante e con la lancia eguagliano ogni altra cavalleria pesante; ne guidano un nucleo il sultano e ciascun principe, mentre altri reparti si addestrano a prezzo elevato."
EarlyRoyalKnights="Guardia scelta del re a cavallo, con cotta di maglia, cavalli bardati e lancia. La fedeltà al sovrano li rende ancora più pericolosi. Re e principi di sangue ne guidano piccoli gruppi; arruolarne altri è possibile ma costoso."
EarlyVarangianGuard="Fanteria pesante d'élite reclutata tra russi e vichinghi, complemento della celebre cavalleria corazzata bizantina. Diversi sovrani scandinavi hanno poi conquistato il trono al ritorno da un periodo di servizio nella guardia."
EarlyVlastelaCavalry="Nobiltà a cavallo serba, equivalente dei cavalieri occidentali. L'equipaggiamento può essere datato o trascurato, ma alla carica a pieno galoppo si fanno rispettare."
Emissary="Nobile o uomo di rango elevato, formato alla diplomazia e mandato presso sovrani e signori rivali. Rappresenta il suo padrone nel luogo in cui si trova e gli riferisce ciò che vede."
Faris="Il termine arabo significa cavaliere. I faris sono cavalieri di professione, ben addestrati ed equipaggiati, e molti li considerano pari ai cavalieri cristiani."
FeudalFootKnights="Cavalieri feudali appiedati, élite educata alle armi fin da bambini che possiede terre in cambio del servizio. Prediligono la lancia per il vantaggio nella carica; maglia e scudo li difendono bene dai reparti inferiori."
FeudalKnights="Cavalieri che ricevono la terra in cambio del servizio armato, addestrati fin da bambini. Con la lancia travolgono il nemico, ma il loro onore e il loro coraggio sfiorano l'imprudenza."
FeudalManAtArms="Guerrieri temprati in cerca di posizione sociale, con cotte di seconda mano o antiquate, spadone e scudo. Validi sia in attacco sia in difesa."
FeudalSergeants="Lancieri di mestiere, inferiori ai cavalieri ma superiori ai contadini senza terra nella gerarchia feudale. Molti signori li impiegano come fanteria media affidabile."
FiannaEireann="Confederazione di nobili irlandesi che giurano di proteggere il paese dagli invasori. L'ammissione impone prove bizzarre, come difendersi da dieci lancieri stando interrati fino alla cintola. La fama di combattenti da mischia è ben meritata."
Firegalley="Galea con una catapulta che getta fuoco greco sul nemico. Con il rostro e i soldati a bordo è molto pericolosa, perché il fuoco greco arde anche sull'acqua."
FrenchManAtArms="Fanti francesi armati di mazza, che colpiscono spesso la cavalleria già impegnata e quindi vulnerabile. Le loro armi infliggono danni enormi nel caos della mischia."
Futuwwa="Combattenti fanatici, sorretti dalla fede e pronti a morire, soprattutto contro gli infedeli. Dotati di arco e spada, sono versatili, ma l'audacia eccessiva li espone a forti perdite negli attacchi."
Fyrdmen="Il fyrd è la fanteria comune sassone, contadini liberi chiamati alle armi dal re. Valgono più delle leve contadine e costano meno dei professionisti come gli huscarl."
GaelGaedhil="Guerrieri di sangue norreno e irlandese, eredi della ferocia pagana. Quasi privi di protezione e assetati di gloria, sono truppe d'urto temibili quando vengono scagliate contro il nemico."
Galley="Nave antica e ben collaudata, a remi e a vela, adatta al Mediterraneo. L'equipaggio è composto per lo più da rematori, con pochi arcieri e soldati; dispone di arpioni e di uno sperone per squarciare scafi e remi nemici."
Gallowglass="Guerrieri celtici d'Irlanda armati di spada a due mani, devoti a un capo clan. Veloci e spietati, in battaglia entrano in uno stato di furia simile a quello dei berserker; si racconta che portino via le teste dei nemici come trofei."
Gendarmes="Cavalleria di milizia di buon livello, reclutata nelle città in espansione. Ben equipaggiata e più disciplinata di molti soldati occasionali, ma priva dello slancio dei cavalieri. Le ricche province francesi ne forniscono molti."
GenoeseSailors="Marinai genovesi che, lontano dalle navi, rendono come ottimi tiratori leggeri, molto più di una fanteria raccogliticcia. Rapidi e poco protetti, non sono adatti alla mischia se non come estrema soluzione."
GhaziInfantry="Guerrieri fanatici che affrontano senza timore forze superiori. Difficili da trattenere, all'attacco si abbattono sul nemico con asce devastanti; in difesa possono contrattaccare con imprudenza, indebolendo una buona posizione."
GhulamCavalry="Cavalleria pesante da assalto degli eserciti del deserto, con maglia e lance leggere. Carica bene e regge il confronto con altri cavalieri, ma deve guardarsi dai lancieri; contro i tiratori giova attaccare in fretta."
GoldenHordeHeavyCavalry="Nobiltà mongola a cavallo, con il compito di spezzare le truppe minori d'urto. Armati di lancia, ben protetti da corazza e scudo, rendono al meglio contro la fanteria e contro reparti sul punto di cedere."
GoldenHordeHorseArchers="Arcieri a cavallo per tormentare e tendere imboscate, ideali per la tattica mongola dell'attacco e ritirata. Grazie alla velocità si riuniscono, colpiscono, si ritirano e ripetono senza mai combattere corpo a corpo."
GoldenHordeWarriors="Mongoli appiedati, disciplinati e formidabili, esperti con l'arco composito e la spada. Non sono adatti ad assalire fanteria pesante: conviene spezzarne le file con le frecce e poi finire chi è già in rotta."
GothicFootKnights="Cavalieri a piedi in armatura gotica, fatta di superfici lisce che deviano i colpi nonostante l'aspetto ingombrante. Con spadoni a due mani sfondano molte formazioni difensive, ma la brama di gloria può renderli impetuosi."
GothicKnights="Cavalieri in armatura gotica con cavalli pesantemente bardati. Poco vulnerabili, anche se arcieri e picchieri restano pericoli; rappresentano il culmine della cavalleria pesante e dell'arte dell'armaiolo."
GothicSergeants="Sergenti con armatura un po' datata ma pilastro di ogni esercito. Con le lance si adattano a qualsiasi posto nella linea e, mossi da un nascente spirito professionale, non hanno la smania di gloria dei nobili."
GrandInquisitor="Il suo compito è sradicare eresia e dissenso tra i cattolici. Con lui l'eresia cala molto, lo zelo aumenta e le popolazioni ribelli di norma si piegano, spesso solo per paura."
Gungalley="Galea dotata di cannoni come arma principale, con rostro e soldati per l'abbordaggio. Temibile con vele e remi, ma ha punti ciechi e manovra male da vicino."
Halbardiers="Fanti in armatura a piastre armati di alabarda, arma in grado di abbattere un cavallo o spaccare un uomo. Sono truppe d'assalto adatte a rompere le formazioni nemiche e a penetrare nelle fortificazioni."
HandGun="Armi da fuoco portatili imprecise e inaffidabili, inutili con l'umidità, ma facili da insegnare. Tiratori lenti e a corto raggio, valgono soprattutto per il fragore e il fumo che intimoriscono."
Hashishin="Setta sorta in Persia, specialista di furtività, inganno e omicidio. Sul campo può nascondersi in quasi ogni terreno ed è adatta a sorprendere i generali nemici; quando agisce colpisce con spada e arco."
HighCarskaGarda="Cavalleria pesante della guardia del re o zar di Serbia, divenuta più forte con l'indipendenza. Il suo stile di combattimento si ispira ai cavalieri corazzati occidentali."
HighDidebuls="Nobiltà armena che, a contatto con crociati ed Europa, ha adottato strutture feudali e armi e armature più avanzate. Con piastre, cavalli bardati e lance ottengono una buona carica."
HighNaxarars="Grande nobiltà armena, amministratori e guerrieri paragonabili ai signori feudali europei. A contatto con i crociati hanno adottato l'equipaggiamento della cavalleria occidentale, combattendo come cavalleria pesante."
HighRoyalGhulamKnights="Ghulam, schiavi-soldato scelti, guardia e migliore cavalleria del sultano. Con cotta pesante e lance valgono ogni altra cavalleria pesante; sultano e principi ne guidano un nucleo, e altri reparti costano molto da addestrare."
HighRoyalKnights="Guardia scelta a cavallo del re, in armatura a piastre su cavalli bardati e con la lancia. La dedizione al sovrano li rende pericolosissimi. Re e principi di sangue ne guidano piccoli gruppi; altri si possono arruolare ma a caro prezzo."
HighlandClansman="Ultimi combattenti tribali dell'Europa occidentale, convocati dai capi tra i parenti. Coraggiosi ma ostinati e focosi, sono fanti leggeri di regioni impervie, di solito armati male e privi di corazza."
HighlandWarriors="Nobili e combattenti di professione che scendono in campo a piedi, provenendo da un paese con pochi buoni cavalli. Meno rapidi e esposti alle cariche, ma più compatti in formazione."
Hobilar="Cavalieri su piccoli destrieri, utili come esploratori e inseguitori. Rendono al meglio nel disperdere il nemico o nel prendere prigionieri da riscattare; leggeri, non reggono il paragone con la nobiltà a cavallo."
HorseArchers="Arcieri a cavallo di molti popoli dell'Europa orientale, eccellenti cavalieri e tiratori. Colpiscono da lontano restando fuori portata, ma nel corpo a corpo sono vulnerabili."
HospitallerFootKnights="Cavalieri ospitalieri che si sono adeguati ai nuovi metodi bellici: combattono a piedi come fanteria corazzata d'élite, capace di penetrare tra le linee avversarie. Adattabilità, disciplina e coraggio li mantengono temibili."
Housecarle="Scelti guerrieri nordici dell'epoca in cui i vichinghi tramontano, forti del muro di scudi, formazione compatta di fronte al nemico. Sono vulnerabili soprattutto se rompono le file."
Inquisitor="Il suo compito è estirpare eresia e dissenso dalla comunità cattolica. La sua presenza fa calare l'eresia e la reputazione spietata può spaventare l'intera popolazione."
IrishDartmen="Lanciatori di dardi, giavellotti leggeri antichissimi in Irlanda. Meno letali delle frecce, ma una pioggia di dardi scompagina molti reparti indisciplinati."
IrishHorsemen="Cavalieri irlandesi su cavalli piccoli ma resistenti, utili come esploratori e inseguitori. Con lancia, dardi e protezioni leggere sanno schermagliare, ma non possono competere con la nobiltà a cavallo."
ItalianLightInfantry="Fanteria media italiana, indurita da anni di guerre contro normanni, francesi, imperiali e tra città rivali. Con giubbe imbottite, lance e scudi non ha la grinta dei veterani, ma dà affidamento."
JanissaryBows="Arcieri giannizzeri, truppa nuova turca, disciplinata e devota, reclutata per formare eserciti nazionali e non feudali. Devono scompaginare e indebolire le linee nemiche perché gli altri reparti le finiscano."
JanissaryHeavyInfantry="Élite disciplinata degli eserciti turchi, di fama temibile. Truppa d'urto pesante, corazzata e armata di armi in asta, deve aprire la linea nemica per far passare gli altri reparti."
JanissaryInfantry="Corpo scelto dell'esercito ottomano, formato da giovani cristiani delle province soggette e cresciuto in caserma nell'obbedienza al sultano. Con arco e spada colpisce da lontano e poi chiude in mischia: fanteria professionale, versatile e affidabile."
Jihad="Il jihad è qui una levata popolare di fedeli musulmani in difesa di una provincia contro ogni aggressore. Una volta avviato non si può fermare né richiamare, e le sue forze crescono o calano con le vittorie e il fervore dei territori attraversati."
Jobbagy="Il nome viene da una misura di terra ungherese: nobili e città fornivano questi soldati in proporzione ai propri possedimenti. Sono fanti di leva economici e poco addestrati, simili ai contadini arruolati altrove."
JomsVikings="Le saghe parlano di Jomsborg, fortezza il cui porto accoglieva trecento navi lunghe e sede di una confraternita guerriera chiusa alle donne. I suoi membri, combattenti scelti, godevano di fama superiore perfino ai berserker: fanteria d'élite temibile all'attacco."
Kataphraktoi="Eredi della cavalleria corazzata tardoromana, i catafratti bizantini coprono di ferro sia il cavaliere sia il cavallo. La carica è quasi impossibile da arrestare, ma la mole li rende lenti e il loro mantenimento costa più di quello di altri cavalieri."
Kazanchis="Fanteria principale dei bulgari del Volga, con un'arma in asta che perfora le corazze e una protezione discreta. Rende al meglio accanto alla cavalleria pesante, di cui copre l'azione."
Kern="Nell'Irlanda gaelica le faide tra signori e gli scontri con gli invasori inglesi fecero di tutti dei guerrieri. I kern, fanti leggeri con giavellotti, servono a molestare il nemico e nel corpo a corpo battono con grande ferocia."
KhazarRoyalCavalry="Il khaganato cazaro, di fede ebraica, fonda come gli altri popoli delle steppe la propria forza sulla cavalleria. I suoi cavalieri pesanti hanno armatura più solida dei vicini nomadi e combattono con lancia e spada."
KhwarazmianCavalry="Caso raro nel mondo islamico, i cavalieri del Khwarazm proteggono con la corazza anche il cavallo. Sono molto efficaci nella carica contro avversari leggeri ma poco maneggevoli. Come truppa d'urto reggono il confronto con i cavalieri occidentali e si dimostrano più disciplinati."
Klibanophoroi="Cavalleria pesante disciplinata, tradizionale punta di lancia degli attacchi bizantini, benché dopo la sconfitta di Manzikert i suoi effettivi siano diminuiti. Combatte a fianco dei catafratti e usa mazze, efficaci contro gli elmi di turchi e cavalieri occidentali."
KnightsAviz="L'ordine di Avis è uno dei capitoli militari della penisola iberica, dove il voto di combattere i musulmani era perpetuo e non temporaneo come in Terra Santa. Serve la corona portoghese ed è pronto a difendere il regno o ad ampliarlo con la guerra contro l'Islam."
KnightsHospitaller="L'ordine di San Giovanni nacque per assistere i pellegrini in un ospedale di Gerusalemme e divenne un ordine militare di primo piano. Cavalieri in armatura pesante e lancia, danno cariche devastanti e tengono il campo anche nelle ore dure."
KnightsSantiago="Fondato per proteggere i pellegrini sul cammino spagnolo, l'ordine di Santiago è una confraternita armata quasi monastica. Cavalieri pesanti saldi e affidabili, rompono molte linee alla carica, ma sono meno impulsivi dei nobili laici."
KnightsTemplar="I templari sono la più prestigiosa tra le milizie religiose della Cristianità. Cavalleria pesante di altissimo livello, sono in grado di lanciarsi contro nemici più numerosi e di prevalere. La loro ortodossia, tuttavia, desta sospetti in alcuni ambienti."
KoreanGuardsmen="Fanteria d'assalto al servizio dei mongoli, più lenta dei lancieri comuni ma meglio armata e protetta. Una grande arma in asta le permette di sfondare gli schieramenti avversari."
KoreanSkirmishers="Fanti pesantemente protetti, dotati di scudo, spada e giavellotti. Non brillano nello scontro prolungato: il loro compito è lanciare una salva di giavellotti sul nemico e poi completare l'opera con la spada."
KoreanSpearmen="Lancieri di leva dell'esercito coreano, utili soprattutto contro la cavalleria. Meno addestrati delle truppe scelte, di solito assolvono comunque il loro compito."
Kursybays="Lancieri ben equipaggiati, arruolati di frequente dai bulgari del Volga. Sono meno induriti dei kazanchi, ma mantengono saldamente la posizione in linea."
Lancers="Cavalleria molto pesante, concepita per l'urto: l'armatura a piastre, ricca di pezzi aggiuntivi, protegge il cavaliere nello scontro. La carica è potente, ma se si riesce ad aggirare il reparto e colpirlo ai fianchi o alle spalle diventa vulnerabile."
LateRoyalGhulamKnights="I ghulam sono soldati-schiavi di alto rango; questi formano la guardia personale del sultano. In armatura a piastre e con la lancia superano gran parte della cavalleria pesante. Alcuni reparti sono guidati dal sovrano e dai principi; reclutarne altri costa moltissimo."
LateRoyalKnights="Guardia della casa reale, questi cavalieri hanno armatura a piastre integrale e lancia, e il legame con il sovrano ne accresce la combattività. Il re e i principi del sangue ne comandano alcune unità, mentre ingaggiarne altre è possibile ma costoso."
LatinAuxillaries="Dopo le crociate molti occidentali rimasero in Oriente e passarono al servizio di bizantini e armeni, soprattutto dopo la quarta crociata e la nascita dell'Impero latino. Combattono a piedi come ausiliari e sono in grado di battere in campo aperto buona parte delle fanterie musulmane."
LithuanianCavalry="Cavalleria leggera tratta dalla piccola nobiltà lituana, con giaco leggero, lancia e arco. Cavalca bene e all'occorrenza smonta per sparare a piedi. Non regge il confronto con i veri cavalieri."
LithuanianInfantry="Guerrieri duri e coraggiosi, al servizio dei sovrani lituani prima pagani e poi cristiani. Si muovono con sicurezza tanto in campo aperto quanto nelle fitte foreste bielorusse e rendono difficile ogni ambizione baltica di scandinavi e russi."
LithuanianTurcopole="Le tribù baltiche non eguagliano i nomadi turchi, ma sono buoni cavalieri. L'ordine teutonico ne apprezzò l'utilità: nei suoi eserciti stanno sotto i frati cavalieri e sopra gli ausiliari a piedi."
Longboat="Lo scafo lungo e stretto dei vichinghi è frutto di generazioni di perfezionamenti: regge le traversate oceaniche, si tira facilmente a riva e porta grandi carichi. In combattimento serve solo per l'abbordaggio."
Longbows="Gli arcieri inglesi col grande arco sono i migliori del continente: scagliano nugoli di frecce fino a trecento metri e le punte da guerra mettono in pericolo anche i cavalieri. Rendono soprattutto se il nemico è obbligato ad avanzare contro di loro."
MamlukCavalry="Schiavi addestrati fin da ragazzi alla guerra, i mamelucchi formano una cavalleria media ben armata, disciplinata e dotata di asce, ottime contro le armature. Adatta a molti compiti, può sorprendere anche la cavalleria pesante."
MamlukHandgun="Grazie al progresso della scienza islamica i mamelucchi producono polvere da sparo e armi migliori di quelle cristiane, e i loro archibugieri sono più disciplinati. Restano però frenati dalla lenta cadenza di tiro e dalla scarsa precisione delle armi."
MamlukHorseArchers="Élite di soldati-schiavi, gli arcieri a cavallo mamelucchi uniscono disciplina, tiro preciso e grande abilità equestre per travolgere avversari più lenti. Si difendono in mischia, ma non è consigliabile lanciarli avventatamente nel corpo a corpo."
MangonelCrew="Il mangano è una piccola catapulta di origine antica: un braccio azionato da corde o tendini attorcigliati lancia proiettili leggeri a breve distanza. Privo di ruote, una volta montato resta dov'è, e verrà soppiantato dalle armi da fuoco."
MediumCavalry="È in sostanza un fante messo in sella: dà mobilità all'esercito e serve a inseguire il nemico in fuga. Raramente decide da solo la battaglia, ma al momento giusto e nel punto giusto può cambiarne l'esito."
MilitiaSergeants="Milizia cittadina reclutata tra gli apprendisti dei centri in espansione, armata di forti armi in asta. Fa buona figura contro truppe di scarso valore, ma l'addestramento è irregolare e davanti a soldati professionisti cede."
MortarCrew="Il mortaio è un pezzo a canna corta che spara in traiettoria alta, facendo cadere i proiettili oltre le mura. Il suo impiego è delicato: inclinazione, carica di polvere e vento influiscono sulla precisione. Negli assedi è devastante."
MountedCrossbows="Balestrieri a cavallo con balestre più corte di quelle da fante: una risposta occidentale agli arcieri a cavallo orientali. Le armi sono letali ma lente da ricaricare, per cui occorre sfruttare la mobilità per non essere raggiunti."
MountedSergeants="Cavalleria più leggera dei cavalieri ma rapida, con lance pesanti che rendono efficace la carica. Va lanciata sul fianco o alle spalle del nemico per ottenere il massimo effetto e poi ritirata sfruttando la velocità."
Mullah="Il mullah è un dotto della religione islamica: in una provincia rafforza sensibilmente la fede dei musulmani."
MurabitinHorsemen="Gli almoravidi, popolo berbero e arabo del Nordafrica, sono noti per l'austera osservanza religiosa. Il fervore ne fa una cavalleria leggera preziosa, il braccio rapido degli eserciti almohadi."
MurabitinInfantry="Fanti tenaci reclutati nelle province aride dell'impero almohade, lungo la costa nordafricana. Con i giavellotti molestano le formazioni nemiche e causano perdite sorprendenti; il resto dell'equipaggiamento serve solo a difendersi, quindi vanno usati come schermagliatori."
MuslimPeasants="Contadini musulmani, all'ultimo gradino della società: legati ai campi o accalcati ai margini delle città. In guerra vengono arruolati a forza e hanno pochi motivi di fedeltà verso chi li manda a combattere."
MuwahidFoot="Lancieri al servizio degli almohadi, con equipaggiamento leggero per reggere la linea. Uomini resistenti del deserto, protetti per lo più da grandi scudi, sono rapidi e forse troppo sicuri di sé. Come ogni lanciere, sono efficaci contro i cavalli."
NapthaThrowers="La nafta è una miscela incendiaria che brucia ostinatamente. Racchiusa in granate di terracotta che si frantumano all'impatto, è pericolosa anche per chi la usa: può capitare che il lanciatore incendi sé stesso."
NegroSpearmen="Il nome dei lancieri nubiani è impreciso: provengono da tutta l'Africa e sono stati portati verso nord al servizio del sultano. Hanno gli stessi mezzi degli altri lancieri, ma sono in genere più abili e disciplinati."
Nizari="Seguaci di una setta ismailita, i nizariti combattono con spada e arco e sono spinti dalla fede: un reparto flessibile per ogni comandante musulmano. Il fanatismo li rende irruenti, tanto da ignorare gli svantaggi della situazione."
NormanFootKnights="I nobili normanni, pur eccellenti cavalieri, talvolta preferiscono combattere a piedi. Equipaggiati come gli altri nobili feudali, con spada e scudo a mandorla, sono validi ma vulnerabili alle cariche della cavalleria."
NormanKnights="Potenza militare di primo piano nell'alto Medioevo, il normanno fondeva l'aggressività scandinava con l'equitazione e le armi dei franchi. Dopo le conquiste di Inghilterra e Sicilia, la sua cavalleria pesante divenne il modello della guerra cavalleresca."
OrderFootsoldiers="Gli ordini militari riservano il rango di cavaliere ai nobili; gli uomini di condizione inferiore combattono come fanti di appoggio, spesso con ottimi risultati, spinti dalla speranza di salvezza e di avanzamento. Hanno buona corazza e lancia."
OrganCrew="Prende il nome dalle numerose canne affiancate su un affusto di legno, come quelle di un organo da chiesa. Sparano salve micidiali, ma la cadenza è lenta e lo spostamento difficile, come per tutta l'artiglieria."
OrthodoxBishop="Il vescovo ortodosso rinsalda la fede degli ortodossi nella provincia dove risiede. Non ha effetto su cattolici né su fedeli di altre religioni."
OttomanInfantry="Fanteria ben armata e corazzata, abbastanza solida da reggere la prima linea di un esercito turco. Porta archi e asce, che servono contro i nemici corazzati, e in addestramento e disciplina supera in genere le fanterie avversarie."
OttomanSipahi="I sipahi turchi si distinguono da molti cavalieri europei per l'obbedienza agli ordini. Professionisti, con equipaggiamento pari a quello di qualsiasi cavalleria pesante, temono sul campo soprattutto lance e picche."
PaviseArbalester="La balestra pesante lancia un dardo che penetra quasi ogni armatura, ma si carica con un argano e spara molto lentamente. Mentre ricarica il balestriere si nasconde dietro il pavese, uno scudo alto quanto lui."
PaviseCrossbows="La balestra si impara in poche settimane, ma ha limiti: cadenza lenta e tiratore scoperto durante la ricarica, salvo riparo dietro il pavese, un grande scudo da posare a terra. I balestrieri italiani sono tra i più stimati."
Peasants="Contadini, il livello più basso della società. Con la leva vengono sottratti ai campi e mandati a combattere con armi misere per i loro signori. Sono poco affidabili, ma costano pochissimo."
PictishCavalry="I cavalieri pitti hanno la tempra dei popoli di collina e di montagna: uniscono ferocia e velocità, e sono ottimi per razzie e schermaglie."
PictishCrossbows="Spesso considerati arretrati dagli stranieri, i pitti hanno compreso presto i vantaggi della balestra, che per portata, potenza e semplicità d'uso ha dato loro la meglio su eserciti di nazioni più evolute."
PictishMountedCrossbows="Cavalleria leggera e rapida dotata della balestra pitta, che a distanza colpisce con forza anche se lentamente. È più flessibile di molta cavalleria leggera e un rinforzo utile per ogni esercito pitto."
Pikemen="La picca è una lunga asta, e chi la usa deve addestrarsi a muoversi in blocco. A differenza di altre truppe, i picchieri combattono con le prime quattro file, offrendo a chi li carica un muro di punte."
PolishRetainer="Piccola nobiltà polacca che forma una buona cavalleria media, con maglia e lance pesanti che rafforzano la carica. Attacca bene, ma non pareggia i cavalieri e fatica a resistere contro avversari così forti."
Priest="Con la sola presenza, il sacerdote rinsalda la fede degli ortodossi nella provincia dove si trova. Chi professa altre religioni non ne trae vantaggio."
Princess="La principessa è una risorsa dinastica che può fungere da emissaria. Può sposare un generale per garantirne la fedeltà oppure entrare in un'altra casa reale per suggellare un'alleanza, ma lo sposo potrebbe poi avanzare pretese sui domini del suocero."
PronoiaiAllagion="Le casse bizantine hanno un limite, perciò questi mercenari sono compensati con terre invece che con denaro. Metà soldati e metà signori locali, equivalgono ai cavalieri pesanti bizantini: maglia, lancia e cavallo bardato li rendono pari a molti cavalieri occidentali."
ReligiousFanatics="La gente comune segue volentieri chi promette il Paradiso. Per molti la vita è fatica e miseria, e morire in battaglia con fede cieca appare una via verso la salvezza: così nascono i fanatici."
RoundShieldSpearmen="I lancieri servono in quasi ogni esercito, specie contro la cavalleria, e con le loro lance combattono in due file. Non resistono a lungo contro soldati di professione, ma finché mantengono la formazione sanno sorprendere i cavalieri."
RusSpearmen="Guerrieri esperti della Rus', a loro agio in battaglia e ben corazzati. Reggono assalti che metterebbero in fuga reparti di minor valore."
SaharanCavalry="Nel deserto la rapidità protegge più di un'armatura, che sotto il sole sarebbe un forno. I cavalieri sahariani sono schermagliatori veloci, adatti a coprire i fianchi, tenere lontani gli arcieri e inseguire. Con spada e scudo non reggono una mischia prolungata."
SantiagoFootKnights="Cavalieri al servizio di Castiglia nella lunga guerra contro i musulmani. Forti in sella ai solidi cavalli spagnoli, quando la carica non è praticabile sanno battersi anche a piedi tra la fanteria."
SaracenInfantry="Lancieri medi, più disciplinati dei crociati franchi. La lancia dà loro un vantaggio sulla cavalleria, e l'armatura leggera li rende rapidi sotto il sole del deserto; tengono bene anche contro fanterie simili."
SaxonHuscarles="Gli huscarl formano il seguito armato di un re o di un nobile: guardia e corte in tempo di pace, nucleo professionale dell'esercito in guerra. Il fyrd è la leva comune anglosassone; loro ne sono l'élite."
ScottishCavalry="La Scozia non è nota per la cavalleria, e gli stessi scozzesi preferiscono battersi a piedi. Questi cavalieri leggeri delle pianure danno però all'esercito maggiore mobilità, in particolare contro gli arcieri inglesi."
ScottishLancers="Cavalleria non tra le migliori, ma abbastanza aggressiva da impensierire il nemico. Questi lancieri puntano sulla velocità e sull'urto della carica, con risultati migliori contro la fanteria leggera."
ScottishSpearmen="Robusti uomini delle pianure, forniscono all'esercito del re la solidità difensiva che i montanari, selvaggi e testardi, non danno. Affidabili contro la maggior parte della fanteria media, reggono anche molte cariche di cavalleria pesante."
SerbianCavalry="Nelle colline serbe il denaro scarseggia e le guerre abbondano, perciò questa cavalleria è più leggera di altre: preferisce il tiro d'arco alla carica con la lancia e, se incalzata, si ritira nelle fortezze di montagna."
SerpentineCrew="La serpentina è un cannone leggero e lunghissimo, da cui il nome. Lancia una palla da circa un chilo; è trasportabile, abbastanza precisa e ha buona gittata. Un solo colpo può abbattere più uomini."
Monk="Monaco del Dharma: con la sua presenza rinsalda la fede nella provincia dove si trova e converte a poco a poco chi segue altre religioni. Viaggia con le carovane e con le navi dei mercanti, ed è accolto con rispetto alle corti di tutta l'Asia."
Shaman="Con la sola presenza, lo sciamano rinsalda la fede dei pagani nella provincia dove si trova. Chi professa altre religioni non ne trae beneficio."
SherwoodForesters="Chi vive nelle foreste reali si fa un'abilità d'arco cacciando di frodo la selvaggina del sovrano e imparando a muoversi tra gli alberi. In guerra sono arcieri preziosi, abili a nascondersi e superiori a quasi tutti gli altri."
ShieldedBowmen="Secoli di guerre hanno reso fieri e durissimi i popoli balcanici. Questa fanteria leggera, di solito al seguito dello zar serbo, si batte meglio della media degli arcieri sia da lontano sia da vicino."
SiegecannonCrew="Il cannone d'assedio è un simbolo di prestigio che ogni sovrano vuole avere. Con fonditori più esperti e polvere migliore, l'artiglieria smette di essere affare di fortuna e i grossi pezzi non scoppiano più uccidendo i serventi."
SipahiofthePorte="Guardia scelta dei sultani turchi, con maglia, cavalli bardati, spada e arco. Sono avversari temibili soprattutto per l'addestramento severo. Il sultano e i principi ne guidano piccoli reparti, mentre arruolarne altri costa molto."
SlavJavelinmen="Fanteria leggera reclutata a forza da molti signori. Versatile: bersaglia il nemico di giavellotti da breve distanza e poi si batte in schermaglia ravvicinata."
SlavWarriors="Fanteria leggera economica, spesso arruolata a forza dai signori slavi, armata di corte lance."
SpanishJavelinmen="La Spagna è famosa fin dall'antichità per i suoi lanciatori di giavellotto. Con giavellotti e spade formano una buona fanteria leggera e sono schermagliatori eccellenti."
SpanishJinetes="Eredi dei cavalieri mori, i jinetes sono cavalleria leggera rapida e agile. Al posto della lancia usano giavellotti da lanciare prima di passare alla spada, e questo doppio uso li rende utili in qualsiasi esercito spagnolo."
Spearmen="I lancieri servono in quasi ogni esercito, specie contro la cavalleria, e con le loro lance combattono in due file. Non resistono a lungo contro soldati di professione, ma finché mantengono la formazione sanno sorprendere i cavalieri."
Spy="La spia raccoglie informazioni sui rivali e vede tutto ciò che accade nella provincia o nell'esercito in cui si trova. Può smascherare vizi di un personaggio, creare false prove di tradimento e fomentare malcontento."
SteppeCavalry="I popoli delle steppe imparano a stare in sella da bambini, perché la caccia e la guerra lo richiedono. Sono cavalieri leggeri eccezionali e padroni di molte armi, e danno il meglio nel disturbo e nell'inseguimento."
SteppeHeavyCavalry="La cavalleria pesante delle steppe è potente e versatile: con l'arco corto tira da cavallo con grande efficacia e in mischia usa la spada con effetti micidiali."
SwabianSwordsmen="Gli svevi della Germania sud-occidentale sono considerati dagli altri tedeschi quasi un popolo a sé. Con maglia e grandi spade a due mani formano una fanteria pesante potente, fatta per attaccare."
SwissArmouredPikemen="Picchieri svizzeri con armatura, molto efficaci contro la cavalleria: combattono con quattro file e nessun cavallo si lancia contro un muro di picche. Apprezzati per la professionalità, in formazione compatta sono però un bersaglio facile per i tiratori."
SwissHalbardiers="Alabardieri svizzeri addestrati e disciplinati, frutto della cura che la Confederazione dedica alla propria difesa. Pur con armatura leggera, le alabarde colpiscono duramente anche nemici corazzati, a differenza delle lance, buone solo contro la cavalleria."
SwissPikemen="La picca supera i quattro metri e richiede addestramento: i picchieri svizzeri sono tra i migliori d'Europa. Combattono su quattro file e nessun cavallo affronta quel muro di punte, perciò sono ottimi contro la cavalleria."
Szekely="Cavalleria leggera dei confini della steppa, composta da esploratori e schermagliatori mobili e abili. Troppo leggeri per lo scontro frontale, sono predoni ideali per disordinare il nemico prima dell'intervento delle truppe più pesanti."
TemplarFootKnights="I templari, noti per la pietà e per le cariche irresistibili, quando smontano lo fanno volentieri per affrontare il nemico a viso aperto, convinti di portare su di lui il giudizio divino."
TeutonicFootKnights="L'ordine teutonico si è adattato ai metodi nuovi: invece di combattere in sella schiera una fanteria corazzata d'élite, capace di aprirsi un varco tra le file avversarie. Disciplina, coraggio e versatilità lo mantengono temibile."
TeutonicKnights="Ordine di cavalieri tedeschi votato alla lotta contro eretici, infedeli e pagani. In battaglia sono all'altezza degli altri ordini, pur con minore disciplina, e chi li affronta ha poco da rallegrarsi."
TeutonicSergeants="I sergenti teutonici, di rango inferiore perché gli ordini militari non accettano uomini di umili origini, hanno addestramento da cavalleria pesante ma non l'impeto dei cavalieri veri; sul campo si avvicinano molto alla loro efficacia."
TrebizondArchers="Gli archi compositi offrono a questi soldati gittata, precisione e penetrazione superiori. Gli arcieri di Trebisonda sono addestrati e disciplinati e possono fungere da fanteria leggera, ma sarebbe imprudente mandarli contro nemici ancora compatti."
TrebuchetCrew="Il trabucco è un'arma gigantesca, spesso costruita sul posto: un contrappeso aziona il braccio e scaglia proiettili a distanze eccezionali, come massi, vasi incendiari e, per demoralizzare, animali morti, prigionieri o cadaveri."
TurcomanFoot="I turcomanni dell'Asia centrale e della Persia nord-orientale conoscono bene la guerra nel deserto. Sono soprattutto arcieri e all'occorrenza fanteria leggera. Servono a indebolire il nemico prima dell'attacco di altri reparti; in mischia sanno solo difendersi."
TurcomanHorse="Cavalleria leggera e veloce, adatta al deserto: armatura leggera, arco e spada. Logora i reparti col tiro prima di caricare, e contro i crociati franchi resta di solito fuori portata mentre li consuma."
Turcopole="Dopo gli scontri con la cavalleria saracena i crociati compresero che i soli cavalieri non bastavano in Oriente e presero al soldo guerrieri del posto. I turcopoli, leggeri e armati di arco e lancia, sono molto versatili."
Ulama="L'imam è un dotto che ha consacrato la vita allo studio della fede islamica. In una provincia ispira i musulmani e ne accresce lo zelo."
UrbanMilitia="Con la crescita di città e commerci cresce la necessità di difese locali, e alcuni centri reclutano truppe proprie tra apprendisti e garzoni. Addestrati poco, usano armi in asta efficaci contro i corazzati e sono più disciplinati dei contadini."
VarangianGuard="Guardia imperiale bizantina composta da mercenari nordici, leali e ingegnosi. Nei secoli vi servirono vichinghi, compreso un re, sassoni e inglesi. Nel periodo tardo è spesso più un reparto di rappresentanza che di combattimento."
VarangianSwordsmen="Reclutati tra russi e scandinavi, gli spadaccini variaghi formano una fanteria pesante d'élite, nota come guardia variaga quando passano al soldo dei bizantini, che ne pagano volentieri la perizia."
VikingHuscarles="Guerrieri di professione al seguito di uno jarl, guardia e corte in pace e compagni di battaglia in guerra. Sono fanteria superiore, più efficace e più costosa dei karl, chiamati alle armi solo quando serve."
VikingKarls="La maggior parte degli scandinavi sono karl, contadini e pescatori liberi. Formano la truppa ordinaria degli eserciti vichinghi e gli equipaggi delle navi drago, e valgono molto più delle leve contadine di altri paesi."
VikingLandsmenn="Uomini liberi della società scandinava, contadini o proprietari, che lo jarl convoca nelle crisi per servire con le armi e costruire difese."
VikingRaiderCavalry="I cavalli scandinavi sono piccoli e i vichinghi non sono famosi per la cavalleria, ma questi razziatori garantiscono comunque un minimo di mobilità all'esercito."
VikingThralls="I thrall sono la classe più bassa della società vichinga, poco più che schiavi. Vengono mandati in battaglia come gli uomini liberi, ma sono poco abili e poco motivati, e non vanno incaricati di compiti decisivi."
VlastelaHeavyCavalry="Dopo aver assoldato cavalieri tedeschi, lo zar ne riconobbe il valore e iniziò a formare in Serbia reparti analoghi. Con armatura a piastre, cavalli bardati e lance sono formidabili."
Voi="Leve tribali degli eserciti di Novgorod, impiegate come schermagliatori. Con scudo piccolo, spada e protezione leggera sono rapidi e adattabili, ma privi della tempra delle truppe di mestiere."
VoynukBlades="Fanti affidabili con armi in asta e compiti difensivi: spesso marciano in testa all'esercito dello zar o riparano dalla cavalleria nemica i reparti più fragili."
VoynukSwordsmen="Si dice che gli slavi dei Balcani siano imponenti, più alti di molti occidentali, e dallo sguardo acuto. Questi fanti ne sono degni: pur senza equipaggiamento moderno, battono bene quanto molti armigeri occidentali."
WallachianMercenaryCavalry="Ottimi cavalieri mercenari, i valacchi sono spesso ingaggiati come cavalleria leggera per scaramucce, imboscate e per coprire rapidamente i fianchi della cavalleria più pesante."
Wargalley="Grande nave a remi e vela con più catapulte per vasi di fuoco greco e un rostro per speronare. Imponente ma poco maneggevole, in mare è più forte che agile."
WelshBandits="Il terreno aspro del Galles favorisce la guerra irregolare, come hanno imparato gli invasori fin dai romani. Con arco e spada e grande pratica di imboscate, i banditi gallesi sono avversari pericolosi e adattabili."
WelshLongbows="Gli arcieri gallesi con grande arco sono tra i migliori d'Europa: sotto i loro tiri, fino a trecento metri, piovono nugoli di frecce, e le punte da guerra minacciano anche i cavalieri. Danno il meglio quando è il nemico a dover attaccare."
Woodsman="Robusti boscaioli, migliori delle leve contadine, che abitano le regioni coperte da fitte foreste. Con le asce infliggono danni gravi anche a truppe più forti, e la protezione leggera li aiuta un poco. Restano però contadini e possono fuggire come tali."
XLCatapultCrew="La catapulta a nafta risale all'età romana: un braccio mosso da corde o tendini attorcigliati lancia proiettili incendiari a buona distanza e piccole ruote assorbono il rinculo. Semplice ed efficace, ma destinata a essere superata dai cannoni."
XLHospitallerFootKnights="Anche senza cavallo gli ospitalieri sono guerrieri temuti dai nemici della Chiesa e dell'ordine. Spada e scudo ne fanno una truppa utile in attacco e in difesa dove i cavalli servono poco, come su terreno accidentato o contro fitte masse di lancieri."
XLKnightsHospitaller="L'ordine di San Giovanni nacque per assistere i pellegrini in un ospedale di Gerusalemme e divenne un ordine militare di primo piano. Cavalieri in armatura pesante e lancia, danno cariche devastanti e tengono il campo anche nelle ore dure."
XLKnightsTemplar="I templari sono la più prestigiosa tra le milizie religiose della Cristianità. Cavalleria pesante di altissimo livello, sono in grado di lanciarsi contro nemici più numerosi e di prevalere. La loro ortodossia, tuttavia, desta sospetti in alcuni ambienti."
XLOrderFootsoldiers="Gli ordini militari riservano il rango di cavaliere ai nobili; gli uomini di condizione inferiore combattono come fanti di appoggio, spesso con ottimi risultati, spinti dalla speranza di salvezza e di avanzamento. Hanno buona corazza e lancia."
XLTeutonicKnights="Ordine di cavalieri tedeschi votato alla lotta contro eretici, infedeli e pagani. In battaglia sono all'altezza degli altri ordini, pur con minore disciplina, e chi li affronta ha poco da rallegrarsi."
XLTeutonicSergeants="I sergenti teutonici, di rango inferiore perché gli ordini militari non accettano uomini di umili origini, hanno addestramento da cavalleria pesante ma non l'impeto dei cavalieri veri; sul campo si avvicinano molto alla loro efficacia."
