[eventi_testi]
0="Al concilio di Clermont il pontefice ha rivolto ai fedeli un'infuocata esortazione: liberare Gerusalemme e difendere la cristianità. Dalla folla si è levato il grido «Dio lo vuole», e moltissimi hanno giurato subito di prendere la croce."
1="Per ordine di Guglielmo il Conquistatore, commissari reali hanno percorso ogni contea d'Inghilterra censendo terre, bestiame, mulini e abitanti. Il grande registro è ora completo: la corona sa con precisione quanto rende il regno e può tassarlo di conseguenza."
2="Una scheggia della Vera Croce è arrivata a Parigi ed è stata collocata con grandi onori nella cattedrale. I pellegrini affluiscono da ogni parte e la devozione cattolica si rafforza in tutta la Francia."
3="Gli Assassini, setta ismailita guidata dal Vecchio della Montagna, colpiscono per conto di chi li ingaggia. Si dice che, drogati con l'hashish e convinti di essere già alle porte del paradiso, affrontino la morte senza esitare. I sovrani possono servirsi dei loro pugnali per scopi tutt'altro che spirituali."
4="Predicata da Pietro l'Eremita e dal cavaliere Gualtiero Senza Averi, una folla disordinata di contadini si mette in cammino verso la Terra Santa, sicura dell'aiuto divino. Le campagne francesi restano senza braccia e il reddito agricolo del paese scende del 10%."
5="L'ideale del cavaliere prescrive valore, lealtà, protezione dei deboli e rispetto verso ogni avversario. Di rado viene praticato fino in fondo, ma l'insistenza sulle virtù cristiane giova alla diffusione della fede cattolica."
6="Abu Hamid al-Ghazali, giurista, teologo e filosofo, diffida di Aristotele e dei razionalisti e riporta la fede islamica sul terreno dell'esperienza mistica. Il suo insegnamento, di grande fascino, rafforza l'Islam tra le popolazioni turche."
7="Ritiratasi in convento dopo il fallimento della sua congiura, Anna Comnena scrive la storia del regno del padre Alessio I. L'opera esalta la dinastia e l'Impero e procura +1 influenza all'imperatore bizantino."
8="Matematico, astronomo e poeta persiano, Omar Khayyam affida alle sue quartine un'amara meditazione sul destino e sulla brevità della vita. Il prestigio dello scienziato smorza il fervore religioso nelle province turche, mentre i governatori imparano da lui la lucidità: +1 acume."
9="Goffredo di Monmouth mette per iscritto la leggenda di re Artù e dei cavalieri della Tavola Rotonda, e il libro riscuote un successo enorme. La corona inglese ne trae lustro (+1 influenza), ma i lettori si appassionano più ai racconti che alle prediche: zelo -10% nelle province inglesi."
10="Thomas Becket, arcivescovo di Canterbury, cade sotto i colpi di uomini del re. L'omicidio è vissuto come un sacrilegio: l'influenza del sovrano ne esce indebolita e la Chiesa cattolica si rafforza in tutte le province inglesi."
11="L'abate cistercense Bernardo di Chiaravalle predica la crociata contro i musulmani. La sua oratoria e il suo culto per la Vergine conquistano molti, sovrano compreso, e ravvivano la devozione in Champagne."
12="Il prete Bogomil raccoglie seguaci con una dottrina dualista: la materia sarebbe opera del male, solo lo spirito sarebbe buono. I bogomili respingono il matrimonio, i sacramenti e l'autorità ecclesiastica, e si diffondono in Bulgaria e in Valacchia."
13="Le spoglie di sant'Eustachio, rimaste intatte nei secoli, vengono ora custodite in un reliquiario gemmato. Pellegrini da tutta l'Italia settentrionale accorrono a venerarle e lo zelo della regione aumenta."
14="I conti di Champagne proteggono da generazioni i mercanti che attraversano le loro terre, e le fiere della regione diventano uno dei massimi mercati d'Europa. Questa politica lungimirante dà al governatore di Champagne +3 acume."
15="Il filosofo e medico andaluso Averroè commenta con rigore le opere di Aristotele e difende il ruolo della ragione; i suoi scritti sono letti da musulmani e cristiani. Il suo influsso riduce lo zelo sia nella Spagna cristiana sia in quella islamica."
16="Chrétien de Troyes dedica poemi ricchi di particolari ad Artù, Lancillotto, Ginevra e alla Tavola Rotonda. Le sue storie d'amore cortese incantano il pubblico e lo distolgono dalle letture devote: zelo -10% in tutta la Francia."
17="La badessa Ildegarda di Bingen, guaritrice e autrice di trattati di medicina, è anche una visionaria: vescovi e perfino il papa approvano la trascrizione delle sue visioni. Rafforza la Chiesa cattolica in Germania e porta +1 salute nella regione."
18="Il Nord è ormai cristiano, ma i vecchi culti sopravvivono nelle foreste più fitte. L'impegno di Erik a favore della Chiesa è senza precedenti e consolida il cattolicesimo in tutta la Scandinavia."
19="Enrico II fa approvare sedici articoli che riducono l'autonomia del clero inglese e il peso del papa nelle questioni del regno. Per il sovrano l'influenza sale di 1 e la pietà scende di 1."
20="Teodoro Prodromo scrive versi eleganti per la corte di Bisanzio, un romanzo in versi e perfino satire in greco popolare. Avere un letterato simile dà prestigio al trono: +1 influenza, ma lo zelo cala del 10%."
21="L'ago magnetico indica il nord anche con cielo coperto o di notte. I marinai non sono più costretti a seguire la costa: su navi più grandi possono affrontare il mare aperto."
22="L'eresia catara non può più essere ignorata. Questi dualisti rifiutano la Chiesa e i suoi sacramenti, disprezzano la croce e negano che Dio abbia creato il mondo, e molti semplici li ascoltano. Il movimento attecchisce in Baviera e Franconia, a Milano e Genova, in Provenza e attorno a Tolosa."
23="Goffredo di Strasburgo compone una nuova versione dell'infelice amore di Tristano e Isotta, e il pubblico ne è rapito a scapito delle pratiche devote. Lo zelo cala del 10% in Franconia e nelle province vicine."
24="Domenico e i suoi frati predicano contro l'eresia e si guadagnano il soprannome di «Domini canes», cani del Signore, con allusione al nome dell'ordine. Il loro fervore rinvigorisce la Chiesa: in ogni provincia spagnola lo zelo sale di almeno il 10% e arrivano nuovi convertiti."
25="Gli albigesi, ramo del catarismo, vanno oltre i loro maestri: rifiutano il clero e ogni forma di sacralità. Cambiano nome, ma restano eretici. Il loro seguito aumenta in Aquitania e in Provenza, attorno a Tolosa e a Genova."
26="Si diffonde la notizia che la Vera Croce è stata rinvenuta e affidata alla Chiesa di Castiglia. Pellegrini devoti arrivano da tutta la penisola e la fede cattolica si fa più fervida nell'intera Spagna."
27="Francesco d'Assisi predica la povertà e una vita semplice, e il papa approva la sua regola. Il nuovo ordine dei francescani conquista fedeli con l'esempio. Zelo e conversioni salgono a Genova, Napoli e Roma, in Toscana e nello Stato Pontificio."
28="Il Canto dei Nibelunghi, grande poema della tradizione germanica, diventa un patrimonio comune dei tedeschi e li aiuta a sentirsi un solo popolo. Ispira i comandanti del Sacro Romano Impero: +1 lealtà."
29="Niceta Coniata, erede ideale di Anna Comnena, scrive storie in cui non sempre l'Impero e la Chiesa ortodossa fanno bella figura, ma l'imperatore in carica ne esce valorizzato: +1 influenza e zelo -10% in tutte le province ortodosse."
30="Migliaia di ragazzi partono per la Terra Santa convinti che l'innocenza basti a vincere. L'impresa finisce in tragedia: molti vengono ingannati e, pare, venduti come schiavi dopo l'imbarco a Venezia. Le entrate agricole di Francia e Impero diminuiscono, mentre le famiglie in lutto si staccano dalla Chiesa e scivolano nell'eresia."
31="I baroni inglesi costringono il re a riconoscere limiti al suo potere verso di loro e verso i sudditi. Il re perde 1 di influenza, ma la nobiltà si lega alla corona: +3 lealtà per tutti i generali inglesi."
32="Il domenicano Alberto Magno studia Aristotele e i pensatori arabi e li commenta in opere molto lette. Onora insieme la Chiesa e la ragione: zelo -10% in Germania, ma la Chiesa cattolica acquista nuovi fedeli."
33="Ruggero Bacone, studioso di Aristotele e della scienza araba, compone la vasta enciclopedia dell'Opus Maius e trasmette agli allievi il gusto della ricerca, benché certe sue idee sappiano di magia. Il re inglese guadagna +1 influenza, ma lo zelo cala del 10% nelle province inglesi."
34="Il francescano Bonaventura, dotto quanto Tommaso d'Aquino e familiare di re e papi, è ammirato per la sua santità. Con gli scritti e con l'esempio infiamma il gregge dell'Italia settentrionale."
35="Ibn Rushd, noto in Occidente come Averroè, serve come giudice e medico presso gli Almohadi, e i suoi commenti ad Aristotele sono apprezzati dai dotti di entrambi i mondi. L'ammirazione per il suo razionalismo riduce lo zelo del 10% in tutta la Spagna almohade."
36="Nel duomo di Milano giunge una reliquia eccezionale: un teschio ritenuto di san Giovanni Battista da ragazzo. Il prodigio attira fedeli da ogni parte e il fervore cattolico aumenta in tutto il Nord Italia."
37="Gli alchimisti ottengono una miscela esplosiva, la polvere da sparo. Puzza di zolfo, fa un fracasso infernale e c'è chi la giudica indegna dei cavalieri, ma presto comparirà sui campi di battaglia."
38="Il domenicano Tommaso d'Aquino, tra i maggiori teologi del suo tempo, resta fedele ai voti nonostante le tentazioni orchestrate dai familiari. La sua dottrina ispira zelo e accresce i fedeli in Italia."
39="Anche se il prestito a interesse è visto come un peccato, famiglie facoltose cominciano a finanziare i mercanti, custodirne i capitali e trasferirli fra filiali in province diverse. È una svolta per il commercio."
40="Per secoli le giornate sono state divise in ore di durata variabile secondo la stagione. Gli orologi meccanici scandiscono ore uguali e regolari, e lavoro e scambi si adeguano al nuovo ritmo, con più produttività."
41="I nobili aragonesi costringono il sovrano a riconoscere privilegi che ne limitano il potere: la sua influenza diminuisce. Ma la nobiltà apprezza il nuovo equilibrio e tutti i generali spagnoli guadagnano +2 lealtà."
42="Il teologo scolastico Giovanni Duns Scoto cerca di conciliare Aristotele con la dottrina cristiana. I suoi ragionamenti sono troppo sottili per il popolo, e si registra un calo di zelo in Galles, Mercia, Northumbria e Scozia."
43="Minacciati dai vicini e travolti dai conflitti dell'Impero, i cantoni di Uri, Svitto e Untervaldo stringono un patto di difesa reciproca. Un inizio modesto, ma la futura Confederazione svizzera avrà nelle sue fanterie con le picche una forza temibile."
44="Dante guida il lettore attraverso Inferno, Purgatorio e Paradiso e vi colloca, in chiave allegorica, i suoi avversari politici. È un capolavoro, ma ha i suoi bersagli: lo zelo cala a Venezia e il doge perde un po' di influenza."
45="Marco Polo racconta i suoi viaggi fino alla corte del Gran Khan e al Catai, con un'enfasi che pare inverosimile. Le sete e le spezie che ha riportato sono comunque assai gradite: nuove merci da commerciare a Tripoli e in Siria."
46="Il re di Francia convoca nobili, clero e borghesi, riuniti nei rispettivi «stati», per ottenere il consenso a leggi e imposte. Poter riscuotere tributi e spenderli a piacere ne rafforza il potere: +1 influenza per il re di Francia."
47="Per più stagioni il clima è impazzito: l'inverno non finisce, la primavera è piovosa e l'estate non arriva. I raccolti falliscono e i fiumi gelano. Le entrate di quest'anno in tutta l'Europa settentrionale ne risentiranno."
48="A Parigi viene presentata una reliquia insolita: un frammento del pane consumato da Cristo. La cattedrale diventa meta di pellegrinaggi e la Francia cattolica guadagna +10% di zelo."
49="Il domenicano Meister Eckhart, vicario per la Boemia, è accusato di eresia: le sue idee sull'anima e su Dio risentono di influssi greci e arabi e contrastano con l'insegnamento della Chiesa. Le sue prediche portano molti a posizioni eterodosse in Franconia, Boemia, Frisia e Fiandre."
50="Guglielmo di Occam sostiene che, fra più spiegazioni possibili, vada preferita la più semplice. Il principio, detto rasoio di Occam, offre ai dotti un metodo per natura, fede e vita. Lo zelo cala del 10% nelle province inglesi."
51="A Giovanni Buridano si attribuisce l'immagine dell'asino che, indeciso fra due mucchi di fieno identici, muore di fame: un esempio comico sul libero arbitrio. Il suo lavoro spazia però dall'ottica alla meccanica e alla logica. Zelo -10% in tutte le province francesi."
52="Francesco Petrarca, nato ad Arezzo, viaggia, studia e compone i versi per Laura che lo rendono celebre. La lirica amorosa, piacevole ma poco devota, fa calare lo zelo di almeno il 10% in gran parte dell'Italia settentrionale."
53="Giovanni Boccaccio, avviato al commercio e alla vita di banco ma poco portato per gli affari, scrive il Decameron: cento novelle narrate in dieci giornate. Il tono spregiudicato riduce lo zelo di almeno il 10% in tutta l'Italia settentrionale."
54="La peste ha invaso ogni angolo d'Europa. Città, villaggi e case sono stati colpiti, i morti si contano a milioni e le fosse comuni non bastano. Per i superstiti la preghiera resta l'unica consolazione."
55="In Spagna folle inferocite, spesso con la complicità di notabili e funzionari, assalgono le comunità ebraiche e le cacciano da molte province. Alle violenze e ai saccheggi si dà un pretesto religioso; chi è sopravvissuto ha scelto la fuga."
56="John Wycliffe, riformatore che denuncia gli abusi del clero, si spinge a negare la gerarchia ecclesiastica e a contestare ricchezze e privilegi dei prelati, oltre a interpretare a modo suo l'autorità della Bibbia. Le sue tesi seducono molti in Northumbria, Mercia e Wessex, dove l'eresia attecchisce."
57="La Bolla d'oro fissa le regole per l'elezione dell'imperatore, affidata a sette principi elettori. L'intromissione della Chiesa diminuisce e l'autorità imperiale cresce: più influenza per l'imperatore."
58="La Chiesa entra in possesso di una veste sacra, il perizoma che Cristo avrebbe indossato sulla croce. Conservata a Bamberga, ne accresce il prestigio e infiamma i fedeli in Franconia e nelle province vicine."
59="Ibn Battuta, giurista e viaggiatore, torna da un lungo viaggio in India e in Cina. I suoi racconti stupiscono, e le merci preziose portate con sé fanno ancora più effetto. Nuove merci da commerciare in Cazaria e in Crimea."
60="Hafez di Shiraz raccoglie nel Divan le sue liriche in forma di ghazal. Il titolo di hafez spetta a chi conosce il Corano a memoria, e la sua erudizione traspare dai versi. Le conversioni all'Islam aumentano nelle province musulmane, ma lo zelo islamico scende."
61="Caterina da Siena, che fin da bambina ha visioni di angeli, di Cristo e dei santi, è una mistica di grande pietà e sostiene con forza il papa. Esempio per molti fedeli, accresce l'influenza del pontefice."
62="Il predicatore John Ball attacca privilegi e ricchezze di nobili e prelati e incita i poveri alla rivolta contro la Corona e la Chiesa. Il Wessex diventa terreno fertile per eresia e slealtà."
63="I Racconti di Canterbury di Geoffrey Chaucer, ironici e a tratti licenziosi, hanno enorme successo ma mettono in burla clero e potere. Zelo -20% nelle province inglesi, mentre cresce l'influenza del re."
64="I lollardi, discepoli di Wycliffe, leggono la Bibbia per conto proprio, rifiutano la gerarchia, dubitano della transustanziazione e del celibato ecclesiastico e predicano pacifismo e libertà d'amore. La Mercia diventa focolaio di eresia e slealtà."
65="Jean Froissart, sacerdote, poeta e uomo di corte, prosegue le sue cronache a gloria della Francia e della monarchia. I suoi scritti, tra i più letti d'Europa, migliorano l'immagine del regno presso i dotti: cresce l'influenza del re di Francia."
66="Il diplomatico Manuele Crisolora traduce Omero e Platone per un pubblico più ampio di dotti, riportando gloria all'Impero bizantino e combattendo l'ignoranza. L'influenza dell'imperatore cresce."
67="Jan Hus, predicatore influente e infuocato, raccoglie le idee di Wycliffe e critica la Chiesa, mobilitando il popolo anche contro i tedeschi. Sfida l'imperatore e l'autorità del papa. La Boemia diventa focolaio di eresia e slealtà."
68="Alla Chiesa giunge una reliquia sacrosanta: un frammento ligneo ritenuto della Vera Croce. Che sia sopravvissuto fino a oggi è per molti la prova della sua autenticità. Il fervore cattolico aumenta in tutta la penisola italiana."
69="Con il sostegno della corona, il navigatore portoghese Gil Eanes si spinge a sud lungo le coste africane e supera Capo Bojador. Il successo dà prestigio alla casa regnante e apre nuovi traffici: nuove merci in Portogallo."
70="Jacques Cœur, mercante, banchiere, direttore della zecca e consigliere regio, favorisce con i suoi piani il commercio francese e arricchisce il paese. Cresce anche l'acume del re di Francia."
71="All'assemblea dell'Althing, sotto la rupe della legge, i capi islandesi hanno deciso per bocca del legislatore Thorgeir che tutti gli abitanti dell'isola ricevano il battesimo; i vecchi riti restano tollerati solo in privato. Lo zelo cristiano cresce in Islanda."
72="Salpato dalla Groenlandia, Leif figlio di Erik il Rosso ha raggiunto a occidente una terra di boschi, pascoli e viti selvatiche, che ha chiamato Vinland. Le navi tornano cariche di legname, il bene più prezioso per i coloni groenlandesi: nuova merce in Groenlandia."
73="Con una corona inviata da papa Silvestro II, il principe Stefano è stato incoronato primo re cristiano d'Ungheria. Il nuovo sovrano fonda vescovadi e monasteri e impone a tutto il regno la nuova fede. Lo zelo cresce nelle province ungheresi."
74="A Chichén Itzá i sacerdoti hanno consacrato la grande piramide di Kukulkan, il Serpente Piumato: quattro scalinate, una per ogni direzione, e nei giorni dell'equinozio l'ombra di un serpente scende lungo i gradini. Pellegrini giungono da tutto lo Yucatán. Lo zelo cresce nelle terre maya."
75="Alla corte di Heian una dama di compagnia dell'imperatrice, nota come Murasaki Shikibu, fa circolare i capitoli di un lungo racconto sugli amori del principe splendente Genji. Cortigiani e dame se ne contendono le copie, e la raffinatezza della capitale diventa modello per tutto l'arcipelago."
76="Mentre i Khitan minacciano il regno di Goryeo, il re ordina di incidere su migliaia di tavolette di legno l'intero canone buddhista, perché la protezione del Buddha salvi il paese. Monaci e intagliatori lavoreranno per decenni. Lo zelo cresce in Corea."
77="Il medico e filosofo Ibn Sina, che i latini chiamano Avicenna, ha completato il Canone della medicina, summa di tutto il sapere greco e persiano sulle malattie e i rimedi. I suoi allievi lo leggono anche come invito a fidarsi della ragione: lo zelo cala in Persia."
78="Il re Rajendra Chola ha mandato oltre il mare una grande flotta contro i porti di Srivijaya, che sbarravano gli stretti verso la Cina. Le navi tornano con il bottino e con il controllo delle rotte: nelle terre dei Chola arriva una nuova merce, la seta."
79="Il monaco Guido d'Arezzo ha inventato un modo di scrivere i canti su righe parallele e di chiamare le note con le sillabe di un inno: ut, re, mi, fa, sol, la. Ora un fanciullo impara in pochi mesi ciò che prima richiedeva anni: i cori delle chiese si moltiplicano e lo zelo cresce nell'Italia centrale."
80="Riuniti in sinodo a Toulouges, vescovi e abati hanno proclamato la Tregua di Dio: dal sabato sera al lunedì mattina, e nei tempi sacri, nessun cavaliere potrà combattere né assalire chierici, contadini e mercanti, pena la scomunica. I signori giurano sulle reliquie. Lo zelo cresce nella Francia meridionale."
81="Un anno dopo la sua morte in battaglia a Stiklestad, il corpo di re Olaf è stato riesumato intatto, con capelli e unghie cresciuti, e il vescovo lo ha proclamato santo. A Nidaros accorrono pellegrini da tutto il Nord. Lo zelo cresce in Norvegia."
82="Il gran principe Iaroslav il Saggio ha fatto innalzare a Kiev una cattedrale dedicata alla Santa Sapienza, con tredici cupole e mosaici d'oro opera di maestri venuti da Costantinopoli. Accanto sorge una biblioteca dove si copiano e traducono libri. Lo zelo cresce nella regione di Kiev."
83="Nel canyon del Chaco i costruttori ancestrali innalzano Pueblo Bonito: centinaia di stanze su più piani attorno a grandi kiva rotonde, allineate al sole e alla luna. Da lontano arrivano turchesi, conchiglie e persino uccelli dalle piume rosse. Lo zelo cresce nel Chaco."
84="Sulle rive del Mississippi migliaia di persone portano cesti di terra per innalzare un immenso tumulo a terrazze, sulla cui cima sorgerà la dimora del capo, fratello del sole. Attorno si allarga una città di piazze, palizzate e campi di mais. Lo zelo cresce lungo il Mississippi."
85="Il reggente Fujiwara no Yorimichi ha consacrato a Uji la Sala della Fenice, dove una statua dorata del Buddha Amida siede sopra uno stagno, come nella Terra Pura d'Occidente. Sempre più fedeli invocano il nome di Amida per rinascere nel suo paradiso. Lo zelo cresce nel Kinai."
86="Nella basilica di Santa Sofia il legato papale, il cardinale Umberto, ha deposto sull'altare la bolla di scomunica contro il patriarca Michele Cerulario, che ha risposto scomunicando i legati. Roma e Costantinopoli si separano; i fedeli d'Oriente si stringono attorno ai loro patriarchi e lo zelo cresce in tutte le province ortodosse."
87="Il califfo abbaside ha ricevuto con grandi onori il condottiero turco Tughril Beg e gli ha conferito il titolo di sultano, re d'Oriente e d'Occidente e difensore della fede sunnita. Il prestigio religioso del capo dei Turchi cresce: +1 pietà."
88="Il re Udayadityavarman II ha fatto innalzare al centro della sua capitale il Baphuon, una montagna sacra di arenaria a cinque terrazze, dimora degli dèi sulla terra. Una lunga strada su colonne attraversa le acque fino alla sua porta. Lo zelo cresce nelle terre dei Khmer."
89="Per sette notti una stella con una lunga chioma di fuoco ha attraversato il cielo d'Europa. I monaci annotano il prodigio nelle cronache, i re consultano gli astrologi e il popolo vi legge l'annuncio di guerre e di regni che cadono. Per paura molti tornano a pregare: lo zelo cresce in tutte le province cattoliche."
90="Il gran consigliere Wang Anshi ha convinto l'imperatore ad approvare le Nuove Leggi: prestiti di Stato ai contadini in primavera, acquisti pubblici dei raccolti, una tassa che sostituisce le corvée e un nuovo censimento delle terre. I letterati conservatori protestano, ma il tesoro imperiale si riempie: +1500 denari."
91="Yusuf di Balasagun ha presentato al khan di Kashgar il Kutadgu Bilig, un lungo poema in lingua turca che insegna come regnare con giustizia e come servire con fedeltà. I comandanti lo imparano a memoria: +1 lealtà ai generali dei Karakhanidi."
92="Ai piedi dell'Atlante, il capo degli Almoravidi Abu Bakr ibn Umar ha tracciato il campo di una nuova città, Marrakech, con una moschea, un palazzo di mattoni crudi e una cinta di palme. Da qui i guerrieri del velo diffondono il loro severo rigore religioso: lo zelo cresce in Marocco."
93="Scomunicato da papa Gregorio VII, il re di Germania ha atteso per tre giorni nella neve, scalzo e in abito da penitente, davanti alle mura del castello di Canossa, finché il pontefice non lo ha assolto. Ma i principi tedeschi hanno visto il loro re in ginocchio: -2 lealtà ai generali del Sacro Romano Impero."
94="Accogliendo l'insegnamento del dotto Muhammad ibn Mani, il mai Hummay di Kanem ha abbracciato l'Islam con la sua corte. Nella capitale Njimi si costruisce una moschea e i mercanti che attraversano il Sahara trovano un regno amico. Lo zelo cresce nel Kanem."
95="Il re Sejong ha promulgato «i suoni giusti per istruire il popolo»: ventotto lettere semplici, che chiunque può imparare in pochi giorni, al posto dei difficili caratteri cinesi. I letterati di corte protestano, ma i funzionari, finalmente compresi dai sudditi, servono la corona con più dedizione: +1 lealtà ai generali coreani."
96="Sopra le gole dell'Urubamba, l'inca Pachacuti fa costruire una residenza di pietre squadrate senza malta, con templi al Sole, terrazze coltivate e fontane, sospesa tra due vette. Gli astronomi vi osservano i solstizi. Lo zelo cresce attorno a Cuzco."
97="A Magonza l'orafo Johannes Gutenberg ha stampato una Bibbia intera con lettere di metallo mobili, inchiostro e un torchio da vino. Ciò che un copista faceva in tre anni ora si fa in poche settimane, e i libri cominciano a circolare a prezzi mai visti. Le idee viaggiano più veloci del clero: lo zelo cala nelle terre tedesche."
98="Nezahualcoyotl, signore di Texcoco e alleato di Tenochtitlan, compone canti sulla brevità della vita, scrive leggi severe ma giuste e costruisce acquedotti e giardini. Alla sua corte fioriscono poeti e sapienti, e i signori della Triplice Alleanza ne ammirano la saggezza: +1 lealtà ai generali aztechi."
99="Cosimo de' Medici ha donato al giovane Marsilio Ficino una villa a Careggi e i codici greci necessari a tradurre in latino tutte le opere di Platone. Attorno a lui si riuniscono filosofi, poeti e mercanti, che discutono dell'anima e della bellezza più che dei dogmi: lo zelo cala in Toscana."
100="Il mai Ali Gaji ha posto fine alle lotte tra i rami della dinastia e ha fondato una capitale stabile, Ngazargamu, cinta da alte mura di mattoni rossi. Le carovane del sale e dei cavalli tornano a passare dal regno e i tributi affluiscono: +1000 denari."
101="Con una bolla di papa Sisto IV, Ferdinando e Isabella hanno istituito nei loro regni un tribunale dell'Inquisizione che risponde soltanto alla corona. I convertiti sospettati di praticare in segreto la vecchia fede vengono interrogati e processati in pubblico. Il terrore rafforza l'ortodossia: lo zelo cresce nelle province spagnole."
102="Il tlatoani Ahuitzotl ha riconsacrato il Grande Tempio di Tenochtitlan, ampliato con una nuova piramide a doppia scalinata dedicata a Huitzilopochtli e a Tlaloc. Per giorni i signori di tutto il paese salgono in processione e portano tributi. Lo zelo cresce nel cuore delle terre azteche."
103="Tre piccole navi partite da Palos agli ordini del genovese Cristoforo Colombo hanno attraversato l'Oceano verso occidente per oltre due mesi e hanno toccato terra su un'isola che gli indigeni chiamano Guanahani. Colombo crede di essere giunto alle porte delle Indie; nei porti d'Europa non si parla d'altro."
104="Il frate Luca Pacioli ha dato alle stampe a Venezia la sua Summa de arithmetica, che insegna a tenere i conti «alla veneziana»: ogni somma scritta due volte, in dare e in avere, perché nulla sfugga. Mercanti e ufficiali della zecca la adottano subito e i conti dello Stato tornano in ordine: +1000 denari a chi governa Venezia."
105="Nel refettorio dei domenicani di Santa Maria delle Grazie, Leonardo da Vinci ha finito di dipingere l'Ultima Cena: gli apostoli, sconvolti, reagiscono all'annuncio del tradimento. Da tutta la Lombardia si accorre a vedere l'opera, che commuove anche i cuori più freddi. Lo zelo cresce a Milano."
106="La flotta di Vasco da Gama, doppiato il Capo di Buona Speranza e attraversato l'Oceano Indiano, ha gettato l'ancora a Calicut, la città del pepe. Per la prima volta le spezie possono arrivare in Europa per mare, senza passare per i mercanti d'Egitto e di Venezia: nuova merce in Portogallo."
107="Riemerso dopo tre giorni dalle acque del fiume Bein, il contabile Nanak ha cominciato a predicare: «Non c'è indù, non c'è musulmano», ma un solo Dio senza forma, da servire con l'onestà e il lavoro. Con il compagno musicista Mardana percorre il Punjab cantando inni. Lo zelo cresce nel Punjab."
108="Dopo tre anni di lavoro su un blocco che nessuno osava toccare, Michelangelo Buonarroti ha consegnato il David, un gigante di marmo alto più di quattro metri. Trascinato a fatica davanti al palazzo della Signoria, è il simbolo di una città piccola che non teme i potenti: +1 lealtà ai generali di chi governa la Toscana."
109="Il monaco Filofej di Pskov ha scritto al gran principe di Mosca: «Due Rome sono cadute, la terza sta in piedi e una quarta non ci sarà». Roma è caduta nell'eresia, Costantinopoli nella sventura: Mosca si sente erede dell'Impero e custode della vera fede. Lo zelo cresce nelle province russe."
110="Il giurista londinese Tommaso Moro ha pubblicato un libretto su un'isola immaginaria, Utopia, dove non esiste proprietà privata, si lavora sei ore al giorno e ogni fede è tollerata. Molti ridono, altri riflettono sui mali dell'Inghilterra, e qualcuno comincia a dubitare dell'ordine voluto da Dio: lo zelo cala nelle province inglesi."
111="Il monaco agostiniano Martin Lutero ha affisso alla porta della chiesa del castello di Wittenberg novantacinque tesi contro la vendita delle indulgenze. Grazie alla stampa, in poche settimane le sue parole corrono per tutta la Germania; principi e cittadini sentono che la Chiesa di Roma si può sfidare. L'eresia dilaga nelle terre tedesche."
112="Una sola nave, la Victoria, è rientrata in Spagna con diciotto uomini stremati: è ciò che resta della flotta di cinque navi partita tre anni fa con Ferdinando Magellano, morto nelle isole d'Oriente. Navigando sempre verso ovest hanno fatto il giro del mondo, e la stiva è piena di chiodi di garofano delle Molucche: nuova merce in Castiglia."
113="Dopo una pubblica disputa davanti al consiglio cittadino, il predicatore Ulrico Zwingli ha convinto Zurigo ad abolire la messa, togliere le immagini dalle chiese e chiudere i conventi. Alcuni cantoni guardano con interesse, altri con orrore: l'eresia si diffonde in Svizzera."
114="Per ottenere l'annullamento del matrimonio che il papa gli negava, il re d'Inghilterra si è fatto proclamare dal Parlamento capo supremo della Chiesa d'Inghilterra. Chi rifiuta il giuramento rischia la vita, i monasteri tremano per le loro terre e i legami con Roma si spezzano: l'eresia si diffonde in Inghilterra."
115="Papa Paolo III ha approvato la Compagnia di Gesù fondata dal basco Ignazio di Loyola, un ex soldato: preti istruiti e disciplinati, legati al pontefice da un voto speciale di obbedienza, pronti a insegnare, predicare e partire per ogni angolo del mondo. Lo zelo cresce in Italia e nella penisola iberica."
116="Richiamato dal consiglio della città, il teologo francese Giovanni Calvino è tornato a Ginevra e vi ha imposto una Chiesa severa, governata da pastori e anziani che vigilano sui costumi di tutti. Da lì libri e predicatori passano in Francia, dove gli ugonotti si moltiplicano nel Mezzogiorno: l'eresia si diffonde."
117="Poco prima di morire, il canonico Niccolò Copernico ha visto stampata la sua opera sulle rivoluzioni delle sfere celesti: non è il Sole a girare attorno alla Terra, ma la Terra attorno al Sole. I teologi la giudicano un'ipotesi stravagante, ma i dotti cominciano a dubitare del cielo dei padri: lo zelo cala in Polonia e in Prussia."
118="Sull'altopiano andino, a più di quattromila metri, un pastore ha scoperto che la montagna di Potosí è attraversata da vene d'argento purissimo. In pochi mesi accorrono migliaia di minatori e attorno alle gallerie nasce una città: +2000 denari a chi governa la regione di Charcas."
119="Il re Ang Chan ha riportato la corte tra i templi di Angkor, abbandonati da generazioni nella foresta. Gli scultori completano le gallerie lasciate incompiute e i monaci buddhisti tornano a officiare nel grande santuario. Lo zelo cresce nelle terre dei Khmer."
120="Alcuni nobili k'iche', perché non vada perduta, hanno messo per iscritto la storia antica del loro popolo: la creazione del mondo, gli uomini di mais, le imprese dei gemelli divini nell'oltretomba. Il Popol Vuh passa di mano in mano tra i signori maya: lo zelo per gli antichi dèi cresce."
121="Alla dieta di Augusta i principi cattolici e luterani hanno firmato la pace: ognuno sceglierà la fede del proprio territorio e i sudditi dovranno seguirla o emigrare. «Di chi è la regione, di lui è la religione.» Le armi tacciono e i principi tornano a servire l'Impero: +2 lealtà ai generali del Sacro Romano Impero."
122="L'architetto Sinan ha completato per il sultano una grande moschea con una cupola immensa, quattro minareti, scuole, una biblioteca, un ospedale e cucine per i poveri. È la meraviglia della capitale e il segno della grandezza della dinastia: lo zelo cresce nelle province dei Turchi."
123="Tornato da Ginevra, il predicatore John Knox infiamma le folle di Edimburgo contro la messa e contro le immagini. Il Parlamento scozzese ha adottato una nuova confessione di fede e rotto con il papa: l'eresia si diffonde in Scozia."
124="Dopo diciotto anni di sessioni interrotte da guerre e pestilenze, i padri del Concilio di Trento hanno concluso i lavori: confermati i sacramenti e il culto dei santi, imposto ai vescovi di risiedere nelle loro diocesi, istituiti i seminari per formare il clero. La Chiesa cattolica esce rinnovata: lo zelo cresce in tutte le province cattoliche."
125="Il mai Idris Alooma è tornato dal pellegrinaggio alla Mecca con dotti, libri e moschettieri turchi. Fa costruire moschee di mattoni, nomina giudici della legge islamica e governa con una severità che i sudditi chiamano giustizia: +1 pietà al capo del Kanem."
126="Riuniti a Varsavia durante l'interregno, i nobili polacchi hanno giurato di non spargere mai sangue per motivi di fede: cattolici, luterani, calvinisti e ortodossi avranno uguali diritti nella Repubblica. Mentre il resto d'Europa brucia, la nobiltà resta unita: +1 lealtà ai generali polacchi."
127="Sulle rive del lago Kokonor, Altan Khan ha accolto il maestro tibetano Sonam Gyatso e gli ha dato il titolo di Dalai Lama, «oceano di saggezza»; in cambio il lama lo ha riconosciuto erede di Qubilai. I Mongoli abbracciano in massa il buddhismo: lo zelo cresce nelle loro terre."
128="Con la bolla Inter gravissimas papa Gregorio XIII ha corretto il calendario, che da secoli si allontanava dal corso del sole: quest'anno al giovedì 4 ottobre seguirà direttamente venerdì 15. I paesi cattolici obbediscono; protestanti e ortodossi si rifiutano di contare i giorni come il papa."
129="Il reggente ha invitato al santuario di Kitano chiunque, nobile o contadino, purché portasse una tazza e un bollitore. Il maestro Sen no Rikyu ha servito il tè secondo la «via del tè», semplice e silenziosa, che unisce guerrieri e mercanti nello stesso gesto: +1 lealtà ai generali giapponesi."
130="Lo scià Abbas ha scelto Isfahan come capitale e vi fa tracciare una piazza immensa, «immagine del mondo», circondata da bazar coperti, moschee dalle cupole turchesi e un palazzo da cui assistere alle partite di polo. Mercanti armeni, europei e indiani vi accorrono: «Isfahan è metà del mondo». +1000 denari a chi governa la regione."
131="Dopo otto anni di processo, il frate filosofo Giordano Bruno, che parlava di infiniti mondi e rifiutava di abiurare, è stato condotto a Campo de' Fiori e arso vivo. «Forse tremate più voi nel pronunciare la sentenza che io nel riceverla», avrebbe detto ai giudici. L'Inquisizione mostra il suo potere: lo zelo cresce a Roma."
132="La regina d'Inghilterra ha concesso a un gruppo di mercanti londinesi il monopolio dei commerci oltre il Capo di Buona Speranza. La Compagnia raccoglie capitali tra centinaia di soci e arma navi per le isole delle spezie: le prime quote rendono subito alla corona +1500 denari."
133="Sul greto del fiume Kamo, a Kyoto, una danzatrice di nome Okuni, vestita da giovane samurai con una croce cristiana al collo, mette in scena danze e scenette licenziose che attirano folle enormi. I monaci se ne scandalizzano, ma la gente accorre ogni giorno: lo zelo cala nel Kinai."
134="Miguel de Cervantes, vecchio soldato ferito a Lepanto, ha pubblicato le avventure di un nobiluomo della Mancia che, impazzito a forza di leggere romanzi cavallereschi, va per il mondo a raddrizzare torti con il suo scudiero. Tutta la Spagna ride, e ridendo comincia a guardare con ironia i propri ideali: lo zelo cala nelle province spagnole."
135="Con un cannocchiale costruito da sé, il professore padovano Galileo Galilei ha visto montagne sulla Luna, stelle innumerevoli nella Via Lattea e quattro lune che girano attorno a Giove. Il suo libretto va a ruba: i cieli non sono perfetti come insegnavano i teologi, e lo zelo cala a Venezia e in Toscana."
136="Di fronte all'antica madrasa di Ulugh Beg, il governatore di Samarcanda fa innalzare lo Sher-Dor, una scuola coranica con portali coperti di maioliche, dove due tigri inseguono due cerve sotto un sole dal volto umano. Studenti e pellegrini riempiono la piazza: lo zelo cresce in Transoxiana."
137="Nelle miniere di Kollur, lungo il fiume Krishna, migliaia di lavoratori setacciano la ghiaia alla ricerca di diamanti, e ne escono pietre grandi come uova di piccione. Gioiellieri di Persia, d'Europa e dell'India accorrono ai mercati di Golconda: +1500 denari a chi governa il Deccan."
138="Per onorare la sposa amatissima, morta di parto, l'imperatore ha cominciato a costruire ad Agra, sulla riva dello Yamuna, un mausoleo di marmo bianco intarsiato di pietre preziose, in mezzo a un giardino del paradiso. Ventimila operai vi lavoreranno per vent'anni: lo zelo cresce nella regione."
139="Un gentiluomo francese che vive appartato nelle Province Unite, René Descartes, ha pubblicato a Leida un discorso sul metodo per ben condurre la ragione: dubitare di tutto finché non resta che una certezza, «penso, dunque sono». Nelle università dei Paesi Bassi non si parla d'altro: lo zelo cala in Frisia e nelle Fiandre."
140="Il re di Francia ha trasferito la corte e il governo nella reggia di Versailles, con le sue sale dorate e i suoi giardini infiniti. I grandi nobili, un tempo ribelli, vivono ora sotto gli occhi del sovrano e si contendono l'onore di porgergli la camicia al risveglio: +2 lealtà ai generali francesi."
141="Il professore di Cambridge Isaac Newton ha pubblicato i Principi matematici della filosofia naturale: la stessa forza che fa cadere una mela tiene la Luna in orbita attorno alla Terra e i pianeti attorno al Sole, secondo leggi che si possono calcolare. L'universo sembra un orologio perfetto: lo zelo cala nelle province inglesi."

