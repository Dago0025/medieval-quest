;; Eventi storici della fase 6a (spec. fase 6 par. 6a, ADR-011): per ognuno dei 71 eventi di Events.txt (indice = posizione
;; nell'elenco `Historical_event_titles`, da 0) l'anno o la finestra di anni, la fonte o la motivazione, la fazione o le
;; regioni a cui si lega e l'effetto. NIENTE testi: titoli e testi originali si leggono dall'installazione (ADR-007).
;;
;; Chiavi di ogni sezione [evento_NN]:
;;   indice      posizione in Events.txt (0-70)
;;   chiave      nome breve leggibile, non e' il titolo
;;   anno_da / anno_a   anno storico (uguali) o finestra: con una finestra l'anno si estrae una volta con state.rng (PROVVISORIA)
;;   fonte       fonte storica o motivazione dell'anno
;;   provvisoria true se l'anno (finestra scelta dall'autore) o il valore dell'effetto non sono nel testo ne' nella storia
;;   fazione     fazione a cui l'evento si lega ("" = nessuna); l'evento si mostra a tutti, l'effetto vale per chi la soddisfa
;;   regioni     regioni citate dal testo (ID dello startpos, vedi un test che le controlla sull'installazione)
;;   cultura     (zelo) tutte le regioni di questa cultura, se il testo parla di 'province ortodosse' o simili
;;   effetto     vocabolario chiuso: merci, lealta, zelo, eretici, pieta_capo, tesoro, nessuno
;;   valore      variazione: lealta' dei generali della fazione (lealta), punti di zelo delle province (zelo), punti di eretici
;;               tolti alle altre religioni (eretici), pieta' del capo (pieta_capo), denari (tesoro)
;;   merci       (merci) merci aggiunte al commercio delle regioni
;;   nota        effetti del testo che non sono nel vocabolario e quindi non modellati, o scelte dell'autore
;; Ambito dell'effetto: regioni elencate; altrimenti la cultura; altrimenti le province della fazione. Per lealta', pieta_capo e
;; tesoro la fazione e', nell'ordine, `fazione` o il proprietario della prima regione.
;; Dove il testo non da' un numero (per esempio "zelo aumentato") il valore e' dell'autore e la voce e' PROVVISORIA.

