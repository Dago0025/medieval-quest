; Castelli propri di una cultura (CastleStyle, 22/11/2026). Dal mastio in su la pedina della mappa e l'icona del castello
; sono quelle dello stile (assets/rifatti/campmap/{pieces,review_panel}/buildings/<stile>/<grado>.png, preparate da
; tools/prepara_castelli_cultura.py); il forte di legno resta quello comune.
;   giapponese: yamashiro di legno, castello su base di pietra, grande tenshu a cinque piani, complesso a piu' cinte
;   cinese: forte di terra battuta, citta' murata in mattoni, grande citta' con barbacane, capitale imperiale
;   azteco: villaggio con palizzata e piattaforma, cittadina di adobe, recinto con piramide a gradoni, citta' sul lago
;   inca: forte d'altura con capanna rotonda, pukara di pietra a secco, recinto a terrazze, fortezza a mura a zig-zag
;   kanem: villaggio di mattoni crudi con moschea, palazzo fortificato, citta' murata in mattoni rossi, capitale reale
;   mississippiano: fattoria con palizzata, villaggio sul tumulo, tempio sulla piattaforma, centro cerimoniale, Cahokia
;   indiano (Chola): villaggio tamil, forte di granito col tempietto, citta' col gopuram, grande citta' murata, Gangaikonda Cholapuram
;   khmer: villaggio su palafitte, villaggio fortificato, citta' col fossato, Angkor Thom, Angkor
;   forte (grado 0, dal 23/11/2026): una versione per stile; ribelli: villaggio di capanne col recinto di vimini
;   (Aztechi e Inca: costruzioni semplici, senza torri ne' merli; Federico, 22/11/2026: «sono popoli meno progrediti»)
;   Coreani e Mongoli usano lo stile cinese (Federico, 22/11/2026: i castelli possono restare quelli di cinesi e giapponesi)

