; Nomi, colori e stemmi delle fazioni come li mostra il remake (fase 8). Gli id restano quelli dello startpos (FN_DANISH...):
; qui si decide solo come appaiono. Usato dall'interfaccia e dai testi degli eventi (SimUtil.faction_label).
;
; La fazione del giocatore, FN_DANISH nei dati della mod, si chiama Auror (scelta di Federico, 2026-11-08): bianco e nero,
; stemma d'argento al drago a tre teste di nero (assets/stemmi/auror.png, da un'immagine generata in locale e ripulita con tools/prepara_stemma.py; auror_grande.png e' l'emblema intero per il menu; auror.svg e' il primo disegno del remake).

