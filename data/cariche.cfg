; Cariche di corte (AddOffice dello startpos, in inglese anche nella versione italiana della XL) tradotte per la fase 8.
; Schema «Carica of Luogo»: [cariche] traduce la carica, [luoghi] il luogo (le voci con l'articolo portano gia' la preposizione:
; «the Fleet» -> «della Flotta»); un luogo che manca qui prende il nome italiano della regione se c'e', altrimenti resta com'e'.
; Le chiavi non hanno spazi: gli spazi diventano _ e gli apostrofi spariscono («Khan's Treasurer» -> Khans_Treasurer).

