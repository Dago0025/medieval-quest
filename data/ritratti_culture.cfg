; Ritratti per cultura (ADR-087, richiesta di Federico del 16/11/2026: «produzione e applicazione dei ritratti delle
; nuove fazioni»). Ogni fazione qui sotto prende i ritratti di personaggi, agenti e ammiragli dalla serie della sua
; cultura, assets/ritratti/<cultura>/<ruolo>/NN.png (preparata da tools/prepara_ritratti_culture.py); se la cultura non
; ha la serie di un ruolo, resta la serie della religione. Gli agenti religiosi (sacerdoti, sciamani, imam, ulema,
; vescovi...) usano la serie «religious» della cultura.
;
; Coreani e Mongoli hanno anche 4 re, 4 generali, 3 principi e 3 principesse (ADR-088, dal 22/11/2026); Chola e Khmer
; 4 re, 4 generali, 3 principi, 4 principesse e un ammiraglio dal 23/11/2026 (ADR-130). L'Orda d'Oro usa gli agenti
; mongoli.

