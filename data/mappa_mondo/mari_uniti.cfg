; Zone di mare unite sulla mappa del mondo (richiesta di Federico del 16/11/2026: «il Mediterraneo e' fin troppo frammentato,
; riduci i segmenti di mare»). Ogni voce: zona tolta = zona che la assorbe. Le zone tolte spariscono dalla bitmap delle
; regioni (tools/mondo/unisci_mari.py) e dallo startpos del mondo: WorldMap.startpos_text toglie la loro DeclareSeaRegion e
; scrive la zona che le assorbe al posto loro nelle altre righe; i salvataggi del mondo di prima spostano flotte e agenti allo
; stesso modo. Sulla mappa d'Europa originale non cambia nulla. Da 22 zone a 10.
