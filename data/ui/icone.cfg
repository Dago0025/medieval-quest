; Icone dell'interfaccia originale (fase 8, ADR-007): nome usato nei dati del gioco o del remake -> immagine del gioco (PNG
; esportati in _ASSET_EXPORT). Le icon_* di rame, cotone, oro, ferro, piombo, lino, marmo, sale, seta, argento, spezie e stagno
; sono segnaposto con il nome scritto: per merci e minerali si usano le goods_* e ore_*, che sono disegnate. Tutte le
; icone di merci e giacimenti hanno la versione rifatta in assets/rifatti (ADR-071, tools/prepara_risorse.py).

[merci]
; DeclareTradegoods dello startpos
GLASSWARE="campmap/parchments/Icons/goods_glass.BIF"
