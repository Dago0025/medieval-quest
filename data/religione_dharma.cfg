; Dharma dei popoli asiatici (richiesta di Federico del 22/11/2026: «crea una religione sensata per tutti i popoli
; asiatici con un suo simbolo, gli edifici quindi dovranno essere allineati a quest'ultima»). Una sola religione che
; raccoglie le tradizioni nate dal Dharma (buddhismo, induismo, con lo shintoismo e il taoismo che convivono con il
; buddhismo in Giappone e in Cina): simbolo la ruota del Dharma a otto raggi, colore lo zafferano delle vesti dei monaci.
; Esiste solo con la mappa del mondo. Chiave delle province DHARMA (ProvinceState), token REL_DHARMA (SetReligion),
; cultura delle regioni DHARMA_CULTURE (data/regole/province.cfg). Edifici e agente propri, al posto del santuario
; pagano e dello sciamano: Dharma.append_buildings / Dharma.append_units (Scenario.load_buildings / load_units).

[religione]
; fazioni che seguono il Dharma (SetReligion REL_DHARMA nello startpos del mondo)
fazioni = ["FN_JAPANESE", "FN_CHINESE", "FN_KOREANS", "FN_MONGOLS", "FN_CHOLA", "FN_KHMER"]
; regioni con cultura DHARMA_CULTURE (India, Tibet, Asia orientale e Sud-est continentale, Giava e Srivijaya); restano
; pagane la Siberia, la Manciuria dei Jurchen, le isole delle spezie, le Filippine, l'Australia
regioni = ["ID_GUJARAT", "ID_RAJPUTANA", "ID_MALWA", "ID_PUNJAB", "ID_KASHMIR", "ID_DECCAN", "ID_GANGAVADI", "ID_CHOLA", "ID_KERALA", "ID_KANNAUJ", "ID_CHEDI", "ID_CEYLON", "ID_KALINGA", "ID_VENGI", "ID_BENGAL", "ID_MAGADHA", "ID_KAMARUPA", "ID_TIBET", "ID_GUGE", "ID_UIGHURIA", "ID_BAGAN", "ID_RAMANNA", "ID_TANGUT", "ID_HEXI", "ID_AMDO", "ID_MONGOLIA", "ID_DZUNGARIA", "ID_EAST_MONGOLIA", "ID_DALI", "ID_KHMER", "ID_LAVO", "ID_SRIVIJAYA", "ID_TAMBRALINGA", "ID_JAVA", "ID_BALI", "ID_DAI_VIET", "ID_CHAMPA", "ID_SICHUAN", "ID_SHAANXI", "ID_HEDONG", "ID_LINGNAN", "ID_GUANGXI", "ID_HUGUANG", "ID_HUNAN", "ID_KAIFENG", "ID_HEBEI", "ID_SHANDONG", "ID_FUJIAN", "ID_JIANGNAN", "ID_HUAINAN", "ID_JIANGXI", "ID_LIAO", "ID_YANYUN", "ID_LIAODONG", "ID_KOREA", "ID_GYEONGSANG", "ID_KYUSHU", "ID_KINAI", "ID_TOHOKU", "ID_KANTO", "ID_EZO"]
; agenti pagani che le fazioni del Dharma non arruolano piu' (li prendevano dalla fazione modello)
agenti_tolti = ["Shaman"]
; edifici che accettano anche il Dharma come religione, con un percorso proprio: famiglia -> condizione in piu' (OR)
alternative = {"UNIVERSITY": "{DHARMA_PAGODA, CASTLE13}"}

; ---- edifici: ogni sezione e' una famiglia nuova, dalla riga del `modello` nel prod con sopra questi valori; i nomi
; stanno in data/nomi_edifici.cfg (e data/lingue/en), le icone in assets/rifatti/campmap/review_panel/buildings/asian ----

[edificio.DHARMA_TEMPLE]
modello = "CHURCH"
etichetta = "Dharma Temple"
costo = 200
tempo = 4
requisiti = "{CASTLE4}"
fede = 0.1
felicita = 20
tecnologia = 2
miglioramenti = "UPGRADE_MORALE(1)"

[edificio.DHARMA_MONASTERY]
modello = "MONASTERY"
etichetta = "Dharma Monastery"
costo = 500
tempo = 6
requisiti = "{DHARMA_TEMPLE, CASTLE7}"
fede = 0.1
felicita = 10
tecnologia = 3
miglioramenti = "UPGRADE_MORALE(2)"

[edificio.DHARMA_PAGODA]
modello = "CATHEDRAL"
etichetta = "Great Pagoda"
costo = 1000
tempo = 16
requisiti = "{DHARMA_TEMPLE, CASTLE10}"
fede = 0.15
rendita = 100
felicita = 40
tecnologia = 4
miglioramenti = "UPGRADE_MORALE(3)"

; ---- agenti: dalla riga del `modello`; nomi in data/nomi_unita.cfg, descrizioni in data/testi/<lingua> ----

[agente.Monk]
modello = "Shaman"
requisiti = "{ DHARMA_TEMPLE }"
