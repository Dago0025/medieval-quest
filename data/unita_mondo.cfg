; Unita' proprie delle fazioni nuove della mappa del mondo (ADR-116, richiesta di Federico del 21/11/2026: «progetta e
; applica unita' dedicate alle nuove fazioni non del gioco originale o della mod XL; ogni popolazione deve avere truppe
; coerenti con il suo background storico»). Giapponesi, Cinesi, Aztechi, Inca, Kanem, Cahokia, Coreani, Mongoli, Chola e
; Khmer. Esistono solo sulla mappa del mondo (in tutte e due le modalita'): CultureUnits copia la riga del `modello`
; (unita' XL dello stesso genere: corpo, cavalcatura, arma, classi, pesi dell'IA) e ci scrive sopra i valori della sezione,
; come per le unita' degli Auror (data/unita_auror.cfg). Le fazioni nuove non arruolano piu' le truppe e le navi della
; fazione modello (data/fazioni_mondo.cfg) ne' le truppe comuni a tutte le fazioni (ALL_FACTIONS, come le macchine
; d'assedio europee): dalla fazione modello prendono solo agenti ed edifici.
;
; Valori: `fazioni` = chi la arruola ([] = solo mercenario, nelle `regioni` dell'elenco); `epoche` = EARLY/HIGH/LATE
; (ALL = sempre); `requisiti` = edifici richiesti come nella colonna 16 ({A, B} = tutti, {{A},{B}} = uno dei gruppi;
; assente = quelli del modello, per le navi); costo e mantenimento in denari; uomini; carica/mischia/difesa/armatura =
; CHARGE_BONUS, MELEE_BONUS, DEFENCE_BONUS, ARMOUR_LEVEL della colonna 21; morale = colonna 18 (assente = del modello);
; `guardia = true` = unita' del capo delle fazioni (colonna 27); `sostituisce_nello_startpos` = unita' dell'originale che
; nelle regioni delle sue fazioni diventano questa all'inizio della partita (guarnigioni dello startpos del mondo);
; `peso_ia` = peso di arruolamento dell'IA per tutti i profili (PROVVISORIO: 100 truppe fino a 225 denari, 90 fino a
; 375, 75 oltre, navi 100 o 85, guardie 30, macchine e cannoni 25, prigionieri hashar 0), cosi' gli eserciti dell'IA escono
; misti e numerosi. Le leve sono milizie locali sul modello della milizia cittadina (corpo di guardia), economiche anche
; per l'IA. Le armi da fuoco chiedono la fonderia, che arriva solo con la polvere da sparo (ADR-114); Aztechi, Inca e
; Cahokia non hanno cavalleria (la sola dei Cahokia compare dopo l'arrivo dei cavalli dalle altre terre). Testi in
; italiano e in inglese.
;
; Immagini: dove non c'e' ancora quella propria, carta e scheda sono quelle del `modello` (o di `carta`, se c'e'); i
; Giapponesi e i Cinesi hanno le loro (22/11/2026, tools/prepara_unita_mondo.py da AI-Playground/media/unita_<fazione>); `codice` e' il
; codice del prompt nei documenti del progetto MTW (prompt/fazione_*.md, prompt/unita_giapponesi_agenti_asiatici.md;
; per Coreani, Mongoli, Chola e Khmer specifiche/unita_fazioni_nuove.md) con cui si chiameranno le immagini.

