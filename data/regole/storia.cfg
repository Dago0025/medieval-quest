; Limiti storici della campagna (ADR-114, richiesta di Federico del 21/11/2026), letti da HistoryRules.
; Valgono per l'IA e per il giocatore; gli Auror ne sono esenti dove auror.cfg lo dice (armi_da_fuoco_subito).

[invenzioni]
; Invenzione della colonna 26 degli edifici -> chiave dell'evento storico (data/eventi/eventi_storici.cfg) che la porta.
; Un livello d'edificio con un'invenzione non si costruisce prima dell'evento; un'unita' che si arruola solo con edifici
; di invenzioni non ancora arrivate non compare neppure tra ribelli, lealisti, mercenari e crociati. Un'invenzione senza
; evento nell'elenco, o con un evento che la tabella non ha, non limita nulla.
GUNPOWDER = "polvere_da_sparo"
COMPASS = "bussola"

[cavalli]
; Popoli delle Americhe: niente cavalli prima dell'arrivo degli europei (non arruolano cavalleria, i loro capi hanno una
; guardia a piedi). L'arrivo e' il primo anno in cui una fazione che non e' in questo elenco (ribelli esclusi) possiede
; una delle regioni qui sotto; da allora i cavalli restano per sempre.
fazioni = ["FN_AZTECS", "FN_INCA", "FN_MISSISSIPPIANS", "FN_MAYA"]
; Americhe della mappa del mondo senza la Groenlandia (i Norreni non vi portarono cavalli ai nativi) e senza Atlantide.
regioni = ["ID_VINLAND", "ID_HUDSON", "ID_DENE", "ID_ALASKA", "ID_CALIFORNIA", "ID_CHACO", "ID_PLAINS", "ID_GREAT_LAKES", "ID_MISSISSIPPI", "ID_APPALACHIA", "ID_TOLLAN", "ID_MAYA", "ID_CENTRAL_AMERICA", "ID_CARIBBEAN", "ID_MUISCA", "ID_AMAZONIA", "ID_BRAZIL", "ID_CHIMU", "ID_CUZCO", "ID_TIWANAKU", "ID_PAMPAS", "ID_CHILE", "ID_PATAGONIA"]

[guardia]
; Il capo di ogni fazione combatte sempre con un'unita' di cavalleria (a piedi i popoli senza cavalli): se il suo esercito
; non ne ha una riceve la guardia, l'unita' del capo della colonna 27 (Royal Knights e simili) disponibile nell'epoca,
; altrimenti la migliore cavalleria che la fazione puo' arruolare. Senza esercito il capo ne riceve uno con la sola guardia.
; Si controlla a inizio partita e a ogni fine anno. PROVVISORIA: la guardia persa ricompare l'anno dopo, gratis.
attiva = true
; ruoli dei personaggi che hanno diritto alla guardia (capo, erede, principe, generale)
ruoli = ["capo"]
