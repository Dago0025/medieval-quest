; Tratti storici delle fazioni (ADR-089, richiesta di Federico del 17/11/2026): bonus e malus ispirati alla storia di
; ogni fazione, descritti nella scelta della fazione del menu iniziale. Letti da FactionTraits (src/sim/faction_traits.gd)
; e applicati a chiunque guidi la fazione, giocatore o IA (parita', ADR-015). Gli Auror della modalita' Auror (FN_DANISH)
; non hanno tratti: hanno i poteri di auror.cfg; nello scenario storico FN_DANISH sono i Danesi e usano la loro sezione.
; Valori PROVVISORI, da tarare giocando.
;
; Chiavi (assenti = 0, nessun effetto):
;   percentuali (+20 = +20%, -10 = -10%)
;     agricoltura, commercio, miniere                      reddito delle province della fazione
;     costo_truppe, costo_cavalleria, costo_navi, costo_edifici   prezzo di arruolamento e di costruzione
;                                                          (costo_cavalleria si somma a costo_truppe per la cavalleria)
;     mantenimento_truppe, mantenimento_navi               mantenimento annuo
;     forza_fanteria, forza_cavalleria, forza_arcieri, forza_artiglieria, forza_navi
;                                                          forza nella risoluzione automatica (gli arcieri a cavallo
;                                                          sommano cavalleria e arcieri)
;     tesoro_iniziale                                      tesoro della partita nuova
;   numeri interi
;     anni_navi, anni_edifici                              anni di costruzione in piu' o in meno (mai sotto 1)
;     lealta                                               punti di lealta' in ogni provincia (base 100, rivolta sotto 100)
;     valore_emissari, valore_spie, valore_religiosi       stelle in piu' o in meno degli agenti reclutati
;                                                          (emissari e principesse; spie e assassini; preti, vescovi,
;                                                          imam, ulema, sciamani, inquisitori)
;     valore_reclute                                       valore minimo delle pile nuove (esperienza delle reclute)
;     truppe_iniziali, navi_iniziali                       pile in piu' nella partita nuova (copie delle unita' iniziali
;                                                          piu' forti, nella capitale; le navi nella zona di mare vicina)
;   testi: titolo, descrizione (italiano), titolo_en, descrizione_en (inglese)
;   come = "FN_..."  usa i tratti di un'altra fazione (i Danesi della mappa del mondo in modalita' Auror)

