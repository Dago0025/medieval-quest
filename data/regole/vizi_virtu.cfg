; Vizi e virtu' del primo gruppo documentato (fase 4a). ADR-004: i numeri stanno qui;
; i valori predefiniti di src/sim/vnv_rules.gd sono uguali a questi (un test lo verifica).
;
; NOMI: gli id e i livelli vengono dai testi del gioco, file Loc/Italian/Events.txt, sezione
; "Vice and virtue text": per ogni catena <id><livello>title e <id><livello>desc (testi in inglese,
; anche nella versione italiana). Gli stessi id compaiono nei re famosi e negli eroi (campo vnv di
; MTW_XL_EARLY_HEROES.TXT: per esempio defender3, educated1, tyrant2). Qui "catena" = id senza il livello
; finale (fearsome3 = catena fearsome, livello 3); il prefisso secret_ (vizio segreto) non e' modellato.
;
; Gli effetti dei testi sono su statistiche che non esistono ancora (morale, felicita', salute):
;   morale -> comando: PROVVISORIA, 1 punto di comando ogni 2 punti di morale (catalogo: ogni due
;   stelle +1 attacco e +1 difesa; Leadership +4/+6 morale, Vacillator -6 morale -2 comando);
;   felicita' e salute: ignorate in questa fase.
; Le soglie dei contatori sono PROVVISORIE salvo dove indicato (catalogo "Trigger": Killer Instinct oltre
; 40 uccisioni, Butcher oltre 1.000 prigionieri; lista completa e soglie di livello non trovate).
;
; Chiavi di ogni catena: nome, contatore, soglie (una per livello, contatore >= soglia x scala),
; scala, solo_capo, e un elenco di effetti per livello (comando, terrore, pieta, acume, lealta).
; Contatori: vittorie (battaglie vinte dal comandante), ritirate (ritirate dopo una sconfitta),
; uccisioni (uomini nemici uccisi dal suo esercito, in unita' di "scala" uomini),
; prigionieri (uomini degli eserciti nemici catturati), anni_tassa_alta (anni del capo con la
; maggioranza delle province a tassa alta).

[gruppo]
catene=["fearsome", "tyrant", "vaccilator", "killer", "butcher"]

[fearsome]
; Leadership: Natural Leader, Fine Leader, Great Leader, Legendary Leader (+2/+4/+6/+6 morale, +1/+2/+3/+3 lealta')
nome="Leadership"
contatore="vittorie"
soglie=[3, 7, 12, 20]
scala=1
solo_capo=false
comando=[1, 2, 3, 3]
lealta=[1, 2, 3, 3]

[tyrant]
; Dread: Authoritarian, Autocrat, Tyrant, Despot (+1/+2/+3/+4 terrore; -20/-40 felicita' ai livelli 3 e 4)
nome="Dread"
contatore="anni_tassa_alta"
soglie=[5, 10, 15, 20]
scala=1
solo_capo=true
terrore=[1, 2, 3, 4]

[vaccilator]
; Vacillator (grafia del gioco): Hesitant, Indecisive, Vacillator (-1/-2/-3 lealta', -2/-4/-6 morale);
; il catalogo dice -6 morale -2 comando al livello massimo dopo ritirate ripetute
nome="Vacillator"
contatore="ritirate"
soglie=[3, 6, 10]
scala=1
solo_capo=false
comando=[0, -1, -2]
lealta=[-1, -2, -3]

[killer]
; Killer Instinct (catalogo: oltre 40 uccisioni) e Natural Born Killer (soglia PROVVISORIA, quadrupla);
; nessun numero nei testi: +1/+2 terrore PROVVISORIO. Una uccisione = 10 uomini nemici uccisi (PROVVISORIA)
nome="Killer Instinct"
contatore="uccisioni"
soglie=[40, 160]
scala=10
solo_capo=false
terrore=[1, 2]

[butcher]
; Butcher (catalogo: oltre 1.000 prigionieri; +2 terrore nel testo)
nome="Butcher"
contatore="prigionieri"
soglie=[1000]
scala=1
solo_capo=false
terrore=[2]
