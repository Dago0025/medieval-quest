; Regole della fazione degli Auror (FN_DANISH nei dati), la fazione della mod integrata nel remake (ADR-004).
; Nel gioco originale erano patch all'eseguibile (vedi la scheda MTW del Second Brain);
; qui diventano dati letti dalla simulazione a partire dalla fase 4.
; I valori sui dati di partenza (regioni, edifici, eserciti, tesoro, eredi, unita')
; sono gia' nei file della campagna e si leggono da li'.

[FN_DANISH]
nome="Auror"
; tutti i personaggi della fazione hanno comando 9 (il massimo)
comando_fisso=9
; fedelta' dei personaggi sempre al massimo
fedelta_fissa=9
; influenza della fazione sempre al massimo (base del re forzata a 30 nell'exe)
influenza_fissa=9
; il re non muore di vecchiaia (soglia portata a 10000 anni nell'exe)
re_immortale=true
; il re non muore mai (richiesta di Federico del 15/11, ADR-075): ne' per mano di assassini o inquisitori ne' dopo una
; sconfitta; se e' giustiziato da prigioniero ricompare libero nello stesso anno in rifugio_re (se la provincia e' ancora
; della fazione, altrimenti nella sua provincia piu' vicina al luogo della cattura)
re_invulnerabile=true
; sulla mappa del mondo (ADR-078, 16/11/2026) gli Auror vivono sull'isola di Atlantide: rifugio e regione natia li'
rifugio_re="ID_ATLANTIS"
; regione natia degli Auror (richiesta di Federico del 16/11/2026: la Norvegia al posto della Danimarca): in modalita' Auror
; il re parte da qui (Scenario.apply_home_regions sostituisce la PlaceLeader dell'installazione) e qui sorge la fortezza
; bianca degli Auror, sulla mappa e come icona del castello (FortressArt)
regione_natia="ID_ATLANTIS"
; nome riservato al capo (richiesta di Federico del 16/11/2026): solo l'Imperatore Dio si chiama Darkos; eredi e principi
; prendono gli altri nomi reali degli Auror (data/nomi_personaggi.cfg). Prima era nome_reale_unico, con gli eredi tutti Darkos.
nome_solo_capo="Darkos"
; longevita' (richiesta di Federico del 18/11/2026): generali, principi, principesse e agenti della fazione non muoiono
; di vecchiaia (e le principesse non si ritirano) prima di un'eta' tra vecchiaia_minima e vecchiaia_massima, diversa per
; ogni personaggio e stabile; oltre si invecchia come gli altri. Il capo resta immortale (re_immortale).
vecchiaia_minima=100
vecchiaia_massima=150
; nuove nozze del capo (richiesta di Federico del 20/11/2026): Darkos non muore, ma passata l'eta' delle nascite
; (eta_capo_max di personaggi.cfg) restava senza figli ed eredi. Oltre quell'eta' si risposa con una nobildonna giovane
; ogni nozze_capo_ogni_min..nozze_capo_ogni_max anni (la prima volta subito) e per nozze_capo_anni_fertili anni dopo
; le nozze puo' avere figli con la probabilita' normale (p_nascita). PROVVISORIE le quantita'.
nozze_capo_ogni_min=20
nozze_capo_ogni_max=30
nozze_capo_anni_fertili=10
; figli dello stesso sesso di fila al massimo (richiesta di Federico del 22/11/2026: nascevano principi ma mai
; principesse; era il caso, 5 maschi di fila). Superata la serie il figlio successivo e' dell'altro sesso. 0 = nessun limite.
nascite_stesso_sesso_max=2
; titolo del capo al posto di «re» (richiesta di Federico del 16/11/2026): nella barra, nelle schede e nei messaggi
titolo_capo="Imperatore Dio"
; religione della fazione al posto di quella dello startpos (richiesta di Federico del 16/11/2026): il Culto Imperiale,
; che per ora usa edifici e agenti dei cattolici. Gli Auror escono dal Papato (niente scomunica, niente crociate bandite
; da loro) e per le crociate degli altri sono una fazione non cattolica. Solo in modalita' Auror.
religione="REL_IMPERIAL"
; cariche di corte proprie (richiesta di Federico del 21/11/2026, ADR-115: erano ancora quelle dei Danesi): edificio della
; carica -> nome nella forma dei dati, in inglese («Carica of Luogo»), tradotto in italiano da data/cariche.cfg. Stessi
; edifici e bonus dell'AddOffice dell'installazione; solo in modalita' Auror (Scenario.apply_office_names).
cariche={
"royal_palace": "Grand Chamberlain of the Dragon Throne",
"constables_palace": "Master of the Dragon Steeds",
"marshals_palace": "Marshal of the Dragon Legions",
"chancellery": "High Chancellor of the Empire",
"admiralty": "Grand Admiral of the Dragon Fleet",
"cathedral": "High Priest of the Imperial Cult"
}
; armi da fuoco e caracche disponibili da subito (invenzioni tolte dai prod)
armi_da_fuoco_subito=true
; caracche solo degli Auror e potenziate: non piu' dal 16/11/2026 (richiesta di Federico, ADR-076): la caracca torna quella
; della XL originale e il suo posto lo prende la Fregata del Drago (data/unita_auror.cfg)
caracche_solo_auror=false
;
; Potenziamenti portati dal gioco originale (patch exe del 9/11, scheda MTW del Second Brain):
; ogni pila della fazione nasce con questo valore (reclute, eserciti iniziali, mercenari, crociate;
; nell'originale esperienza 0x200 in CreateUnit). Mai sotto il valore che avrebbe comunque.
valore_iniziale=9
; livello di armi e armatura di ogni pila di terra della fazione (0-4: ferro, bronzo, argento, oro; richiesta di Federico
; del 13/11: gli Auror partono con gli edifici al massimo e hanno tutto in oro). Vale per le pile nuove e, a ogni fine
; anno e al caricamento di un salvataggio, per quelle che avessero un livello piu' basso. Mai sotto il livello che avrebbero.
armi_armatura_iniziali=4
; passaggi della coda di reclutamento per provincia in un anno: con 5 si completano fino a 5 unita'
; da un anno per provincia e le unita' piu' lunghe vanno 5 volte piu' veloci (nell'originale tutta la coda
; a ogni turno). Con la coda ripetuta ogni unita' completata si ripaga, quindi fino a 5 pagamenti l'anno.
reclutamenti_per_anno=5
; i passaggi in piu' valgono solo quando la fazione e' del giocatore (come nell'originale)
reclutamenti_solo_giocatore=true
; arruolano OGNI truppa e nave del gioco, senza limiti di fazione, epoca, regione e cultura (richiesta di Federico
; dell'11/11: gli Auror e solo loro). Restano gli edifici richiesti, il porto per le navi e il costo.
tutte_le_unita=true
; edifici equivalenti per i requisiti delle unita' (richiesta di Federico del 23/11/2026: nelle regioni degli Auror si
; arruola ogni truppa tranne i contadini): le truppe delle fazioni nuove che chiedono il tempio del Dharma o il santuario
; pagano, che il Culto Imperiale non puo' costruire, accettano in alternativa la chiesa. Solo in modalita' Auror.
; La moschea dal 27/11/2026, per i ghazi dei Karakhanidi.
requisiti_equivalenti={
"DHARMA_TEMPLE": "CHURCH",
"PAGAN_SHRINE": "CHURCH",
"MOSQUE": "CHURCH"
}
; emissari, spie, assassini, religiosi, inquisitori e principesse della fazione nascono e restano al valore massimo
; degli agenti (valore_max di agenti.cfg, 10 stelle; richiesta di Federico del 13/11): per gli assassini e' il numero
; di stelle che alza la probabilita' contro generali, nobili ed eredi. Vale anche per gli agenti gia' in gioco.
agenti_al_massimo=true
; gli ammiragli delle flotte della fazione hanno sempre il massimo delle stelle (stelle_max di [ammiragli] in scontri.cfg;
; richiesta di Federico del 13/11, ADR-056)
ammiragli_al_massimo=true
; i generali nati da truppe di altre fazioni (gli Auror arruolano ogni unita') prendono nome e ritratto della fazione
; dell'unita': una truppa giapponese che diventa generale e' un giapponese (richiesta di Federico del 22/11/2026)
generali_dalle_unita=true
; le flotte della fazione non subiscono le tempeste: nessuna nave affonda (richiesta di Federico del 23/11/2026)
flotte_immuni_tempeste=true
