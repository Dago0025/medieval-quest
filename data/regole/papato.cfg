; Regole del Papato, delle scomuniche, delle crociate e dei jihad della fase 5c (ADR-004, ADR-010: i numeri stanno
; qui, non nel codice). I valori predefiniti di src/sim/papacy_rules.gd sono uguali a questi (un test lo verifica).
; Righe del catalogo: docs/catalogo_meccaniche.md, sezione "Religione e Papato".
;
; Dove non c'e' una fonte la regola e' PROVVISORIA: e' dichiarato accanto al parametro.

[scomunica]
; catalogo (MTW Religion, Media): la fazione cattolica piu' grande che dichiara guerra a un'altra cattolica ha due
; anni per fermarsi (non deve attaccare di nuovo: muovere un esercito in territorio o contro eserciti dell'altra);
; se rispetta il termine, tregua papale di dieci anni (anni interi dopo l'anno della scadenza); altrimenti scomunica.
; Attaccare il Papato = scomunica immediata
anni_avvertimento=2
durata_tregua_papale=10
; catalogo: la scomunica fa perdere influenza e lealta' (valori PROVVISORI). Influenza: punti persi una volta dal
; capo. Lealta': punti dell'obiettivo di lealta' persi dalle province della fazione, moltiplicati per la quota di
; cattolici della provincia (%) / 100
malus_influenza=2
malus_lealta=15

[elezione]
; ADR-072, Federico dal gioco originale: il Papato non ha principi ne' principesse; morto un Papa, l'anno dopo se ne
; insedia un altro, gia' anziano (eta' PROVVISORIA)
elettivo=true
eta_min=50
eta_max=70

[papato]
; ADR-072, Federico dal gioco originale (il catalogo, MTW Papacy, diceva circa ogni dieci anni): distrutto, il Papato
; ricompare con una grande armata dopo un numero di anni a caso tra min e max, nelle sue province d'inizio partita o
; vicino; ignora la soglia di lealta' della riemersione normale. Se le province d'inizio sono di un'altra fazione
; l'armata compare li' come ribelli lealisti del Papato e la deve conquistare. PROVVISORIA l'entita': pile alla prima
; riemersione e pile in piu' a ogni riemersione successiva (k_crescita_esercito), entro il limite degli eserciti
anni_riemersione_min=15
anni_riemersione_max=30
pile_riemersione=8
k_crescita_esercito=2

[crociata]
; spec. fase 5 §5c e ADR-072. Catalogo: fino a 32 unita' (oltre il limite di 16 degli eserciti normali); le soglie di
; zelo sono del catalogo (Bassa)
pile_iniziali=4
zelo_iniziale=80
calo_zelo_anno=5
; in piu' ogni anno senza un bersaglio
calo_zelo_senza_bersaglio=10
; in una provincia della stessa religione (maggioranza) con zelo oltre la soglia l'esercito raccoglie una pila ogni
; zelo_per_pila punti oltre la soglia, al massimo pile_per_zelo (una volta per provincia); PROVVISORIA (ADR-072,
; Federico: nell'originale passando in territori cristiani assorbivano molte piu' unita')
pile_per_zelo=4
soglia_zelo_provincia=40
zelo_per_pila=15
max_pile=32
; sotto questa soglia si perde una pila all'anno; sotto la seconda diserzioni; a quella di scioglimento o meno
; l'esercito si scioglie
soglia_perdite=40
soglia_diserzioni=30
pile_diserzione=2
soglia_scioglimento=20

[esito]
; catalogo (MTW Crusade): conquista = ricompensa di pile di un ordine militare (unita' con l'edificio degli
; ordini nei requisiti, reclutabili dalla fazione) e +1 influenza; fallimento -1. Jihad (catalogo): +1 / -2.
; PROVVISORIA: il jihad non ha ricompensa di pile
pile_ordine=2
pile_ordine_jihad=0
influenza_successo_crociata=1
influenza_fallimento_crociata=1
influenza_successo_jihad=1
influenza_fallimento_jihad=2
edificio_ordini="CHAPTER_HOUSE"

[doni]
; catalogo (StrategyWiki, Bassa): 1.000 fiorini ai cattolici con abbastanza sacerdoti; trigger ignoto, PROVVISORIA:
; ogni anno, a una fazione cattolica non scomunicata con almeno min_religiosi religiosi cattolici dei tipi elencati
; (con il Papato vivo), con probabilita' p_dono
min_religiosi=3
tipi=["BISHOP", "PRIEST"]
p_dono=0.05
importo=1000
