; Regole economiche e di turno della fase 2 (ADR-004: i numeri stanno qui, non nel codice).
; I valori predefiniti di src/sim/rules.gd sono uguali a questi (un test lo verifica).
; Righe del catalogo: docs/catalogo_meccaniche.md, sezioni Economia, Edifici e reclutamento,
; Movimento e flotte. Le regole senza formula documentata sono segnate PROVVISORIA.

[calendario]
; anno in cui la partita finisce (fine anno che porta a questo anno = partita finita)
anno_finale=1700

[agricoltura]
; scala annua dei valori dei file: valore settimanale x 100 -> x 0,52 (catalogo r.34)
scala_annua=0.52
; famiglia di edifici delle coltivazioni (tipo FARM_INCOME nel file edifici)
famiglia_terreno="IMPROVED_FARMLAND"
; moltiplicatore per livello delle coltivazioni, dal livello 0 (nessuna coltivazione) al 4
; (catalogo r.35: Terreno I-IV = 120/140/160/180%; coincide con la colonna rendita del file)
moltiplicatori_terreno=[1.0, 1.2, 1.4, 1.6, 1.8]

[tassa]
; livello predefinito (2 = normale)
predefinita=2
; moltiplicatori dei livelli 0-4 (catalogo r.33: i reali sono 75/90/100/110/125%, il manuale dice 30-70%)
moltiplicatori=[0.75, 0.9, 1.0, 1.1, 1.25]

[miniere]
; famiglie del tipo LEV1_INCOME nel file edifici; rendita fissa per livello, senza tassa (catalogo r.42)
famiglie=["COPPER_MINE", "SILVER_MINE", "GOLD_MINE", "SALT_MINE"]
; PROVVISORIA (catalogo r.42): la rendita del file e' sommata cosi' com'e' (x1,0);
; se risultasse da scalare come le coltivazioni il valore giusto sarebbe 0,52
scala=1.0

[commercio]
; famiglie del tipo TRADING_POST nel file edifici (Trading Post, Merchant, Guild, Master)
famiglie=["MERCHANT"]
; PROVVISORIA (catalogo r.39): moltiplicatore per livello 1-4
moltiplicatori=[1.0, 1.2, 1.4, 1.6]
; PROVVISORIA (catalogo r.38, r.41): fattore di regola sulla somma dei valori delle merci
fattore=1.0
; edificio porto richiesto per il commercio via mare (tipo PORT nel file edifici)
famiglia_porto="PORT"
; commercio locale: le merci vendute nella provincia con l'edificio commerciale, anche senza porto (manuale p22: le province
; dell'entroterra possono alimentare solo il commercio locale; wiki MTW Trade)
locale_senza_porto=true
; commercio marittimo (manuale p22, richiesta di Federico del 2026-11-13): con porto ed edificio commerciale, una catena di
; flotte proprie (anche di una nave) che parte da una zona di mare confinante e prosegue di zona in zona collega la provincia
; ai porti delle province straniere confinanti con quelle zone; una zona con una flotta di una fazione in guerra e' chiusa.
; Ogni porto straniero (neutrale o alleato, mai della stessa fazione, dei ribelli o in guerra) compra le merci che non ha.
marittimo=true
; PROVVISORIA: quota del valore delle merci (x scala annua x edificio x fattore x acume) incassata per ogni porto raggiunto
quota_marittima=1.0
; PROVVISORIA: imposta d'importazione sulle merci dei porti raggiunti che la provincia non ha (SetImportPercentage = 20%,
; secondo la wiki «probabilmente non corretta»); basta il porto
quota_importazione=0.2
; PROVVISORIA (richiesta di Federico del 2026-11-13): ogni porto raggiunto conta, ma pesa secondo la sua ricchezza. Valore
; economico del partner = agricoltura (rendita base x scala x fattorie) + miniere + commercio locale, senza tasse ne' acume;
; peso = valore / valore_riferimento_partner, al massimo peso_massimo_partner. Si applica alle merci vendute e alle
; importazioni. All'inizio della campagna i porti valgono 64-540 (mediana 283: peso 0,13-1,1), le province sviluppate
; molto di piu'. valore_riferimento_partner=0: ogni porto vale 1.
valore_riferimento_partner=500.0
peso_massimo_partner=2.0

[mantenimento]
; PROVVISORIA (catalogo r.43): moltiplicatore del costo di mantenimento del file unita'
; (colonna "per stagione"; il catalogo indica 22-60 fiorini/anno per unita', i file hanno 2-50)
moltiplicatore=1.0

[eserciti]
; unita' massime per esercito o flotta (catalogo r.85 e r.89: 16 nell'originale; 20 su richiesta di Federico del 22/11/2026)
max_pile=20

[code]
; slot di costruzione e di addestramento per provincia (catalogo r.69)
costruzione=4
reclutamento=5

[demolizione]
; manuale p37 «Distruggere strutture»: pulsante Distruggi nella scheda dell'edificio, «ti verra' restituita una parte del
; prezzo di costruzione» (campagna vichinga: «solo la meta' del suo valore»). PROVVISORIA: quota del costo del livello tolto.
rimborso=0.5

[conquista]
; PROVVISORIA (forum totalwar.org t-28232, nessuna formula nota): quando una provincia cambia mano ogni famiglia di edifici
; costruita perde un livello con probabilita' probabilita_edificio - protezione_per_livello_castello x livello del castello,
; mai sotto probabilita_minima, per il moltiplicatore del modo (campo: provincia presa senza assedio; assedio: castello preso;
; porte: una spia apre le porte; corruzione: guarnigione corrotta, perde solo gli edifici dell'altra religione)
probabilita_edificio=0.35
protezione_per_livello_castello=0.02
probabilita_minima=0.05
modo_campo=1.0
modo_assedio=1.0
modo_porte=0.4
modo_corruzione=0.0
; con un assedio il castello perde un livello con questa probabilita' (il castello resta almeno al primo livello)
castello_perde_un_livello=0.5
; chiese, moschee e gli altri edifici di una religione diversa da quella del conquistatore vanno sempre persi
religione_diversa_distrutta=true
