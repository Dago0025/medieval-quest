; Mercenari (fase 8d, catalogo «Mercenari»: locanda, disponibili subito, non riaddestrabili). ADR-004: i numeri stanno qui;
; i valori predefiniti di src/sim/mercenary_rules.gd sono uguali (un test lo verifica). Tutti PROVVISORI: l'originale non
; documenta prezzi ne' frequenze. Le unita' candidate sono quelle con la colonna 49 = YES del file unita' (105 nella XL),
; dell'epoca in corso e ammesse nella regione e nella sua cultura. Il richiamo di una provincia e' `base` + il magnetismo
; degli edifici (colonna 24 dei livelli, locande e taverne) + `hub` se ha un edificio di una famiglia «hub» (colonna 25).

[comparsa]
; nuove compagnie che compaiono ogni anno su tutta la mappa
nuove_per_anno=8
richiamo_base=1
richiamo_hub=6
; compagnie al massimo in una provincia
max_per_provincia=4

[vita]
; anni prima che una compagnia non assoldata si sciolga
durata_massima=6
; probabilita' annua che una compagnia passi a una provincia confinante (scelta col richiamo)
prob_spostamento=0.3

[costi]
; costo di ingaggio = costo dell'unita' x fattore; mantenimento = mantenimento dell'unita' x fattore
fattore_ingaggio=1.5
fattore_mantenimento=2.0

[congedo]
; Manuale p26 e p70: le unita' congedate non spariscono, diventano compagnie di mercenari che chiunque possieda la provincia
; puo' assoldare (anche un nemico, se la conquista). Valgono per le truppe di terra, nella provincia in cui si trovano, con
; gli uomini e il valore che avevano; si sciolgono come le altre dopo `durata_massima` anni. Le navi spariscono.
; false = le unita' congedate spariscono e basta.
diventano_mercenari=true
