; Mercenari (fase 8d, catalogo «Mercenari»: locanda, disponibili subito, non riaddestrabili). ADR-004: i numeri stanno qui;
; i valori predefiniti di src/sim/mercenary_rules.gd sono uguali (un test lo verifica). Tutti PROVVISORI: l'originale non
; documenta prezzi ne' frequenze. Le unita' candidate sono quelle con la colonna 49 = YES del file unita' (105 nella XL),
; dell'epoca in corso e ammesse nella regione e nella sua cultura. Il richiamo di una provincia e' `base` + il magnetismo
; degli edifici (colonna 24 dei livelli, locande e taverne) + `hub` se ha un edificio di una famiglia «hub» (colonna 25).

[comparsa]
; nuove compagnie che compaiono ogni anno su tutta la mappa
nuove_per_anno=8
richiamo_base=1
richiamo_hub=6
; compagnie al massimo in una provincia
max_per_provincia=4

[vita]
; anni prima che una compagnia non assoldata si sciolga
durata_massima=6
; probabilita' annua che una compagnia passi a una provincia confinante (scelta col richiamo)
prob_spostamento=0.3

[costi]
; costo di ingaggio = costo dell'unita' x fattore; mantenimento = mantenimento dell'unita' x fattore
fattore_ingaggio=1.5
fattore_mantenimento=2.0

[congedo]
; Manuale p26 e p70: le unita' congedate non spariscono, diventano compagnie di mercenari che chiunque possieda la provincia
; puo' assoldare (anche un nemico, se la conquista). Valgono per le truppe di terra, nella provincia in cui si trovano, con
; gli uomini e il valore che avevano; si sciolgono come le altre dopo `durata_massima` anni. Le navi spariscono.
; false = le unita' congedate spariscono e basta.
diventano_mercenari=true

[mondo]
; ADR-116 (21/11/2026, unita' coerenti con la storia di ogni popolo): nelle regioni della mappa del mondo lontane
; dall'Europa e dal mondo islamico compaiono solo i mercenari del posto, cioe' le unita' che elencano la regione
; (ronin e wako in Giappone e Cina, tlaxcaltechi in Mesoamerica, cañari nelle Ande, tuareg e moschettieri turchi attorno
; al Kanem, mercenari siamesi nel Sud-est asiatico, arcieri a cavallo mongoli a nord della Cina, da data/unita_mondo.cfg).
; Steppe occidentali, Persia, Arabia, India del nord, Etiopia, Somalia e Sahara restano aperti alle compagnie della XL.
solo_mercenari_locali = ["ID_TIBET", "ID_AMDO", "ID_TANGUT", "ID_LIAO", "ID_MANCHURIA", "ID_AMUR", "ID_MONGOLIA", "ID_EAST_MONGOLIA", "ID_BAIKAL", "ID_YAKUTIA", "ID_CHUKOTKA", "ID_KAIFENG", "ID_SHAANXI", "ID_SICHUAN", "ID_JIANGNAN", "ID_HUGUANG", "ID_FUJIAN", "ID_LINGNAN", "ID_DALI", "ID_KOREA", "ID_KYUSHU", "ID_KINAI", "ID_TOHOKU", "ID_DAI_VIET", "ID_CHAMPA", "ID_KHMER", "ID_BAGAN", "ID_SRIVIJAYA", "ID_JAVA", "ID_BORNEO", "ID_PHILIPPINES", "ID_MOLUCCAS", "ID_NEW_GUINEA", "ID_WEST_AUSTRALIA", "ID_NORTH_AUSTRALIA", "ID_EAST_AUSTRALIA", "ID_NEW_ZEALAND", "ID_BENGAL", "ID_KALINGA", "ID_DECCAN", "ID_CHOLA", "ID_CEYLON", "ID_KITARA", "ID_DARFUR", "ID_KANEM", "ID_HAUSA", "ID_YORUBA", "ID_AKAN", "ID_GAO", "ID_MALI", "ID_GHANA", "ID_CONGO", "ID_LUBA", "ID_ZIMBABWE", "ID_SOUTHERN_AFRICA", "ID_MADAGASCAR", "ID_SWAHILI", "ID_VINLAND", "ID_HUDSON", "ID_DENE", "ID_ALASKA", "ID_CALIFORNIA", "ID_CHACO", "ID_PLAINS", "ID_GREAT_LAKES", "ID_MISSISSIPPI", "ID_APPALACHIA", "ID_TOLLAN", "ID_MAYA", "ID_CENTRAL_AMERICA", "ID_CARIBBEAN", "ID_MUISCA", "ID_AMAZONIA", "ID_BRAZIL", "ID_CHIMU", "ID_CUZCO", "ID_TIWANAKU", "ID_PAMPAS", "ID_CHILE", "ID_PATAGONIA"]
