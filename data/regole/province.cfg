; Regole delle province della fase 4b (ADR-004: i numeri stanno qui, non nel codice): lealta', rivolte,
; propagazione, riemersione delle fazioni, guerra civile e lealta' dei generali.
; I valori predefiniti di src/sim/province_rules.gd sono uguali a questi (un test lo verifica).
; Righe del catalogo: docs/catalogo_meccaniche.md, sezioni "Province e lealta'" e "Personaggi e dinastie".
; Dove non c'e' una fonte la regola e' PROVVISORIA: e' dichiarato accanto al parametro. I valori iniziali
; sono stati misurati in Python sulla mappa reale (EARLY_XL.TXT): senza ordini circa 10 rivolte in 200 anni,
; con tasse massime in sei reami circa 29.

[lealta]
; PROVVISORIA (catalogo r.62: valore base non pubblicato). Con 100 e senza tasse alte quasi tutte le province
; reali stanno sopra 100; restano sotto solo le lontane o di religione diversa e senza guarnigione.
base=100
; PROVVISORIA: limite superiore della lealta' corrente e dell'obiettivo
massima=200
; PROVVISORIA (catalogo r.62: «adattamento lento verso il valore-obiettivo»): frazione del divario colmata
; ogni anno, con almeno un punto di movimento
deriva=0.2
; catalogo r.55 (confidenza Media): +25/+10/0/-10/-25 per il livello di tassa 0-4
termini_tassa=[25, 10, 0, -10, -25]
; catalogo r.56 (confidenza Media): +16 ogni 100 uomini di eserciti del proprietario nella provincia
guarnigione_per_100=16
; PROVVISORIA: limite del termine della guarnigione (300 uomini)
guarnigione_max=48
; PROVVISORIA (catalogo r.54 «religione»): regione di religione diversa da quella della fazione
penalita_religione=15
; PROVVISORIA (catalogo r.54 «distanza dal capo»): per passo sulla mappa di terra dalla regione del capo
penalita_distanza=3
distanza_max=8
; PROVVISORIA (catalogo r.54 «terrore del governatore»): per punto di terrore efficace del governatore
terrore_per_punto=2
; PROVVISORIA: moltiplicatore della tabella [ribellione_regionale]
scala_ribellione_regionale=1.0
; PROVVISORIA: una provincia appena conquistata parte al massimo da questa lealta'
lealta_conquista=70

[occupazione]
; PROVVISORIA (ADR-070, richiesta di Federico 15/11: «i territori occupati necessitavano di truppe per garantire la
; fedelta'»). Una provincia passata a una fazione diversa da quella che la possedeva all'inizio della campagna perde
; `penalita` punti di lealta', meno `calo_annuo` per ogni anno di possesso, piu' `padrone_vivo` finche' la fazione
; originaria esiste. Le province ribelli all'inizio non contano. Con la penalita' piena servono circa 200-300 uomini
; di guarnigione (o tasse basse) per restare sopra la soglia di rivolta.
penalita=20
calo_annuo=1.0
padrone_vivo=10

[ribellione_regionale]
; catalogo r.59 (confidenza Media): punti di lealta' sottratti. Non si legge da SetRegionRebels: nel file
; reale quel comando e' un indice (0-92) dei nomi dei ribelli, non una percentuale.
ID_LIVONIA=40
ID_PORTUGAL=40
ID_LITHUANIA=30
ID_PRUSSIA=20
ID_SCOTLAND=20
ID_IRELAND=10
ID_KHAZAR=10
ID_POMERANIA=10
ID_SERBIA=10

[religione_cultura]
; religione di ogni cultura di regione (la religione delle fazioni e' in SetReligion)
CATHOLIC_CULTURE="REL_CATHOLIC"
ORTHODOX_CULTURE="REL_ORTHODOX"
MUSLIM_CULTURE="REL_ISLAMIC"
PAGAN_CULTURE="REL_PAGAN"

[rivolta]
; manuale p22 (confidenza Alta): sotto 100 puo' scoppiare una rivolta
soglia=100
; PROVVISORIA: probabilita' annua = k_rivolta x (soglia - lealta'), al massimo p_massima
k_rivolta=0.01
p_massima=0.5
; PROVVISORIA (specifica 4b «proporzionato alla rendita»): uomini ribelli = rendita base della regione x
; ribelli_per_rendita, tra ribelli_min e ribelli_max, in pile della truppa ribelle piu' economica
ribelli_per_rendita=0.5
ribelli_min=100
ribelli_max=600
; PROVVISORIA: sotto questa lealta' i ribelli sono «banditi» (etichetta del manuale p24)
soglia_banditi=50
; ADR-070: in una provincia tolta a un'altra fazione (o non piu' del padrone originario) i ribelli sono «lealisti»
; del padrone precedente; se prendono la provincia la consegnano a lui con l'esercito, o lo fanno riemergere
lealisti=true

[propagazione]
; PROVVISORIA (manuale p24: «le rivolte si estendono alle province vicine», nessun numero)
p_propagazione=0.25
; PROVVISORIA: solo le province confinanti sotto questa lealta'
soglia=110

[riemersione]
; manuale p22 (confidenza Alta) e catalogo r.53: una fazione estinta riemerge in una provincia ribelle che
; possedeva, sotto 120; mai per il giocatore
soglia=120
; PROVVISORIA: probabilita' annua per fazione estinta con una provincia adatta (0.02 fino al 15/11: in 200 anni
; di prova nessuna riemersione). Dal 15/11 valgono anche le province ribelli che la fazione aveva all'inizio
p_riemersione=0.1
; PROVVISORIA: pile dell'esercito creato se nella provincia non ci sono eserciti ribelli da arruolare
pile=3
; PROVVISORIA: tesoro minimo della fazione riemersa
tesoro=1000

[guerra_civile]
; manuale p33 e catalogo r.131: generali con lealta' <= 3 (confidenza Alta per la struttura)
lealta_sleale=3
; PROVVISORIA: la guerra civile si innesca se almeno sleali_min generali, e almeno questa quota di tutti,
; sono sleali
quota_sleali=0.5
sleali_min=2
; PROVVISORIA: comando minimo del promotore (generale forte e sleale in una provincia diversa dal capo)
comando_promotore=5
; PROVVISORIA: probabilita' annua quando c'e' l'innesco. I generali sleali, i loro eserciti e le province
; che governano passano ai ribelli (la divisione completa con scelta del lato arriva piu' avanti).
p_guerra_civile=0.25

[lealta_generali]
; PROVVISORIE (specifica 4b: «scende con tasse alte, sconfitte, revoca dei titoli; sale con titoli e
; influenza del capo»; la revoca e' in personaggi.cfg [titoli]). Ogni anno si somma una pressione intera;
; ogni pressione_per_punto punti la lealta' (0-10) cambia di uno. Auror: fedelta' fissa (auror.cfg).
pressione_per_punto=4
; chi governa una provincia
titolo=1
; reame con piu' della meta' delle province a tassa alta (personaggi.cfg [terrore])
tassa_alta=1
; per ogni sconfitta del generale come comandante
sconfitta=1
; influenza del capo >= influenza_alta: pressione positiva; <= influenza_bassa: negativa
influenza=1
influenza_alta=7
influenza_bassa=3
