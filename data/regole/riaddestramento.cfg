; Regole del riaddestramento delle unita' (ADR-004, ADR-010: i numeri stanno qui, non nel codice).
; I valori predefiniti di src/sim/retrain_rules.gd sono uguali a questi (un test lo verifica).
; Righe del catalogo: docs/catalogo_meccaniche.md, «Mercenari» e «Ordini militari»; sezione di reclutamento (manuale p26).
;
; Meccanica dell'originale (manuale p26, guida C2 del totalwar.org): una pila decimata torna all'organico pieno pagando,
; nella provincia dove si trova, se li' si potrebbe reclutare la stessa unita' (stessi edifici, cultura e regione).
; Non si riaddestrano: Crociata e Jihad, navi e agenti, e le unita' che li' oggi non si potrebbero reclutare. La colonna 49
; dei dati («mercenario» = YES) indica solo che l'unita' puo' comparire tra i mercenari e non esclude (vale anche per gli
; Spearmen); gli ordini militari, reclutabili nella mod Auror con la Chapter House, si riaddestrano dove sono reclutabili. L'ordine si paga subito e si applica nel reclutamento di fine anno; se l'esercito si muove, si
; divide, si unisce, e' distrutto o la provincia cambia padrone, l'ordine e' rimborsato per intero.
;
; Cosa e' PROVVISORIO (nessuna fonte pubblica la formula):
; - il costo proporzionale (costo dell'unita' x uomini mancanti / uomini pieni, per eccesso);
; - il limite di pile per provincia e anno;
; - la diluizione del valore (esperienza): nuovo valore = floor(valore x uomini prima / uomini pieni), cioe' i nuovi
;   arrivati sono reclute senza esperienza (nell'originale non e' documentato se il valore si conserva).

[limiti]
; PROVVISORIA: pile riaddestrabili in una stessa provincia in un anno, contando gli ordini gia' dati.
max_per_provincia=4

[costo]
; PROVVISORIA: fattore sul costo proporzionale (1.0 = costo pieno x quota di uomini mancanti).
fattore=1.0

[ripristino]
; Ripristino delle forze (richiesta di Federico del 2026-11-13, ADR-046): il comando «Ripristina» dell'esercito scelto riporta
; all'organico pieno, a fine anno, tutte le pile che hanno perso uomini, se l'esercito e' fermo in una provincia propria non
; assediata. Si paga subito lo stesso costo del riaddestramento; se l'esercito si muove l'ordine e' rimborsato.
; Scelte di Federico, non dell'originale:
; - edifici_richiesti=false: vale in qualsiasi provincia propria, anche senza gli edifici per reclutare quelle unita';
; - limite_per_provincia=false: tutte le pile insieme, senza il limite di max_per_provincia;
; - mercenari=true: tornano piene anche le compagnie di mercenari.
edifici_richiesti=false
limite_per_provincia=false
mercenari=true
