; Regole della religione della fase 5b (ADR-004, ADR-010: i numeri stanno qui, non nel codice).
; I valori predefiniti di src/sim/religion_rules.gd sono uguali a questi (un test lo verifica).
; Righe del catalogo: docs/catalogo_meccaniche.md, sezione "Religione e Papato".
;
; Dove non c'e' una fonte la regola e' PROVVISORIA: e' dichiarato accanto al parametro.
; Le percentuali di una provincia sono multipli di 0,25 punti (esatti in binario: la somma e' sempre 100); ogni
; punteggio di questo file e' arrotondato a quel passo quando si applica (0,1 diventa 0).
; Le conversioni tolgono punti alle altre religioni in proporzione alla loro quota (metodo del maggior resto).

[composizione]
; PROVVISORIA (i dati non hanno percentuali): la provincia parte al 100% con la religione della sua cultura; se il
; proprietario ne ha un'altra, questa quota (%) va alla religione del proprietario
quota_religione_proprietario=25
zelo_iniziale=50

[deriva]
; catalogo (Man. p41, Alta): deriva lenta verso la fede del sovrano. PROVVISORIA l'entita': punti all'anno che
; passano dalle altre religioni a quella del proprietario. Gli eretici di un proprietario cattolico non derivano
; (l'eresia si spegne con inquisitori e religiosi, altrimenti la deriva annullerebbe la crescita)
deriva=1

[edifici]
; catalogo (MTW Religion, Media): edifici 10% e 15%, interpretati come intensita' (PROVVISORIA). Sono religiosi gli
; edifici con una religione (colonna 14 del file edifici) e una propagazione della fede maggiore di zero
; (colonna 21: chiesa, moschea, monastero, santuario pagano 0,1; cattedrale, grande moschea, monumento pagano 0,15)
conv_edificio=1
conv_edificio_grande=1.5
; un livello con propagazione >= soglia e' «grande»
soglia_fede_grande=0.15

[religiosi]
; catalogo (MTW Religion, Media, conflitto da verificare): agenti 2% o 5%. Si usa la colonna 45 di unit_prod
; («CATHOLIC(2)», «ISLAMIC(5)») quando c'e'; questi valori valgono per i tipi senza colonna (PROVVISORIA)
conv_agente=2
conv_agente_grande=5
tipi_grandi=["CARDINAL", "ULAMA", "ORTHODOX_BISHOP"]

[religione_tipo]
; religione di un tipo di agente quando unit_prod non la dice (PRIEST, sacerdote ortodosso nei dati, usa quella della
; fazione). Il file dei dati ha uno «Shaman» di tipo PRIEST: la colonna 45 gli dice PAGAN(3)
BISHOP="CATHOLIC"
CARDINAL="CATHOLIC"
INQUISITOR="CATHOLIC"
GRAND_INQUISITOR="CATHOLIC"
ORTHODOX_BISHOP="ORTHODOX"
MULLAH="MUSLIM"
ULAMA="MUSLIM"
SHAMAN="PAGAN"
; monaco del Dharma (22/11/2026): tipo PRIEST nel prod come lo sciamano, la colonna 45 gli dice DHARMA(3)
MONK="DHARMA"

[zelo]
; PROVVISORIA: lo zelo (0-100) torna verso il valore neutro di calo_zelo punti all'anno, da sopra e da sotto
zelo_neutro=50
calo_zelo=1
; catalogo (Man. p40): lo zelo sale con religiosi e inquisitori (+2 / +5). Si usa la colonna 44 di unit_prod
; («CATHOLIC(2)») quando c'e'; altrimenti questi valori (PROVVISORIA): religioso della religione del proprietario
zelo_religioso=2
zelo_religioso_grande=5
zelo_inquisitore=2
zelo_gran_inquisitore=5

[eresia]
; catalogo (Man. p42): nasce da eventi, tasse eccessive, scarsa occupazione. PROVVISORIA: in una provincia di un
; proprietario cattolico con tassa >= tassa_alta, o lealta' sotto lealta_sotto, gli eretici (tolti ai cattolici)
; crescono di crescita_eresia punti all'anno
crescita_eresia=1
tassa_alta=3
lealta_sotto=100
; PROVVISORIA: oltre questa % di eretici la rivolta della 4b e' «eretici» e ha probabilita' moltiplicata
soglia_rivolta_eretica=30
moltiplicatore_rivolta_eretica=2.0

[inquisitori]
; catalogo (MTW Inquisitor, Media): gli eretici calano (verso la religione del proprietario) di questi punti
; all'anno per inquisitore (PROVVISORIA l'entita')
conv_inquisitore=3
conv_gran_inquisitore=6
; catalogo: «inquisitori inattivi bruciano la popolazione». PROVVISORIA: per ogni inquisitore del proprietario in
; una provincia senza eretici e senza una missione di processo, la lealta' obiettivo scende di questi punti
malus_inquisitore_inattivo=3

[processo]
; PROVVISORIA (catalogo: successo = rogo, pieta' bassa vulnerabile): p = base + k_pieta * (5 - pieta' del bersaglio),
; limitata a [p_min, p_max]
base_processo=0.3
k_pieta=0.08
p_min_processo=0.05
p_max_processo=0.9
; pieta' attribuita a un agente processato (gli agenti non hanno attributi)
pieta_agente=5
