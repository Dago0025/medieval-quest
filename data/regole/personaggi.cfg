; Regole dei personaggi e delle dinastie della fase 4a (ADR-004: i numeri stanno qui, non nel codice).
; I valori predefiniti di src/sim/dynasty_rules.gd sono uguali a questi (un test lo verifica).
; Righe del catalogo: docs/catalogo_meccaniche.md, sezione "Personaggi e dinastie" (e Acume nell'Economia).
; Le regole degli Auror (comando, fedelta' e influenza fissi, re immortale, nome reale unico) stanno
; in auror.cfg; i vizi e le virtu' in vizi_virtu.cfg.
;
; Dove non c'e' una fonte la regola e' PROVVISORIA: e' dichiarato accanto al parametro.

[attributi]
; scala degli attributi: 0..massimo (l'eseguibile usa 0..9, la specifica 0..10; catalogo "Attributi")
massimo=10

[invecchiamento]
; catalogo "Morte per eta'" + logica ricavata dall'eseguibile (scheda MTW del Second Brain):
; soglia = eta_vecchiaia + casuale intero 0..scarto_soglia, piu' bonus_sangue_reale per sangue reale ed eroi.
eta_vecchiaia=40
scarto_soglia=4
bonus_sangue_reale=10
; oltre la soglia la probabilita' annua e' (eta - soglia + k_morte) / divisore_morte
divisore_morte=50
; PROVVISORIA: nell'eseguibile c'e' un piccolo k non ricavato, qui 0
k_morte=0.0

[nascite]
; PROVVISORIA (catalogo "Nascite": casuali, nessuna probabilita' nota): un capo tra eta_capo_min e
; eta_capo_max anni (inclusi) ha ogni anno probabilita' p_nascita di un figlio, maschio con p_maschio.
; Misurato in Python con la regola di morte sopra: 0,25 da' circa 7 successioni in 200 anni
; e una famiglia su cinque estinta nello stesso periodo.
p_nascita=0.25
eta_capo_min=18
eta_capo_max=55
p_maschio=0.5

[maggiore_eta]
; manuale p17-p18 e catalogo "Eta' degli eredi": i figli maschi ereditano a 16 anni, le principesse
; sono maritabili a 15 e spariscono da anziane (32 wiki, 34-35 giocatori: si usa 32, specifica)
eta_principe=16
eta_principessa=15
eta_ritiro_principessa=32

[successione]
; PROVVISORIA (catalogo "Ereditarieta' delle statistiche": entro 3-4 punti da quelle del re)
scarto_attributi=3
; manuale p16: quasi tutta l'influenza del capo scompare con la sua morte (PROVVISORIA il valore di partenza)
influenza_successore=2

[iniziali]
; PROVVISORIE: nessun dato nei file (SetStartLeader non contiene eta' ne' attributi).
influenza_capo=5
eta_capo_min=30
eta_capo_max=45
attributo_capo_min=2
attributo_capo_max=5
eta_generale_min=25
eta_generale_max=45
; "attributi casuali bassi" della specifica per i generali generati
attributo_generale_min=0
attributo_generale_max=3
lealta_generale_min=4
lealta_generale_max=8
; manuale p17: gli eredi sono sempre leali (PROVVISORIA il valore)
lealta_figli=8
eta_eroe_min=25
eta_eroe_max=40

[influenza]
; catalogo "Variazioni dell'influenza": perdere 2 province -1, conquistarne 2 +1
province_per_punto=2

[generali]
; specifica 4a "Generali" (PROVVISORIE): dopo una vittoria il comandante guadagna una stella con
; p_stella_vittoria, dopo una sconfitta ne perde una con p_stella_sconfitta (non vale per i comandi fissi)
p_stella_vittoria=0.2
p_stella_sconfitta=0.15

[titoli]
; specifica 4a "Comandi" (PROVVISORIA il valore): lealta' persa da chi si vede revocare il titolo
calo_lealta_revoca=2

[terrore]
; PROVVISORIE: innesco della catena Dread (vizi_virtu.cfg, contatore anni_tassa_alta): un anno conta se
; piu' di quota_province_tassa_alta delle province del capo hanno tassa almeno al livello_tassa_alta (0-4)
livello_tassa_alta=3
quota_province_tassa_alta=0.5

[economia]
; catalogo "Acume" (confidenza Media): governatore +10% di agricoltura e commercio per punto,
; re +2% per punto su tutto il reame (una pagina del catalogo dice +1%). PROVVISORIA: i due bonus si sommano.
acume_governatore=0.10
acume_re=0.02
