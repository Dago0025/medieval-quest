; Regole degli agenti della fase 5a (ADR-004, ADR-010: i numeri stanno qui, non nel codice).
; I valori predefiniti di src/sim/agent_rules.gd sono uguali a questi (un test lo verifica).
; Righe del catalogo: docs/catalogo_meccaniche.md, sezione "Agenti e diplomazia".
;
; Dove non c'e' una fonte la regola e' PROVVISORIA: e' dichiarato accanto al parametro.

[reclutamento]
; PROVVISORIA: valore di un agente reclutato = valore_base + valore_per_livello * (livello dell'edificio
; produttore - 1); il livello e' quello piu' alto tra i requisiti soddisfatti dell'unita'
valore_base=1
valore_per_livello=1
; PROVVISORIA: valore degli agenti presenti nello startpos (emissari)
valore_iniziale_startpos=2
; catalogo: massimo e soglie non documentati. PROVVISORIA
valore_max=10

[crescita]
; catalogo (Media): il valore cresce con successi, attentati sopravvissuti, catture. PROVVISORIA l'entita'.
crescita_valore=1

[corruzione]
; PROVVISORIA (catalogo, confidenza Bassa: campioni 2.000 - 70.000):
; prezzo = k_prezzo * somma(costo * uomini / uomini base) * (1 + lealta' comandante / 10) * (1 + comando / 10)
k_prezzo=3.0
; PROVVISORIA: accettazione p = p_base - k_lealta * lealta' del comandante + k_valore * valore dell'emissario
p_base=0.9
k_lealta=0.08
k_valore=0.03
p_min=0.05
p_max=0.95

[assassinio]
; catalogo (Media): tabella a 16 gradini, in percentuale
gradini=[0, 7, 10, 14, 17, 24, 34, 50, 66, 76, 83, 86, 90, 93, 95, 97]
; catalogo (Media): gradino a valore pari (capo 17%, erede e generale 34%, principessa 50%,
; spia e assassino 66%, religiosi 76%, emissario 83%)
gradino_capo=4
gradino_erede=6
gradino_principessa=7
gradino_spia=8
gradino_religioso=9
gradino_emissario=10
; PROVVISORIA: probabilita' che l'assassino muoia se fallisce
p_morte_fallimento=0.5

[spie]
; PROVVISORIA (catalogo: «+lealta' in casa, instabilita' in terra nemica»): lealta' obiettivo della provincia
bonus_lealta_spia=5
malus_lealta_spia=5
; PROVVISORIA (catalogo: «apre le porte»): probabilita' annua per punto di valore di aprire le porte
; di un castello assediato dalla propria fazione
k_porte=0.05
; missioni delle spie (richiesta di Federico del 18/11/2026, tutte PROVVISORIE): probabilita' = base + k * valore
; spiare una provincia o un esercito nemico: informazioni complete per anni_informazioni anni
base_spionaggio=0.5
k_spionaggio=0.05
anni_informazioni=3
; fomentare il malcontento: la lealta' obiettivo della provincia scende di lealta_malcontento + per_stella * valore
base_malcontento=0.35
k_malcontento=0.06
lealta_malcontento=5
lealta_malcontento_per_stella=2
anni_malcontento=3
; sabotare un edificio (mai il castello): perde un livello; se fallisce la spia puo' morire
base_sabotaggio=0.2
k_sabotaggio=0.05
p_max_sabotaggio=0.8
p_morte_sabotaggio=0.3
; aprire le porte come missione: k_porte * valore * fattore (la sola presenza resta k_porte * valore)
fattore_missione_porte=2.0

[cattura]
; PROVVISORIA (catalogo, confidenza Bassa: gerarchia forte di confine, spia, assassino, emissario;
; tira solo l'agente di valore massimo): p = base + k * (V - valore dell'agente), in [0, p_max]
base_cattura=0.10
k_cattura=0.07
p_max_cattura=0.8
; spie e assassini sono invisibili: meno probabilita' di cattura
malus_invisibile=0.10
; famiglia del forte di confine (colonna 11 del file edifici) e valore per livello (valore = livello * questo)
forte_di_confine="WATCH_TOWERS"
valore_forte_per_livello=2

[matrimonio]
; spec. fase 5a: lealta' del generale sposato dalla principessa (sale fino al massimo degli attributi)
bonus_lealta_matrimonio=2
