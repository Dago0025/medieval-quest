; Regole della vittoria della fase 6b (ADR-004, ADR-011: i numeri stanno qui, non nel codice). Il valore predefinito di
; src/sim/victory_rules.gd e' uguale a questo (un test lo verifica).
; Righe del catalogo: docs/catalogo_meccaniche.md, sezione "Condizioni di vittoria". Le imprese gloriose sono ESCLUSE dal
; remake per scelta di Federico (2026-11-08): si vince solo per dominio, o a pari merito della classifica nell'anno finale.

[dominio]
; Quota delle province di terra che la fazione del giocatore deve controllare per vincere. Fonti: il manuale originale dice
; due terzi delle province (0.6667); la community gioca anche con il 60% (0.6) o con il 100% (1.0). Il numero di province
; necessarie e' la quota per il totale arrotondata a due decimali e poi per eccesso (72 province: 0.6667 -> 48, 0.6 -> 44,
; 1.0 -> 72). Valore ammesso: da 0.01 a 1.0.
; Scelta di Federico (2026-11-08): l'85% delle province (sulle 107 province di terra della campagna: 91).
soglia_dominio=0.85
