; Regole della diplomazia della fase 5a (ADR-004, ADR-010: i numeri stanno qui, non nel codice).
; I valori predefiniti di src/sim/diplomacy_rules.gd sono uguali a questi (un test lo verifica).
; Righe del catalogo: docs/catalogo_meccaniche.md, sezione "Agenti e diplomazia".
;
; Dove non c'e' una fonte la regola e' PROVVISORIA: e' dichiarato accanto al parametro.
; Il catalogo documenta gli stati (alleanza, neutralita', guerra, tregua; niente vassallaggio) e che
; l'accettazione dell'IA cala con la dimensione dell'impero; la formula e la durata delle tregue sono ignote.

[trattati]
; catalogo: «tradire un alleato costa influenza». PROVVISORIA il valore: punti di influenza del capo
; dell'attaccante persi quando attacca un alleato o una fazione con cui ha una tregua.
malus_tradimento=1
; PROVVISORIA (catalogo: durata ignota): anni interi di tregua a partire dall'anno dopo la firma
durata_tregua=6
; catalogo (MTW Diplomacy, «Conflicting Alliances»): se due alleati di una fazione si fanno guerra, la fazione resta alleata di
; uno solo e con l'altro torna neutrale. Nell'originale sceglie il giocatore; qui, PROVVISORIO, resta l'alleanza con chi e'
; attaccato e cade quella con chi attacca, senza perdita di influenza.
alleanze_in_conflitto=true

[accettazione]
; PROVVISORIA (catalogo: formula ignota): p = base + k_influenza*(influenza - influenza_neutra) + k_valore*valore
; + religione + dimensione + guerra, limitata a [p_min, p_max]
p_min=0.05
p_max=0.95
base_alleanza=0.35
base_tregua=0.30
base_matrimonio=0.45
; influenza del capo del proponente che non sposta la probabilita'
influenza_neutra=5
k_influenza=0.04
; per punto di valore dell'agente (emissario o principessa)
k_valore=0.03
bonus_stessa_religione=0.10
malus_religione_diversa=0.15
; catalogo: l'accettazione cala oltre il 25-30% della mappa. Quota di regioni di terra oltre la quale
; si sottrae k_dimensione * (quota - soglia)
soglia_dimensione=0.25
k_dimensione=2.0
; alleanza: il proponente e' in guerra con un alleato del destinatario
malus_guerra_alleati=0.20
; tregua: + k_forza * (forza del proponente / (forza dei due) - 0,5), forza = uomini totali
k_forza=0.6
; tregua, PROVVISORIA: stanchezza della guerra, + k_stanchezza per ogni anno senza svolte (dalla dichiarazione o dall'ultima
; provincia passata di mano tra i due), fino a anni_stanchezza_max anni. Nella prima partita IA contro IA le tregue erano
; rifiutate 10-20 volte ogni 25 anni e le guerre non finivano.
k_stanchezza=0.04
anni_stanchezza_max=10
