; Regole dell'IA della fase 7 (ADR-004, ADR-012: i numeri stanno qui, non nel codice). I valori predefiniti di
; src/ai/ai_rules.gd sono uguali a questi (un test lo verifica).
; TUTTO QUI E' PROVVISORIO: il catalogo non documenta la logica dell'IA di MTW (poche osservazioni: attacca sentendo debolezza,
; rifiuta spesso tregue e nozze, lancia crociate). Fanno eccezione i PESI dei profili per unita' ed edifici, che stanno nei file
; del gioco (unit_prod colonna 14, build_prod colonne 9 e 10) e non in questo file. Tarare con le partite IA contro IA
; (tests/unit/test_ai_partita_lunga.gd stampa le metriche ogni 50 anni).

[generale]
; Difficolta' (facile, normale, difficile, molto_difficile): scala aggressivita', budget e soglie d'attacco (sezioni
; [difficolta_*]). Nessun bonus di risorse. `scenes/campaign_settings.gd` la passa all'IA (costante AI_DIFFICULTY).
difficolta="normale"
; Tempo massimo per pianificare un anno di tutte le fazioni sui dati reali (misurato da test_ai_reale.gd).
budget_ms=200
; Profilo delle fazioni senza SetBehaviour noto.
profilo_predefinito="CATHOLIC_DEFENSIVE"
; Profili di stato (commento dello startpos: «vari fattori di gioco» alterano il comportamento). Priorita': DESPERATE_DEFENCE,
; POVERTY_STRICKEN, CLOSE_TO_SUPPORT_LIMIT. POVERTY_STRICKEN: tesoro sotto questo valore, oppure reddito netto negativo con
; tesoro sotto la riserva.
soglia_poverta=0
; DESPERATE_DEFENCE: forza nemica (fazioni in guerra) entro un passo dalle sue province / forza propria oltre questo rapporto.
rapporto_disperato=2.0
; CLOSE_TO_SUPPORT_LIMIT: mantenimento / reddito oltre questa quota.
limite_mantenimento=0.7
; Riserva di tesoro che l'IA non tocca: fissa piu' tanti anni di mantenimento.
riserva_fissa=300
riserva_anni_mantenimento=1.0
; Fazione ricca: tesoro oltre la riserva piu' tanti anni di reddito. Reinveste ogni anno questa quota dell'eccesso in truppe e
; alza il tetto di mantenimento a `tetto_ricco` (serve a evitare tesori senza fine: le costruzioni finiscono, il reddito no).
anni_tesoro_alto=6.0
quota_eccesso=0.25
tetto_ricco=0.9

[tasse]
; Tassa alta solo se la lealta' prevista resta di questi punti sopra la soglia di rivolta; tassa bassa se la lealta' o
; l'obiettivo sono meno di questi punti sopra la soglia.
margine_alta=25
margine_bassa=8

[costruzioni]
; Punteggio = (peso colonna 9 + influenze colonna 10 + bisogni) x (1 + rumore) / (1 + costo / scala_costo + anni / scala_tempo).
scala_costo=600.0
scala_tempo=6.0
rumore=0.1
punteggio_min=20.0
max_per_anno=3
; Bisogni, in punti-peso: castello nelle province minacciate, felicita' (per punto) nelle province vicine alla rivolta,
; rendita (per punto), edificio commerciale nei porti, porto e cantiere per i profili navali.
bisogno_castello=300.0
bisogno_lealta=40.0
bisogno_reddito=2.0
bisogno_commercio=150.0
bisogno_porto=300.0
; Peso di un edificio o di un'unita' i cui file non hanno la colonna (mondi di prova).
peso_neutro=100.0

[reclutamento]
rumore=0.15
coda_max=2
per_provincia=1
; Tetto delle pile di terra (eserciti e reclute in coda) di una fazione: pile_base + pile_per_provincia x province. Senza tetto il
; mantenimento basso dei dati lascia crescere gli eserciti senza fine (partita di prova: 1400 eserciti e 200.000 uomini nel 1100).
pile_per_provincia=4.0
pile_base=4

[riaddestramento]
; PROVVISORIA: prima del reclutamento la fazione riaddestra (GameCommands.order_retrain, data/regole/riaddestramento.cfg) le pile
; con meno di questa quota dell'organico pieno, negli eserciti di terra fermi nelle sue province e non assediate. Il costo
; rientra nel budget annuo del reclutamento (quota_truppe); le pile decimate contano comunque in parte nel tetto delle pile.
soglia_ia=0.7

[mercenari]
; PROVVISORIA (fase 8d): dopo il riaddestramento la fazione assolda compagnie di mercenari (data/regole/mercenari.cfg) solo nelle
; sue province minacciate da forze nemiche, le piu' minacciate prima, finche' costo, mantenimento e tetto delle pile lo
; permettono. Il costo rientra nel budget annuo del reclutamento.
max_per_anno=2

[congedo]
; PROVVISORIA (ADR-031, parita' col giocatore): una fazione col tesoro sotto zero e il mantenimento oltre il reddito congeda
; ogni anno poche pile di terra, prima i mercenari e poi le piu' care da mantenere, finche' i conti tornano. Non tocca le
; province minacciate, gli eserciti impegnati e l'ultima pila di una provincia. 0 = l'IA non congeda mai.
max_per_anno=2

[guerra]
; Uomini che la capitale tiene sempre in sede.
uomini_min_capitale=40
; Passi entro cui un esercito interno rinforza una provincia minacciata.
raggio_rinforzi=3
attacchi_max=3
; Rapporto di forza (assediante / guarnigione x moltiplicatore del castello) per ordinare l'assalto.
soglia_assalto=1.5
; Rapporto per attaccare gli assedianti di una provincia propria.
soglia_soccorso=1.2
; PROVVISORIO (2026-11-09). Ci si barrica nel castello (GameCommands.enter_castle) quando la minaccia nemica supera la difesa
; in campo, rinforzi in arrivo compresi, x bonus del difensore x questo fattore: come il giocatore, e come nell'originale chi
; non puo' vincere in campo si ritira nel castello e costringe all'assedio.
soglia_barricata=1.5
; Soglia d'attacco x questo fattore se il bersaglio e' gia' in guerra con la fazione; x il secondo se e' dei ribelli.
fattore_guerra=0.85
fattore_ribelli=0.7
; PROVVISORIO. Profili con bersagli «guerra» (difensivi, mercanti, stagnanti: quasi tutte le fazioni dello startpos): attaccano
; anche un vicino neutrale, ma con soglia x `fattore_neutrali_prudenti` e con il sorteggio della loro aggressione. Catalogo: l'IA
; attacca quando sente debolezza. Senza questa regola, finite le guerre con le tregue, dopo il 1300 nessuno dichiarava piu' guerra.
fattore_neutrali_prudenti=3.0
; PROVVISORIO. Impero esteso: oltre `soglia_estensione` delle regioni di terra la soglia contro neutrali e alleati si moltiplica per
; 1 + k_estensione x (quota - soglia_estensione). Nelle prove IA contro IA, senza questo freno, una fazione arrivava a 90 province
; nel 1450 e le altre restavano con una provincia ciascuna.
soglia_estensione=0.15
k_estensione=3.0

[navi]
fattore_soglia=1.3
flotte_per_porto=0.5
soglia_flotte=1.5

[personaggi]
titoli_per_anno=2
; cariche di Stato vacanti (AddOffice) date in un anno al personaggio libero con piu' stelle di comando (PROVVISORIA)
cariche_per_anno=2
lealta_min_titolo=4

[diplomazia]
; Fase 7b. PROVVISORIO. Una guerra «va male» se il nemico ha preso almeno `perdite_tregua` province nell'ultimo anno, se assedia una
; provincia propria o se la sua forza entro un passo dalle province proprie supera `rapporto_tregua` volte la forza di terra
; propria: allora un emissario cerca la tregua. I profili non espansionisti la cercano anche senza perdere, con probabilita'
; annua `prob_pace` per guerra.
rapporto_tregua=1.0
perdite_tregua=1
prob_pace=0.12
; Stallo: dopo `anni_stallo` anni di guerra senza svolte (nessuna provincia passata di mano tra i due) ogni profilo, anche
; espansionista, cerca la tregua con probabilita' annua `prob_pace_stallo`. La stanchezza alza anche l'accettazione (diplomazia.cfg).
anni_stallo=8
prob_pace_stallo=0.35
; Alleanza: emissario verso un vicino neutrale che ha un nemico comune (in guerra con lo stesso nemico), con probabilita' annua
; `prob_alleanza`, mai oltre `alleanze_max` alleanze, mai se la probabilita' di accettazione e' sotto `p_min_alleanza`.
prob_alleanza=0.35
alleanze_max=2
p_min_alleanza=0.1
; Nozze: una principessa libera sposa il vicino con cui si vuole un'alleanza; altrimenti, con probabilita' `prob_nozze`, un
; generale della propria fazione con lealta' efficace non oltre `lealta_nozze`.
lealta_nozze=5
prob_nozze=0.5
; Tradimento (solo profili espansionisti): ogni anno, con probabilita' `prob_tradimento`, se conviene attaccare un alleato (rapporto
; di forza sopra la soglia del profilo x `fattore_tradimento`) l'alleanza si rompe attaccandolo.
prob_tradimento=0.12
fattore_tradimento=1.3
; Catalogo (MTW Diplomacy): le alleanze contano poco per l'IA, che attacca anche un alleato quando lo sente debole. Anche i
; profili non espansionisti e non difensivi che attaccano almeno chi e' gia' in guerra (bersagli = guerra) possono tradire, con
; probabilita' `prob_tradimento_altri`. Nella prima partita IA contro IA le alleanze del 1025 restavano ferme per secoli.
prob_tradimento_altri=0.06
; Proposte a un giocatore: l'emissario parte solo con questa probabilita' annua e solo se il giocatore ha meno di
; `proposte_giocatore_max` proposte in attesa.
prob_proposta_giocatore=0.5
proposte_giocatore_max=3
; Passi di terra entro cui un agente cerca la sua destinazione.
raggio_agenti=5

[agenti]
; Fase 7b. PROVVISORIO. Agenti di ogni tipo = tetto x province (arrotondato per eccesso); spesa annua in nuovi agenti = quota del
; reddito; al massimo `nuovi_per_anno` nuovi agenti per fazione e anno. Religiosi e inquisitori solo dove servono.
tetto_emissari=0.15
tetto_spie=0.25
tetto_assassini=0.1
tetto_religiosi=0.2
tetto_inquisitori=0.08
quota_reddito=0.08
nuovi_per_anno=2
; Una provincia con questa % di eretici chiama un inquisitore.
eretici_min=5.0
; Probabilita' minima di riuscita di un assassinio e di accettazione di una corruzione; quota del tesoro oltre la riserva
; spendibile in una corruzione; uomini minimi di un esercito nemico (in guerra) che vale la pena corrompere.
p_min_assassinio=0.35
p_min_corruzione=0.35
quota_corruzione=0.3
uomini_min_corruzione=20

[crociate]
; Fase 7b. PROVVISORIO. Profili che bandiscono una crociata (cattolici) o un jihad (musulmani): ogni anno, con probabilita'
; `prob_crociata`, se non sono scomunicati e c'e' un bersaglio valido entro `raggio_crociata` passi di terra. Il tesoro oltre la
; riserva deve essere almeno `tesoro_crociata` volte il costo.
profili_crociati=["CATHOLIC_EXPANSIONIST_CRUSADER", "CATHOLIC_CRUSADER_TRADER", "CATHOLIC_DEFENSIVE_CRUSADER"]
profili_jihad=["MUSLIM_DEVOUT", "MUSLIM_EXPANSIONIST"]
prob_crociata=0.3
raggio_crociata=6
tesoro_crociata=1.5

[viaggi_agenti]
; PROVVISORIO (ADR-053, specifica «IA: viaggi lunghi degli agenti e commercio navale» del 2026-11-13). Gli agenti rimasti
; senza ordini dopo diplomazia e agenti a corto raggio cercano un obiettivo anche lontano e ci vanno con i viaggi del
; giocatore (`AgentTravel`, a piedi e via mare). Punteggio = valore x comportamento x probabilita' di riuscita (la stessa
; formula della missione) / (1 + peso_tempo x anni di viaggio) x (1 - rischio_per_anno_ostile x anni in terra nemica).
; Scelta di progetto: l'IA dell'originale usa male gli agenti (forum totalwar.org t-153680); qui li usa meglio apposta.
; Anni di viaggio massimi per tipo (oltre, l'obiettivo si scarta).
anni_emissario=8
anni_principessa=8
anni_assassino=6
anni_spia=5
anni_religioso=4
anni_inquisitore=6
peso_tempo=0.15
rischio_per_anno_ostile=0.05
; Punteggio minimo per assegnare un obiettivo.
soglia_assegnazione=10.0
; Inseguimenti di un bersaglio mobile prima di rinunciare; anni oltre cui un ordine scade; un obiettivo nuovo sostituisce
; quello in corso solo se vale piu' di `isteresi` volte tanto.
max_ricalcoli=3
scadenza_ordine=15
isteresi=1.5
max_agenti_per_bersaglio=1
; Passi di terra entro cui un assassino nemico minaccia il capo o l'erede: allora un assassino resta di scorta.
raggio_minaccia=2
; Valore degli obiettivi.
valore_assassinio_capo=100.0
valore_assassinio_erede=80.0
valore_assassinio_generale=40.0
valore_assassinio_agente=15.0
valore_alleanza=50.0
valore_tregua=60.0
valore_matrimonio=45.0
valore_spionaggio=20.0
valore_conversione=25.0
valore_inquisizione=30.0
; Peso degli obiettivi di una fazione del giocatore (domanda aperta della specifica: per ora come le altre).
peso_contro_giocatore=1.0
; Tetto assoluto di agenti per fazione (oltre a quello in proporzione alle province di [agenti]); un obiettivo con punteggio
; sopra la soglia rimasto senza agente chiede un arruolamento entro questo tetto.
tetto_assassini=4
tetto_emissari=3
tetto_spie=3
tetto_inquisitori=2
; Comportamento della fazione: moltiplicatori dei valori (assassinio, diplomazia, commercio) per classe di profilo.
profili_aggressivi=["CATHOLIC_EXPANSIONIST_CRUSADER", "CATHOLIC_EXPANSIONIST", "CATHOLIC_NAVAL_EXPANSIONIST", "ORTHODOX_EXPANSIONIST", "MUSLIM_EXPANSIONIST", "BARBARIAN_RAIDER"]
profili_commerciali=["CATHOLIC_TRADER", "CATHOLIC_CRUSADER_TRADER"]
aggressiva_assassinio=1.3
aggressiva_diplomazia=0.8
aggressiva_commercio=0.9
commerciale_assassinio=0.8
commerciale_diplomazia=1.1
commerciale_commercio=1.4
difensiva_assassinio=0.9
difensiva_diplomazia=1.2
difensiva_commercio=1.1

[commercio_navale]
; PROVVISORIO (ADR-053). Ogni `anni_ripianificazione` anni (o subito se una zona del piano resta senza nave o la chiude una
; flotta nemica) l'IA sceglie le zone di mare da presidiare con una nave ciascuna per massimizzare il commercio marittimo,
; calcolato con la stessa funzione del giocatore (`Economy.trade_breakdown`) in modalita' «ipotesi». Scelta greedy per
; rotta intera (una catena a meta' non rende): guadagno / mantenimento delle navi nuove almeno `soglia_convenienza`.
anni_ripianificazione=3
; Costo aggiunto a una zona con flotte di fazioni in guerra (chiude il commercio finche' non si libera).
costo_zona_contesa=4.0
soglia_convenienza=1.2
; Le flotte nemiche che entrano nelle zone del piano le attacca `AiNavy` con le flotte rimaste libere (soglia_flotte di [navi]);
; il piano si rifa' subito con zone alternative.
; Una rotta senza navi disponibili fa costruire una nave se rende almeno questi denari l'anno.
soglia_costruzione_nave=150.0
; Una nave si assegna solo a una zona che raggiunge in al massimo tanti anni (raggio = zone all'anno, ADR-016: il remake
; non distingue le zone d'alto mare dell'originale).
anni_max_raggiungimento=3
; Diplomazia, peso basso: denari di commercio persi per una guerra -> probabilita' in piu' di cercare la tregua (al massimo
; 0,5); un partner commerciale importante alza il punteggio d'alleanza (al massimo +0,3).
peso_pace_per_rendita_persa=0.002
; Costruzioni: porto ed edificio commerciale nelle province costiere con merci, bisogno x questo fattore.
priorita_porto_mercante_con_merci=1.5

[difficolta_facile]
aggressivita=0.6
budget=0.8
soglia=1.25

[difficolta_normale]
aggressivita=1.0
budget=1.0
soglia=1.0

[difficolta_difficile]
