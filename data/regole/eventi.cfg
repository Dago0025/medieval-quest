; Disastri naturali, Peste Nera e Orda d'Oro della fase 6a (spec. fase 6 par. 6a, ADR-004, ADR-010: i numeri stanno qui, non nel
; codice). I valori predefiniti di src/sim/event_rules.gd sono uguali a questi (un test lo verifica). Gli eventi storici
; stanno in data/eventi/eventi_storici.cfg. Righe del catalogo: docs/catalogo_meccaniche.md, sezione "Eventi".
;
; Dove non c'e' una fonte la regola e' PROVVISORIA: e' dichiarato accanto al parametro.

[inondazione]
; spec.: agricoltura dimezzata per un anno; non nelle regioni SetRegionUnfloodable. Probabilita' PROVVISORIA, per provincia e anno
p_inondazione=0.01
agricoltura_inondazione=0.5

[carestia]
; spec.: agricoltura a zero e lealta' -10 (punti dell'obiettivo di lealta'). Probabilita' PROVVISORIA, per provincia e anno
p_carestia=0.006
lealta_carestia=10

[terremoto]
; spec.: un edificio perde un livello (mai il castello); non nelle regioni SetRegionUnquakeable. Probabilita' PROVVISORIA
p_terremoto=0.003

[tempesta]
; spec.: la flotta perde una pila. Probabilita' PROVVISORIA, per flotta in mare e anno
p_tempesta=0.02

[peste]
; spec.: perdite del 10% degli uomini di eserciti e guarnigioni della regione. Probabilita' e propagazione PROVVISORIE
p_peste=0.004
perdite_peste=0.1
p_propagazione_peste=0.25

[immuni]
; richiesta di Federico del 18/11/2026: l'isola di Atlantide (modalita' Auror) non subisce inondazioni, carestie, peste,
; Peste Nera ne' gli effetti avversi degli eventi storici (eretici; cali di tesoro, lealta' e pieta' per la fazione con la
; capitale sull'isola). I terremoti restano, con la probabilita' comune moltiplicata per fattore_terremoto (poco frequenti).
regioni=["ID_ATLANTIS", "ID_GADEIRA", "ID_AMPHERIA", "ID_MNESEIA", "ID_DIAPREPIA"]
fattore_terremoto=0.25

[peste_nera]
; spec.: una volta sola, nella finestra 1346-1353 (anno estratto con state.rng), da Caffa (Crimea), si propaga per terra e per mare.
; L'evento storico 54 la annuncia. Tutti i parametri tranne la finestra e l'origine sono PROVVISORI
anno_da=1346
anno_a=1353
evento_storico=54
regioni_origine=["ID_CRIMEA"]
perdite=0.25
reddito=0.5
anni_per_regione=2
p_propagazione=0.6
p_via_mare=0.4
anni_massimi=12

[orda]
; catalogo (MTW Eras, Media): l'Orda d'Oro arriva nel 1230. Regioni d'ingresso, pile, durata e tesoro PROVVISORI
fazione="FN_GOLDEN_HORDE"
anno_orda=1230
regioni_ingresso=["ID_KHAZAR", "ID_VOLGA_BULGARIA", "ID_LESSER_KHAZAR"]
pile_orda=8
anni_orda=15
tesoro_orda=3000
