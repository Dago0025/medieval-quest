; Regole degli scontri della fase 3 (ADR-004, ADR-009): i numeri stanno qui, non nel codice.
; I valori predefiniti di src/sim/combat_rules.gd sono uguali a questi (un test lo verifica).
; Righe del catalogo: docs/catalogo_meccaniche.md, sezioni "Movimento e flotte" e
; "Assedi e risoluzione automatica".
;
; TUTTO QUI E' PROVVISORIA: la formula della risoluzione automatica di MTW non e' documentata
; (catalogo r.105: "il computer pesa numero di uomini e vantaggi relativi, ignora la tattica").
; Il manuale e il catalogo fissano solo la struttura (ritirate, sortita, assalto, fame);
; ogni numero va tarato con le prove di docs/laboratorio_scontri.md.

[forza]
; Forza di una pila di terra = uomini x (1 + a x (carica + mischia + difesa) + b x armatura
;                                          + c x valore + d x morale).
; a: peso di carica + mischia + difesa (un punto = +5%).
attacco = 0.05
; b: peso del livello di armatura (ARMOUR_LEVEL).
armatura = 0.05
; c: peso di un livello di valore della pila. Catalogo r.74: ogni livello di valore
; vale +1 attacco, +1 difesa e +2 morale, quindi c = 2a + 2d.
valore = 0.14
; d: peso del bonus di morale dell'unita' (colonna 18 del file unita').
morale = 0.02
; Navi: uomini x (1 + e x attacco navale della colonna 33).
navale = 0.15
; Il fattore di una pila non scende sotto questo valore (carica e difesa possono essere negative).
fattore_minimo = 0.1

[comando]
; f: forza dell'esercito = somma delle pile x (1 + f x stelle del capo).
; Catalogo r.119: ogni due stelle +1 attacco e +1 difesa, quindi f = a.
peso_stella = 0.05
; Stelle dei capi finche' i personaggi non esistono (fase 4): solo gli Auror hanno comando_fisso
; in data/regole/auror.cfg. Qui non ci sono numeri: il lettore li prende da quel file.

[campo]
; g: bonus del difensore in battaglia campale (manuale p45, p69: il terreno favorisce chi difende).
bonus_difensore = 0.15
; Bonus del difensore negli scontri navali (nessuna fonte: nessun bonus).
bonus_difensore_mare = 0.0
; Probabilita' che una pila vincitrice sopravvissuta guadagni un livello di valore.
prob_valore = 0.2
; Livello di valore massimo.
valore_massimo = 9

[perdite]
; Il perdente perde una frazione tra min e max, crescente con Fv / (Fv + Fp).
perdita_min = 0.30
perdita_max = 0.90
; Il vincitore perde: frazione del perdente x (Fp / Fv) x questo fattore (al massimo perdita_max).
fattore_vincitore = 0.5

[castello]
; Famiglia degli edifici del castello nel file edifici.
famiglia = "CASTLE"
; Un grado = Fort, Keep, Castle, Citadel, Fortress; ogni grado ha 3 livelli nel file edifici
; (CASTLE: 15 livelli). Livello 0 = nessun castello.
livelli_per_grado = 3
; Moltiplicatore della forza della guarnigione negli assalti, per grado.
moltiplicatore_assalto = [1.5, 2.0, 2.5, 3.0, 4.0]
; Anni di assedio dopo i quali la guarnigione cede per fame, per grado.
anni_fame = [1, 2, 3, 4, 5]
; Guarnigione massima in unita' (catalogo r.103: 16 unita', i cavalieri contano doppio).
guarnigione_max = 16
peso_cavalleria = 2
; Un assalto vinto annienta la guarnigione (nessuna fonte: PROVVISORIA).
assalto_annienta = true

[assedio]
; La guarnigione fa una sortita se la sua forza supera soglia x la forza degli assedianti.
soglia_sortita = 2.0

[flotte]
; distanza dalla costa (segnalazione di Federico del 18/11/2026, wiki «MTW Ships»): con raggio 1 (galee, dromoni, dhow,
; barche) solo le zone che toccano terra, con 2 anche quelle che confinano con una zona costiera, con 3 ovunque; la flotta
; segue la nave piu' limitata. false = nessun limite
limite_costa = true
; PROVVISORIO (2026-11-09). Zone di mare percorse in un anno = raggio minore tra le navi della flotta (prod unita' col. 33,
; primo valore: galee 1, cocche 2, caracche 3), almeno raggio_minimo. Fonte: manuale, campagna vichinga («un raggio di
; movimento pari a 3 consente di raggiungere rapidamente lontane regioni marine»). Il wiki di totalwar.org lo descrive come
; distanza dalla costa: conflitto chiuso a favore del manuale. Dopo l'evento storico della bussola il raggio cresce di
; bonus_bussola (catalogo: galee 1, 2 dopo la bussola).
raggio_minimo = 1
bonus_bussola = 1
evento_bussola = "bussola"
; Blocco navale (richiesta di Federico, 2026-11-10): una flotta di una fazione non alleata, anche neutrale, chiude la
; zona di mare ai trasporti via mare di truppe delle altre fazioni, anche se vi hanno flotte proprie. Emissari e altri
; agenti non sono fermati dalle flotte neutrali, solo da quelle nemiche (richiesta di Federico, 2026-11-10).
; Nell'originale bloccavano solo le flotte nemiche (false = solo le fazioni in guerra). Vale anche per l'IA.
blocco_neutrali = true
; Agenti via mare senza navi (richiesta di Federico, 2026-11-11): emissari, principesse, spie, assassini e religiosi si
; imbarcano da un proprio porto costruito e sbarcano su qualunque costa raggiungibile per mare, anche se nelle zone non
; c'e' nessuna flotta propria; li ferma solo una flotta di una fazione in guerra. Le truppe hanno sempre bisogno della
; catena di flotte. false = anche gli agenti hanno bisogno delle flotte (regola di prima). Vale anche per l'IA.
agenti_senza_navi = true
; Gli agenti si imbarcano da qualunque provincia con il porto costruito, anche di un'altra fazione (richiesta di Federico,
; 2026-11-11): cosi' possono tornare per mare da una provincia straniera. false = solo dai propri porti. Le truppe sempre
; e solo dai propri porti.
agenti_da_ogni_porto = true
; Oceani della mappa del mondo (richiesta di Federico del 16/11/2026): gli agenti senza navi si muovono per i mari ma non
; per gli oceani; per attraversare una di queste zone serve una flotta propria nella zona, come per le truppe (le flotte
; alleate non contano). Sono le acque aperte tra i continenti: Atlantico centrale, equatoriale, meridionale e sudorientale,
; mar di Groenlandia e dei Sargassi; Pacifico settentrionale, equatoriale e meridionale; Oceano Indiano centrale e
; meridionale, Oceano Australe, Mar Glaciale Artico. Le coste dei continenti restano mari (Atlantico occidentale e
; sudoccidentale, mar del Labrador, Pacifico orientale, nordorientale, sudorientale e nordoccidentale, Oceano Indiano
; occidentale), cosi' come lo stretto di Bering. Sulla mappa d'Europa nessuna zona e' oceano. Vale anche per l'IA.
oceani = ["ID_MID_ATLANTIC", "ID_EQ_ATLANTIC", "ID_S_ATLANTIC", "ID_SE_ATLANTIC", "ID_GREENLAND_SEA", "ID_SARGASSO_SEA", "ID_N_PACIFIC", "ID_EQ_PACIFIC", "ID_S_PACIFIC", "ID_C_INDIAN", "ID_S_INDIAN", "ID_SOUTHERN_OCEAN", "ID_ARCTIC_OCEAN"]

[ammiragli]
; Ammiragli al comando delle flotte (richiesta di Federico del 2026-11-13, ADR-056; dall'originale: «La comanda un
; ammiraglio. Gli ammiragli salgono di rango vincendo le battaglie. Aumentano la capacita' di combattimento della flotta»).
; Le stelle dell'ammiraglio valgono come quelle di comando (peso f di [forza]). PROVVISORIO: stelle iniziali e vittorie per
; stella non sono nei file dell'originale. Gli Auror hanno sempre stelle_max (ammiragli_al_massimo in auror.cfg).
attivi = true
stelle_iniziali = 0
stelle_max = 10
vittorie_per_stella = 2

[prigionieri]
; ADR-073, manuale p32 e p56 e richiesta di Federico: in battaglia si fanno prigionieri. Chi perde e si ritira lascia
; prigioniera questa quota dei suoi sopravvissuti (pila per pila); chi non ha vie di ritirata, la guarnigione di un castello
; espugnato o affamato e i comandanti degli eserciti annientati sono catturati per intero. Il vincitore li libera, chiede il
; riscatto (chi ha perso paga o rifiuta, e allora sono giustiziati) o li giustizia tutti. Riscatto per uomo = costo
; dell'unita' / uomini dell'unita' x quota_riscatto, piu' i personaggi catturati. Tutto PROVVISORIO
quota_catturati = 0.3
quota_riscatto = 0.5
riscatto_generale = 500
riscatto_principe = 1500
riscatto_re = 3000
; l'IA vincitrice giustizia invece di chiedere il riscatto se il suo capo ha almeno questo terrore
terrore_esecuzione_ia = 8

[prova]
; Solo per i test: 0 = esito casuale, 1 = vince sempre l'attaccante, -1 = vince sempre il difensore.
; Il sorteggio viene fatto comunque, per non cambiare l'ordine dei numeri casuali.
esito_forzato = 0
