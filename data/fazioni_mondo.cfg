; Fazioni nuove della mappa del mondo (ADR-079, richiesta di Federico del 16/11/2026: «Giapponesi, Cinesi, Aztechi, Inca,
; poi una per il centro Africa e una per il nord America»; scelte: Kanem per l'Africa centrale, Mississippiani per i nativi
; nordamericani, ribattezzati Cahokia dalla loro citta' maggiore il 17/11/2026, ADR-089). Esistono solo sulla mappa del mondo, in tutte e due le modalita'.
;
; Per ora usano unita', edifici e ritratti gia' nel gioco: `modello` e' la fazione dell'originale di cui prendono unita' ed
; edifici arruolabili e costruibili (WorldFactions.add_to_units/add_to_buildings, PROVVISORIO finche' non arrivano le unita'
; proprie, per i Giapponesi in prompt/unita_giapponesi_agenti_asiatici.md del progetto MTW); i ritratti escono dalla serie
; della loro religione. Regioni, edifici ed eserciti di partenza stanno in data/mappa_mondo/fazioni_mondo.txt, i nomi dei
; personaggi in data/nomi_personaggi.cfg, nomi, colori e stemmi in data/fazioni.cfg (stemmi provvisori disegnati da
; tools/prepara_stemmi_mondo.py).

[FN_JAPANESE]
modello = "FN_CUMANS"
; isole: per l'IA e' una fazione navale (Federico, 18/11/2026: «restano troppo statici e passivi»)
navale = true

[FN_CHINESE]
modello = "FN_LITHUANIANS"

[FN_AZTECS]
modello = "FN_LITHUANIANS"

[FN_INCA]
modello = "FN_LITHUANIANS"

[FN_KANEM]
modello = "FN_ALMOHAD"

[FN_MISSISSIPPIANS]
modello = "FN_LITHUANIANS"

; Coreani, Mongoli, Chola e Khmer (ADR-088, Federico 17/11/2026: fazioni per usare i ritratti coreani, mongoli, indiani e
; del Sud-est asiatico). Le unita' coreane della XL sono solo dell'Orda d'Oro, da qui il modello di Coreani e Mongoli.

[FN_KOREANS]
modello = "FN_GOLDEN_HORDE"

[FN_MONGOLS]
modello = "FN_GOLDEN_HORDE"

[FN_CHOLA]
modello = "FN_LITHUANIANS"

[FN_KHMER]
modello = "FN_LITHUANIANS"
