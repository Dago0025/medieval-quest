; Luoghi leggendari (richiesta di Federico del 26/11/2026, specifica di progetto specifiche/luoghi_leggendari.md).
; Letti da LegendarySites (src/sim/legendary_sites.gd); posizioni sulla plancia del mondo in posizioni.cfg
; (tools/mondo/posiziona_luoghi.py: lontane da castelli, porti, pedine e nomi delle regioni). Valori PROVVISORI.
;
; Chiavi di un luogo [nome_id]:
;   categoria          storico | mitologico | marino
;   simbolo            simbolo del medaglione (assets/luoghi/simboli/<simbolo>_<categoria>.png, tools/prepara_simboli_luoghi.py)
;   regione            provincia o zona di mare che lo ospita
;   lat, lon           punto reale (per la posizione sulla plancia); assenti = il punto piu' libero della regione
;   solo_auror         true = esiste solo nella modalita' Auror
;   fantasma_ogni      il luogo si manifesta un anno ogni N (Hy-Brasil, Shambhala): fuori da quegli anni non si vede
;   nome, nome_en, descrizione, descrizione_en
;   effetti            {chiave: valore} per chi possiede la provincia (terra), vedi VOCABOLARIO
;   effetti_religione  {"CATHOLIC": {...}, "altre": {...}}: si sommano a `effetti` secondo la religione del proprietario
;   dopo_anno, effetti_dopo, nome_dopo, nome_dopo_en   dall'anno indicato valgono `effetti_dopo` (rovine)
;   transito           (mare) {"perdite": % per flotta e anno di perdere una nave}; chi presidia la zona e' immune
;   presidio_anni      (mare) anni di fila con flotta propria nella zona, senza flotte nemiche, per il presidio
;   presidio           (mare) effetti per tutta la fazione che presidia: commercio_marittimo, tempeste
;   scoperta           esito una tantum alla prima conquista di ogni fazione (vedi ESITI)
;   eventi             id delle sezioni [evento.<id>] del luogo
;
; VOCABOLARIO degli effetti continui (assenti = nessun effetto):
;   agricoltura, commercio, miniere, reddito, commercio_marittimo   % sul reddito della provincia
;   lealta                         punti di lealta' della provincia (base 100, rivolta sotto 100)
;   valore_emissari, valore_spie, valore_religiosi   stelle degli agenti arruolati nella provincia
;   armi_reclute                   livelli di armi delle truppe arruolate nella provincia (ADR-049)
;   mantenimento                   denari l'anno pagati dal proprietario
;   difesa                         % sul moltiplicatore del castello negli assalti; anni_assedio = anni in piu' prima della fame
;   terremoti, carestia, peste, inondazioni   % sulla probabilita' del disastro nella provincia (+100 = doppia)
;   conversione                    {"CATHOLIC": punti} (CATHOLIC, ORTHODOX, MUSLIM, PAGAN, IMPERIAL, DHARMA): ogni anno la popolazione si sposta di tanti punti verso quella religione
;   tempeste                       % sulla probabilita' delle tempeste per tutte le flotte del proprietario
;   bersaglio_ia                   % di desiderio dell'IA per la provincia
;
; ESITI (scoperta ed eventi): tesoro, pieta_capo, terrore_capo, influenza_capo, acume_capo, lealta_generali,
;   stelle (comandante presente), vita (anni di vita del comandante presente), muore (il comandante presente muore),
;   navi_perse, uomini_persi (% della forza presente), ordine {"punti": n, "anni": n} (lealta' temporanea),
;   conversione {"CATHOLIC": punti} (CATHOLIC, ORTHODOX, MUSLIM, PAGAN, IMPERIAL, DHARMA), fine_luogo (true: il luogo perde ogni effetto ed evento).
;
; EVENTI [evento.<id>]: luogo, tipo (ricorrente | condizionato | storico), titolo/_en, testo/_en;
;   ricorrente: ogni = [min, max] anni; condizionato: chi = generale | flotta | agente, probabilita (% l'anno),
;   una_volta = personaggio | fazione (assente = ripetibile con `attesa` anni), religioni = [...] (solo per queste);
;   storico: anno; opzioni = [{testo, testo_en, richiede {costo, stelle, religioni, edificio}, esiti [{p, ...}], ia}]
;   oppure esito {...} senza scelta. L'IA sceglie l'opzione possibile con `ia` piu' alto (ADR-015).

; FREQUENZA [generale] (richiesta di Federico del 27/11/2026: eventi «un po' troppo frequenti», PROVVISORIA):
;   scala_intervalli         moltiplica gli intervalli `ogni` degli eventi ricorrenti
;   scala_probabilita        moltiplica la `probabilita` degli eventi condizionati sotto il 100%
;   max_eventi_fazione_anno  eventi ricorrenti e condizionati al massimo per fazione e anno (gli storici non contano)
[generale]
scala_intervalli=1.5
scala_probabilita=0.6
max_eventi_fazione_anno=1

