; Nave d'elite (richieste di Federico del 16/11/2026, ADR-076): fregata a tre alberi con corazze dorate e cannoni, solo per
; gli Auror, con le caratteristiche che la caracca aveva nella mod (300 fiorini, mantenimento 3, un anno, solo il porto,
; raggio 3, attacco 9, difesa 6, velocita' 4), mentre la caracca torna quella della XL originale (`ripristina_originali` in
; [comune]). `nave` = colonna 33 del prod (raggio, attacco navale, difesa navale, velocita', forza, messaggio di
; affondamento); `regioni = []` = in ogni provincia degli Auror con un porto; `sostituisce_nello_startpos`: in modalita'
; Auror le flotte di partenza degli Auror (48 caracche nello startpos dell'installazione) sono di fregate.
; Dal 16/11/2026 (richiesta di Federico) anche le navi lunghe delle flotte degli Auror diventano fregate; le navi delle
; altre fazioni restano quelle che sono.
[AurorDragonFrigate]
modello = "Carrack"
immagine = "unita_auror/AU10.png"
costo = 300
mantenimento = 3
nave = "3,9,6,4,0, carrack sunk message"
regioni = []
sostituisce_nello_startpos = ["Carrack", "Longboat"]
; tempeste (richiesta di Federico del 18/11/2026: affondavano troppo spesso): probabilita' moltiplicata per questo fattore
