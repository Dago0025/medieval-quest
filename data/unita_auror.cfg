[AurorAnkalagon]
; Ankalagon, il drago di Darkos (richiesta di Federico del 23/11/2026: «unita' unica e non arruolabile, le statistiche
; letteralmente devastanti»): un solo membro, nell'armata iniziale dell'Imperatore Dio (`armata_iniziale_re`).
; `unica` = non si arruola, non si riaddestra e non compare nella finestra di arruolamento; `invulnerabile` = non perde mai
; il suo unico membro (scontri, ritirate, peste, carestia); e' la guardia del re (`guardia_del_re`): Darkos lo cavalca, non
; se ne separa (non si stacca dal suo esercito) e se manca torna con lui; `pedina` = l'armata che lo porta ha la pedina del drago
; (campmap/pieces/Units/Auror/<pedina>_held_*.BIF). Forza: 1 x fattore ~8 x 3000, piu' di un'intera armata d'elite.
modello = "LateRoyalKnights"
immagine = "unita_auror/AU11.png"
costo = 0
mantenimento = 0
uomini = 1
carica = 30
mischia = 30
difesa = 30
armatura = 30
morale = 30
moltiplicatore_forza = 3000.0
unica = true
invulnerabile = true
pedina = "ankalagon"
nome = "Ankalagon"
singolare = "Ankalagon"
descrizione = "Ankalagon il Nero, il drago dell'Imperatore Dio. Le sue scaglie sono schegge di ossidiana su un fuoco che non si spegne mai, e la corazza d'oro gliel'hanno forgiata le fucine di Atlantide. Sul suo dorso, minuscolo al confronto, cavalca Darkos. Dove si posa, gli eserciti si sciolgono come cera."
nome_en = "Ankalagon"
singolare_en = "Ankalagon"
descrizione_en = "Ankalagon the Black, dragon of the God-Emperor. His scales are shards of obsidian over a fire that never dies, and his golden armour was forged in the furnaces of Atlantis. On his back, tiny beside him, rides Darkos. Where he lands, armies melt like wax."
