nome = "Fregate del Drago"
singolare = "Fregata del Drago"
descrizione = "L'orgoglio della flotta degli Auror: tre alberi, vele bianche col drago nero e fianchi corazzati d'oro da cui sporgono i cannoni, con la polena del drago a prua. Veloce da varare e poco costosa da mantenere."
nome_en = "Dragon Frigates"
singolare_en = "Dragon Frigate"
descrizione_en = "The pride of the Auror fleet: three masts, white sails bearing the black dragon and gilded armoured flanks bristling with cannon, a dragon figurehead at the bow. Quick to launch and cheap to keep."

