; Unita' esclusive degli Auror (richiesta di Federico del 15/11/2026, ADR-074): nove unita' d'elite ispirate ai Custodi
; (piu' la Fregata del Drago, nave d'elite del 16/11/2026, ADR-076)
; in chiave medievale, solo in modalita' Auror (ADR-068), arruolabili solo dagli Auror e solo nelle loro quattro province
; d'origine. Non stanno nei prod dell'installazione: AurorUnits copia la riga del `modello` (unita' XL dello stesso genere,
; per corpo, cavalcatura, arma e classi) e ci scrive sopra i valori di questa sezione, poi la legge come le altre.
;
; Valori: costo e mantenimento in fiorini, uomini, carica/mischia/difesa/armatura come CHARGE_BONUS, MELEE_BONUS,
; DEFENCE_BONUS, ARMOUR_LEVEL della colonna 21, morale = colonna 18. `moltiplicatore_forza` moltiplica la forza della pila
; nella risoluzione automatica (Combat.stack_strength): «inarrestabili», ognuna vince da sola contro la piu' forte unita'
; XL della sua classe in almeno il 95% degli scontri in campo aperto (test_unita_auror). Testi in italiano e in inglese.
; Immagini: carta e scheda rifatte da AI Playground (AIPG_Image_00575-00581, 00583, 00587) con tools/prepara_unita_auror.py.

[comune]
fazione = "FN_DANISH"
; ADR-078 (16/11/2026): sulla mappa del mondo i cinque territori dell'isola di Atlantide (scelta di Federico: tutti e 5)
regioni = ["ID_ATLANTIS", "ID_GADEIRA", "ID_AMPHERIA", "ID_MNESEIA", "ID_DIAPREPIA"]
; unita' di guardia del capo della fazione: il re ha sempre una pila di questa unita' nel suo esercito. Dal 23/11/2026
; (richiesta di Federico: «Ankalagon deve essere la pedina di Darkos, devono essere la stessa cosa; invece della sua unita'
; di cavalieri deve avere solo Ankalagon») e' Ankalagon, prima erano i Corazzieri del Drago (che restano arruolabili)
guardia_del_re = "AurorAnkalagon"
; armata completa del re in una partita nuova (richiesta di Federico: Darkos parte in un'armata di sole unita' esclusive);
; le truppe che comandava nello startpos restano in un esercito a parte nella stessa regione, con un generale
; dal 23/11/2026 Ankalagon (la guardia del re) al posto dei due Corazzieri, piu' un reparto di Pretori Dorati
armata_iniziale_re = ["AurorAnkalagon", "AurorGoldenPraetors", "AurorGoldenPraetors", "AurorDragonCustodians", "AurorDragonCustodians", "AurorShieldSentinels", "AurorShieldSentinels", "AurorThroneImmortals", "AurorThroneImmortals", "AurorSilentSisters", "AurorSilentSisters", "AurorThroneFusiliers", "AurorThroneFusiliers", "AurorDragonBombard", "AurorGoldenCulverin", "AurorGoldenPraetors", "AurorDragonCustodians", "AurorShieldSentinels", "AurorThroneFusiliers", "AurorGoldenPraetors"]
; ADR-126 (richiesta di Federico del 23/11/2026): alla partenza gli Auror hanno solo tre armate d'elite, quella del re piu'
; queste, uguali ad `armata_iniziale_re` e con un generale, nelle altre province (le truppe della XL e i dodici eserciti della
; mod sono tolti dallo startpos); flotte: cinque da 20 Fregate del Drago (blocchi «flotta N» dello startpos)
armate_iniziali_altre = 2
; composizione delle altre armate: come quella del re, con due Custodi del Drago al posto dei Corazzieri (guardia del solo re)
armata_iniziale_altre = ["AurorDragonCustodians", "AurorDragonCustodians", "AurorGoldenPraetors", "AurorGoldenPraetors", "AurorDragonCustodians", "AurorDragonCustodians", "AurorShieldSentinels", "AurorShieldSentinels", "AurorThroneImmortals", "AurorThroneImmortals", "AurorSilentSisters", "AurorSilentSisters", "AurorThroneFusiliers", "AurorThroneFusiliers", "AurorDragonBombard", "AurorGoldenCulverin", "AurorGoldenPraetors", "AurorDragonCustodians", "AurorShieldSentinels", "AurorThroneFusiliers"]
; nella finestra di arruolamento degli Auror queste unita' vengono prima di tutte le altre (AurorUnits.elite_first)
; unita' dell'installazione che in modalita' Auror tornano come nella XL originale (righe di data/scenari/storico/unita.json):
; la caracca della mod (300 fiorini, solo Auror) lascia il posto alla Fregata del Drago (richiesta di Federico del 16/11)
ripristina_originali = ["Carrack"]

